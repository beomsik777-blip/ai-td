<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Sudoku Grand Master 30</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        
        body { 
            background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .highlight-line { background-color: rgba(56, 189, 248, 0.08) !important; }
        .user-cell.selected { background-color: rgba(56, 189, 248, 0.3) !important; box-shadow: inset 0 0 10px #38bdf8; border: 2px solid #38bdf8 !important; }

        .completed-section { 
            background-color: rgba(16, 185, 129, 0.15) !important; 
            animation: pulse-green 0.8s ease-out; 
        }
        @keyframes pulse-green {
            0% { background-color: rgba(16, 185, 129, 0.4); }
            100% { background-color: rgba(16, 185, 129, 0.15); }
        }

        .sudoku-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 0; }
        .sudoku-table { 
            width: 94vw; height: 94vw; max-width: 360px; max-height: 360px; 
            border-collapse: collapse; table-layout: fixed; 
            border: 3px solid #38bdf8; background-color: #1e293b; 
        }
        .sudoku-table td { border: 1px solid rgba(56, 189, 248, 0.15); text-align: center; vertical-align: middle; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        
        /* 9x9 전용 테두리 */
        .grid-9 td:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .grid-9 tr:nth-child(3n) td { border-bottom: 3px solid #38bdf8; }

        /* 6x6 전용 테두리 교정 */
        .grid-6 td:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .grid-6 tr:nth-child(2n) td { border-bottom: 3px solid #38bdf8; }
        
        .fixed-cell { background-color: #0f172a; color: #ffffff; font-weight: bold; cursor: default; }
        .user-cell { color: #38bdf8; }
        .user-cell.wrong { color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.2) !important; animation: shake 0.3s; }
        .hint-cell { color: #facc15 !important; background-color: rgba(251, 206, 7, 0.1); font-weight: bold; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .damage-flash { animation: flash-red 0.4s; }
        @keyframes flash-red { 0% { background-color: transparent; } 50% { background-color: rgba(239, 68, 68, 0.25); } 100% { background-color: transparent; } }

        .pad-area { padding: 5px 10px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid #334155; }
        .number-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; max-width: 350px; margin: 0 auto; }
        .num-btn { background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; min-height: 50px; }
        .num-btn.completed { opacity: 0.15; pointer-events: none; }
        .num-btn.hidden { display: none; }
        .num-btn:active { transform: scale(0.9); background-color: #38bdf8; }
        .eraser-btn { background-color: #334155; border-color: #94a3b8; }

        .action-area { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; width: 100%; max-width: 350px; margin: 8px auto 0; }
        .hint-btn { background-color: #854d0e; border: 1px solid #facc15; color: #facc15; border-radius: 8px; font-weight: bold; font-size: 11px; height: 44px; }
        .submit-btn { background-color: #2563eb; border: none; color: white; border-radius: 8px; font-weight: bold; font-size: 12px; height: 44px; }

        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; align-items: center; padding-top: 40px; z-index: 100; backdrop-filter: blur(10px); overflow-y: auto; }
        .stage-section { width: 92%; max-width: 340px; margin-bottom: 25px; }
        .stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .stage-btn { aspect-ratio: 1/1; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; position: relative; font-size: 0.9rem; }
        .stage-btn.locked { opacity: 0.2; pointer-events: none; }
        .stage-btn.cleared { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.05); }
        .section-title { font-size: 0.8rem; color: #38bdf8; margin-bottom: 12px; padding-left: 8px; border-left: 4px solid #38bdf8; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>

        function renderStages() {
            const cleared = JSON.parse(localStorage.getItem('cleared_stages') || "[]");
            const layouts = { 'grid-6x6': [0, 2], 'grid-9x9-basic': [3, 12], 'grid-9x9-inter': [13, 22], 'grid-9x9-adv': [23, 29] };
            for (const [id, r] of Object.entries(layouts)) {
                const el = document.getElementById(id); el.innerHTML = "";
                for (let i = r[0]; i <= r[1]; i++) {
                    const btn = document.createElement('button');
                    const isUnlocked = i === 0 || cleared.includes(i);
                    btn.className = `stage-btn ${cleared.includes(i + 1) ? 'cleared' : ''} ${!isUnlocked ? 'locked' : ''}`;
                    btn.innerText = i + 1;
                    if (isUnlocked) btn.onclick = () => initGame(i);
                    el.appendChild(btn);
                }
            }
        }

        function initGame(idx) {
            currentStageIdx = idx; lives = 3; hints = 3; selectedCell = null;
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('stage-title').innerText = `Stage ${idx + 1} (${stages[idx].size}x${stages[idx].size})`;
            updateStatus(); renderBoard(); startTimer();
            bgm.play().catch(()=>{});
        }

        function updateStatus() {
            document.getElementById('life-display').innerText = `${lives} / 3`;
            document.getElementById('hint-display').innerText = `${hints} / 3`;
            document.getElementById('hint-btn-ui').innerText = `Hint (${hints})`;
        }

        function renderBoard() {
            const table = document.getElementById('sudoku-grid'), data = stages[currentStageIdx];
            table.innerHTML = ""; table.className = `sudoku-table shadow-2xl grid-${data.size}`;
            for (let r = 0; r < data.size; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < data.size; c++) {
                    const td = document.createElement('td');
                    td.style.height = (data.size === 6) ? "16.6%" : "11.1%";
                    if (data.b[r][c] !== 0) { td.innerText = data.b[r][c]; td.className = "fixed-cell"; }
                    else { td.id = `cell-${r}-${c}`; td.className = "user-cell"; td.onclick = () => selectCell(r, c, td); }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            updateNumPad(); checkSectionCompletions();
        }

        function selectCell(r, c, td) {
            const sz = stages[currentStageIdx].size;
            document.querySelectorAll('td').forEach(el => el.classList.remove('selected', 'highlight-line'));
            selectedCell = { r, c }; td.classList.add('selected');
            for(let i=0; i<sz; i++) {
                const row = document.querySelector(`.sudoku-table tr:nth-child(${r+1}) td:nth-child(${i+1})`);
                const col = document.querySelector(`.sudoku-table tr:nth-child(${i+1}) td:nth-child(${c+1})`);
                if(row) row.classList.add('highlight-line');
                if(col) col.classList.add('highlight-line');
            }
        }

        function updateNumPad() {
            const pad = document.getElementById('number-pad'), data = stages[currentStageIdx]; pad.innerHTML = "";
            const counts = Array(10).fill(0);
            for (let r = 0; r < data.size; r++) for (let c = 0; c < data.size; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                const val = data.b[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                if (val > 0) counts[val]++;
            }
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('div');
                const rem = Math.max(0, (data.size === 6 ? 6 : 9) - counts[i]);
                btn.className = `num-btn ${rem === 0 ? 'completed' : ''} ${i > data.size ? 'hidden' : ''}`;
                btn.innerHTML = `<span class="text-xs font-bold">${i}</span><span class="text-[7px] text-slate-500">${rem} left</span>`;
                btn.onclick = () => fillNumber(i);
                pad.appendChild(btn);
            }
            const eraBtn = document.createElement('div'); eraBtn.className = "num-btn eraser-btn"; eraBtn.innerHTML = `<span class="text-[9px] font-bold">X</span>`;
            eraBtn.onclick = () => { if(selectedCell) { 
                const target = document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`);
                target.innerText = ""; target.classList.remove('wrong', 'hint-cell', 'completed-section');
                updateNumPad(); checkSectionCompletions(); 
            }};
            pad.appendChild(eraBtn);
        }

        function fillNumber(num) {
            if (!selectedCell) return;
            const target = document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`);
            const correctNum = stages[currentStageIdx].s[selectedCell.r][selectedCell.c];
            if (num === correctNum) { target.innerText = num; target.classList.remove('wrong'); } 
            else { 
                lives--; target.innerText = num; target.classList.add('wrong'); 
                triggerDamageEffect(); updateStatus(); 
                if (lives <= 0) setTimeout(() => { alert("GAME OVER!"); location.reload(); }, 100);
            }
            updateNumPad(); checkSectionCompletions();
        }

        function triggerDamageEffect() { document.getElementById('game-body').classList.add('damage-flash'); setTimeout(() => document.getElementById('game-body').classList.remove('damage-flash'), 400); }

        function checkSectionCompletions() {
            const data = stages[currentStageIdx];
            const board = Array.from({length:data.size}, (_,r) => Array.from({length:data.size}, (_,c) => {
                const cell = document.getElementById(`cell-${r}-${c}`);
                return data.b[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
            }));
            document.querySelectorAll('td').forEach(td => td.classList.remove('completed-section'));
            const isDone = (arr) => arr.filter(v => v !== 0).length === data.size && new Set(arr).size === data.size;
            for (let i = 0; i < data.size; i++) {
                if (isDone(board[i])) for (let j = 0; j < data.size; j++) getTd(i, j).classList.add('completed-section');
                const col = board.map(r => r[i]);
                if (isDone(col)) for (let j = 0; j < data.size; j++) getTd(j, i).classList.add('completed-section');
            }
            if (data.size === 9) {
                for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
                    const box = []; for(let r=0; r<3; r++) for(let c=0; c<3; c++) box.push(board[br*3+r][bc*3+c]);
                    if(isDone(box)) for(let r=0; r<3; r++) for(let c=0; c<3; c++) getTd(br*3+r, bc*3+c).classList.add('completed-section');
                }
            } else {
                for (let br = 0; br < 3; br++) for (let bc = 0; bc < 2; bc++) {
                    const box = []; for(let r=0; r<2; r++) for(let c=0; c<3; c++) box.push(board[br*2+r][bc*3+c]);
                    if(isDone(box)) for(let r=0; r<2; r++) for(let c=0; c<3; c++) getTd(br*2+r, bc*3+c).classList.add('completed-section');
                }
            }
        }

        function getTd(r, c) { return document.querySelector(`.sudoku-table tr:nth-child(${r+1}) td:nth-child(${c+1})`); }

        function useHint() {
            if (!selectedCell || hints <= 0) return;
            const target = document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`);
            target.innerText = stages[currentStageIdx].s[selectedCell.r][selectedCell.c];
            target.classList.add('hint-cell'); target.classList.remove('wrong');
            hints--; updateStatus(); updateNumPad(); checkSectionCompletions();
        }

        function startTimer() { startTime = Date.now(); timerInterval = setInterval(() => { const d = new Date(Date.now()-startTime); document.getElementById('timer-display').innerText = d.toISOString().substr(14, 5); }, 1000); }

                const cell = document.getElementById(`cell-${r}-${c}`);
                const val = data.b[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                if (val === 0) empty++; else if (val !== data.s[r][c]) wrong++;
            }
            if (empty > 0) alert("채워지지 않은 칸이 있어!");
            else if (wrong === 0) { clearInterval(timerInterval); document.getElementById('ad-overlay').style.display = 'flex'; }
            else alert("오답이 포함되어 있어!");
        }

        function finishGame() {
            const cleared = JSON.parse(localStorage.getItem('cleared_stages') || "[]");
            if (!cleared.includes(currentStageIdx + 1)) cleared.push(currentStageIdx + 1);
            localStorage.setItem('cleared_stages', JSON.stringify(cleared));
            localStorage.setItem('user_int', (parseInt(localStorage.getItem('user_int')) || 0) + 1);
            localStorage.setItem('user_coin', (parseInt(localStorage.getItem('user_coin')) || 100) + 10);
            location.href = 'index.html';
        }

        function toggleMusic() {
            if (bgm.paused) { bgm.play(); document.getElementById('music-btn').innerText = "BGM: ON"; }
            else { bgm.pause(); document.getElementById('music-btn').innerText = "BGM: OFF"; }
        }
    </script>
</body>
</html>
