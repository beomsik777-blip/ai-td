<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuestBody - Sudoku Master Elite</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

body{
background-color:#0f172a;
color:white;
font-family:'Orbitron','Noto Sans KR',sans-serif;
margin:0;
padding:0;
height:100dvh;
width:100vw;
display:flex;
flex-direction:column;
overflow:hidden;
}

.highlight-line{background-color:rgba(56,189,248,0.08)!important;}
.selected{background-color:rgba(56,189,248,0.3)!important;box-shadow:inset 0 0 15px #38bdf8;border:2px solid #38bdf8!important;}

.completed-section{
background-color:rgba(16,185,129,0.25)!important;
box-shadow:inset 0 0 8px rgba(16,185,129,0.3);
transition:background-color .4s ease;
}

.sudoku-container{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;}

.sudoku-table{
width:92vw;
height:92vw;
max-width:340px;
max-height:340px;
border-collapse:collapse;
table-layout:fixed;
border:3px solid #38bdf8;
background-color:#1e293b;
}

.sudoku-table td{
border:1px solid rgba(56,189,248,0.15);
text-align:center;
vertical-align:middle;
font-size:1.1rem;
cursor:pointer;
height:11.11%;
transition:.2s;
}

.sudoku-table td:nth-child(3n){border-right:3px solid #38bdf8;}
.sudoku-table tr:nth-child(3n) td{border-bottom:3px solid #38bdf8;}

.fixed-cell{background-color:#0f172a;color:#ffffff;font-weight:bold;cursor:default;}
.user-cell{color:#38bdf8;}
.user-cell.wrong{color:#ef4444!important;background-color:rgba(239,68,68,0.2)!important;animation:shake .3s;}
.hint-cell{color:#facc15!important;background-color:rgba(251,206,7,0.1);font-weight:bold;}

@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

.pad-area{padding:5px 10px;background:rgba(15,23,42,0.8);border-top:1px solid #334155;}

.number-pad{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
width:100%;
max-width:350px;
margin:0 auto;
}

.num-btn{
background-color:#1e293b;
border:1px solid #38bdf8;
border-radius:6px;
padding:5px 0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:.2s;
min-height:45px;
}

.num-btn.completed{opacity:.15;pointer-events:none;}
.eraser-btn{background-color:#334155;border-color:#94a3b8;}

.action-area{
display:grid;
grid-template-columns:1fr 1.5fr;
gap:8px;
width:100%;
max-width:350px;
margin:8px auto 0;
}

.hint-btn{
background-color:#854d0e;
border:1px solid #facc15;
color:#facc15;
border-radius:8px;
font-weight:bold;
font-size:11px;
height:48px;
}

.submit-btn{
background-color:#2563eb;
border:none;
color:white;
border-radius:8px;
font-weight:bold;
font-size:12px;
height:48px;
box-shadow:0 4px 10px rgba(37,99,235,0.3);
}

.overlay{
position:fixed;
inset:0;
background:rgba(15,23,42,0.98);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:100;
backdrop-filter:blur(10px);
}

.stage-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
width:90%;
max-width:320px;
}

.stage-btn{
aspect-ratio:1/1;
background:#1e293b;
border:1px solid #38bdf8;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
cursor:pointer;
position:relative;
}

.stage-btn.locked{opacity:.3;pointer-events:none;}
.stage-btn.cleared{border-color:#10b981;color:#10b981;}
</style>
</head>

<body id="game-body">

<audio id="bgm" loop preload="auto">
<source src="music/brainbgm.mp3" type="audio/mpeg">
</audio>

<div id="start-overlay" class="overlay">
<h2 class="text-xl font-bold text-blue-400 mb-6 tracking-widest uppercase italic text-center">
Sudoku Master 10
</h2>
<div id="stage-list" class="stage-grid"></div>
</div>

<header class="p-3 flex justify-between items-center shrink-0">
<button onclick="location.href='index.html'" class="text-slate-400 text-xs font-bold uppercase">◀ Hub</button>
<h1 id="stage-title" class="text-xs font-bold text-purple-400 uppercase tracking-widest italic text-center flex-1">Sudoku</h1>
<button onclick="toggleMusic()" id="music-btn" class="text-[9px] text-slate-500 border border-slate-700 px-2 py-1 rounded">BGM: OFF</button>
</header>

<div class="sudoku-container">
<table id="sudoku-grid" class="sudoku-table shadow-2xl"></table>
</div>

<script>

let currentStageIdx = 0;
let selectedCell = null;
let puzzle = [];
let solution = [];

window.onload = () => renderStages();

function renderStages(){
const list=document.getElementById('stage-list');
list.innerHTML="";
for(let i=1;i<=10;i++){
const btn=document.createElement('button');
btn.className='stage-btn';
btn.innerText=i;
btn.onclick=()=>initGame(i-1);
list.appendChild(btn);
}
}

function initGame(idx){
currentStageIdx=idx;
document.getElementById('start-overlay').style.display='none';
generateSudoku();
renderBoard();
}

function generateSudoku(){

solution=createSolvedBoard();
puzzle=JSON.parse(JSON.stringify(solution));

let removeCount=35+(currentStageIdx*2);

while(removeCount>0){

let r=Math.floor(Math.random()*9);
let c=Math.floor(Math.random()*9);

if(puzzle[r][c]===0) continue;

let backup=puzzle[r][c];
puzzle[r][c]=0;

let copy=JSON.parse(JSON.stringify(puzzle));

if(countSolutions(copy)!==1){
puzzle[r][c]=backup;
continue;
}

removeCount--;

}

}

function countSolutions(board){

let count=0;

function solveCount(b){

for(let r=0;r<9;r++){
for(let c=0;c<9;c++){

if(b[r][c]===0){

for(let n=1;n<=9;n++){

if(isValid(b,r,c,n)){

b[r][c]=n;
solveCount(b);
b[r][c]=0;

if(count>1) return;

}

}

return;

}

}
}

count++;

}

solveCount(board);

return count;

}

function createSolvedBoard(){

let board=Array.from({length:9},()=>Array(9).fill(0));
solveSudoku(board);
return board;

}

function solveSudoku(board){

for(let r=0;r<9;r++)
for(let c=0;c<9;c++){

if(board[r][c]===0){

let nums=[1,2,3,4,5,6,7,8,9];
nums.sort(()=>Math.random()-0.5);

for(let num of nums){

if(isValid(board,r,c,num)){

board[r][c]=num;

if(solveSudoku(board)) return true;

board[r][c]=0;

}

}

return false;

}

}

return true;

}

function isValid(board,r,c,num){

for(let i=0;i<9;i++){
if(board[r][i]===num || board[i][c]===num) return false;
}

let br=Math.floor(r/3)*3;
let bc=Math.floor(c/3)*3;

for(let i=0;i<3;i++)
for(let j=0;j<3;j++)
if(board[br+i][bc+j]===num) return false;

return true;

}

function renderBoard(){

const table=document.getElementById('sudoku-grid');
table.innerHTML="";

for(let r=0;r<9;r++){

const tr=document.createElement('tr');

for(let c=0;c<9;c++){

const td=document.createElement('td');

if(puzzle[r][c]!==0){

td.innerText=puzzle[r][c];
td.className="fixed-cell";

}else{

td.className="user-cell";
td.onclick=()=>selectCell(r,c,td);

}

tr.appendChild(td);

}

table.appendChild(tr);

}

}

function selectCell(r,c,td){

document.querySelectorAll('td').forEach(el=>el.classList.remove('selected'));
td.classList.add('selected');

selectedCell={r,c};

}

function toggleMusic(){}

</script>

</body>
</html>
