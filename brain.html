<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Sudoku Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        /* 테이블 기반: 절대 뒤틀리지 않는 격자 */
        .sudoku-table {
            width: 90vw; height: 90vw; max-width: 360px; max-height: 360px;
            margin: auto; border-collapse: collapse; table-layout: fixed;
            border: 2px solid #38bdf8; background-color: #1e293b;
        }
        .sudoku-table td {
            border: 1px solid #38bdf8; padding: 0; text-align: center; vertical-align: middle;
        }
        /* 3x3 박스 강조선 */
        .sudoku-table td:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .sudoku-table tr:nth-child(3n) td { border-bottom: 3px solid #38bdf8; }
        
        .fixed-cell { background-color: #0f172a; color: #ffffff; font-weight: bold; font-size: 1.1rem; }
        input {
            width: 100%; height: 100%; background: transparent; border: none; outline: none;
            color: #38bdf8; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
        }
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="start-overlay" class="overlay">
        <h2 class="text-2xl font-bold text-blue-400 mb-8 tracking-widest uppercase">Brain Protocol</h2>
        <button onclick="startGame()" class="px-12 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg">START</button>
    </div>

    <div id="ad-overlay" class="overlay" style="display: none;">
        <div class="w-72 p-6 bg-slate-800 border-2 border-blue-400 rounded-2xl text-center">
            <div class="text-4xl mb-4">💊</div>
            <h3 class="text-lg font-bold text-white mb-2 uppercase">Mana Potion</h3>
            <div id="ad-timer" class="text-blue-400 text-sm mb-4">Wait 5s...</div>
            <button id="ad-close-btn" onclick="finishGame()" disabled class="w-full py-3 bg-slate-700 text-slate-500 rounded-lg font-bold">CLOSE</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-xs font-bold flex items-center gap-1">◀ BACK</button>
        <h1 class="text-sm font-bold text-purple-400 tracking-tighter uppercase">Sudoku Core</h1>
        <div class="w-8"></div>
    </header>

    <div class="mx-4 mb-4 p-3 bg-slate-900 border border-slate-700 rounded-lg flex justify-around shrink-0 shadow-lg">
        <div class="text-center">
            <p class="text-[8px] text-slate-500 uppercase font-bold">Reward</p>
            <p class="text-purple-400 font-bold text-xs">INT +1</p>
        </div>
        <div class="text-center border-l border-slate-700 pl-6 text-emerald-400 font-bold text-xs" id="timer-display">00:00</div>
    </div>

    <div class="flex-1 flex items-center justify-center min-h-0">
        <table id="sudoku-grid" class="sudoku-table shadow-2xl"></table>
    </div>

    <footer class="p-6 shrink-0">
        <button onclick="checkAnswer()" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl shadow-xl active:bg-purple-500">CHECK ANSWER</button>
    </footer>

    <script>
        const board = [[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];
        const solution = [[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];

        let startTime, timerInterval;

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            const table = document.getElementById('sudoku-grid');
            table.innerHTML = "";
            for (let r = 0; r < 9; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    const td = document.createElement('td');
                    if (board[r][c] !== 0) {
                        td.innerText = board[r][c];
                        td.className = "fixed-cell";
                    } else {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.id = `cell-${r}-${c}`;
                        input.setAttribute('inputmode', 'numeric');
                        input.oninput = function() { if(this.value.length > 1) this.value = this.value.slice(0,1); };
                        td.appendChild(input);
                    }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const delta = Date.now() - startTime;
                const min = Math.floor(delta / 60000).toString().padStart(2, '0');
                const sec = Math.floor((delta % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${min}:${sec}`;
            }, 1000);
        }

        function checkAnswer() {
            let correct = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0) {
                        const val = parseInt(document.getElementById(`cell-${r}-${c}`).value);
                        if (val !== solution[r][c]) { correct = false; break; }
                    }
                }
            }
            if (correct) {
                clearInterval(timerInterval);
                document.getElementById('ad-overlay').style.display = 'flex';
                let timeLeft = 5;
                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) document.getElementById('ad-timer').innerText = `Wait ${timeLeft}s...`;
                    else {
                        clearInterval(timer);
                        document.getElementById('ad-timer').innerText = "COMPLETE!";
                        const btn = document.getElementById('ad-close-btn');
                        btn.disabled = false;
                        btn.classList.add('bg-blue-600', 'text-white');
                    }
                }, 1000);
            } else { alert('분석 실패! 숫자를 다시 확인해봐.'); }
        }

        function finishGame() {
            alert('INT +1 상승!');
            location.href = 'index.html';
        }
    </script>
</body>
</html>
