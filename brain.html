<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Sudoku Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header { height: 50px; display: flex; align-items: center; padding: 0 16px; flex-shrink: 0; }
        .stat-bar { height: 50px; margin: 5px 16px; flex-shrink: 0; }
        
        /* 뼈대: 화면 중앙에 게임판과 패드를 고정 */
        .game-main {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 10px; min-height: 0;
        }

        .sudoku-container {
            width: 100%; max-width: min(85vw, 340px);
            aspect-ratio: 1/1; margin-bottom: 10px;
        }

        .sudoku-table {
            width: 100%; height: 100%; border-collapse: collapse;
            table-layout: fixed; border: 2px solid #38bdf8; background-color: #1e293b;
        }
        
        .sudoku-table td {
            border: 1px solid #38bdf8; text-align: center; vertical-align: middle;
            font-size: clamp(1rem, 5vw, 1.4rem);
        }
        .sudoku-table td:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .sudoku-table tr:nth-child(3n) td { border-bottom: 3px solid #38bdf8; }
        
        .fixed-cell { background-color: #0f172a; color: #ffffff; font-weight: bold; }
        .user-cell { color: #38bdf8; cursor: pointer; }
        .user-cell.selected { background-color: #334155; box-shadow: inset 0 0 10px #38bdf8; }

        /* 숫자 패드 최적화 */
        .number-pad {
            display: grid; grid-template-columns: repeat(9, 1fr);
            gap: 4px; width: 100%; max-width: 360px; flex-shrink: 0;
        }
        .num-btn {
            background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 6px;
            padding: 8px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .num-btn.completed { opacity: 0.2; }
        .num-btn span:first-child { font-size: 14px; font-weight: bold; }
        .num-btn .count { font-size: 8px; color: #94a3b8; }

        footer { height: 70px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }

        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="start-overlay" class="overlay">
        <h2 class="text-2xl font-bold text-blue-400 mb-8 tracking-widest uppercase">Brain Protocol</h2>
        <button onclick="startGame()" class="px-12 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg active:scale-95">START</button>
    </div>

    <div id="ad-overlay" class="overlay" style="display: none;">
        <div class="w-72 p-6 bg-slate-800 border-2 border-blue-400 rounded-2xl text-center">
            <h3 class="text-lg font-bold text-white mb-4 uppercase">Mana Potion Get!</h3>
            <div id="ad-timer" class="text-blue-400 text-sm mb-4">Wait 5s...</div>
            <button id="ad-close-btn" onclick="finishGame()" disabled class="w-full py-3 bg-slate-700 text-slate-500 rounded-lg font-bold">CLOSE</button>
        </div>
    </div>

    <header>
        <button onclick="location.href='index.html'" class="text-slate-400 text-xs font-bold">◀ BACK</button>
        <div class="flex-1 text-center"><h1 class="text-sm font-bold text-purple-400 uppercase">Sudoku Core</h1></div>
        <div class="w-8"></div>
    </header>

    <div class="stat-bar bg-slate-900 border border-slate-700 rounded-lg flex justify-around shadow-lg">
        <div class="text-center py-2"><p class="text-[8px] text-slate-500 font-bold uppercase">Reward</p><p class="text-purple-400 font-bold text-xs">INT +1</p></div>
        <div class="text-center py-2"><p class="text-[8px] text-slate-500 font-bold uppercase">Time</p><p id="timer-display" class="text-emerald-400 font-bold text-xs">00:00</p></div>
    </div>

    <div class="game-main">
        <div class="sudoku-container"><table id="sudoku-grid" class="sudoku-table"></table></div>
        <div id="number-pad" class="number-pad"></div>
    </div>

    <footer>
        <button onclick="checkAnswer()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl shadow-xl active:scale-95">CHECK ANSWER</button>
    </footer>

    <script>
        const board = [[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];
        const solution = [[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];
        let selectedCell = null;
        let startTime, timerInterval;

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            renderBoard();
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const delta = Date.now() - startTime;
                const min = Math.floor(delta / 60000).toString().padStart(2, '0');
                const sec = Math.floor((delta % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${min}:${sec}`;
            }, 1000);
        }

        function renderBoard() {
            const table = document.getElementById('sudoku-grid');
            table.innerHTML = "";
            for (let r = 0; r < 9; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    const td = document.createElement('td');
                    if (board[r][c] !== 0) {
                        td.innerText = board[r][c];
                        td.className = "fixed-cell";
                    } else {
                        td.id = `cell-${r}-${c}`;
                        td.className = "user-cell";
                        td.onclick = () => {
                            if (selectedCell) document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`).classList.remove('selected');
                            selectedCell = { r, c };
                            td.classList.add('selected');
                        };
                    }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            updateNumberPad();
        }

        function updateNumberPad() {
            const pad = document.getElementById('number-pad');
            pad.innerHTML = "";
            const counts = Array(10).fill(0);
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    const val = board[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                    if (val > 0) counts[val]++;
                }
            }
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('div');
                const rem = Math.max(0, 9 - counts[i]);
                btn.className = `num-btn ${rem === 0 ? 'completed' : ''}`;
                btn.innerHTML = `<span>${i}</span><span class="count">${rem}</span>`;
                btn.onclick = () => {
                    if (!selectedCell) return;
                    document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`).innerText = i;
                    updateNumberPad();
                };
                pad.appendChild(btn);
            }
        }

        function checkAnswer() {
            let correct = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    const val = board[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                    if (val !== solution[r][c]) { correct = false; break; }
                }
            }
            if (correct) {
                clearInterval(timerInterval);
                document.getElementById('ad-overlay').style.display = 'flex';
                let left = 5;
                const t = setInterval(() => {
                    left--;
                    if (left > 0) document.getElementById('ad-timer').innerText = `Wait ${left}s...`;
                    else {
                        clearInterval(t); document.getElementById('ad-timer').innerText = "DONE!";
                        const b = document.getElementById('ad-close-btn');
                        b.disabled = false; b.classList.replace('bg-slate-700', 'bg-blue-600'); b.classList.replace('text-slate-500', 'text-white');
                    }
                }, 1000);
            } else alert('분석 실패! 다시 확인해!');
        }

        function finishGame() {
            localStorage.setItem('user_int', (parseInt(localStorage.getItem('user_int')) || 0) + 1);
            location.href = 'index.html';
        }
    </script>
</body>
</html>
