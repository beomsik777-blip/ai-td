<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Sudoku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* 그리드 영역: 화면 크기에 맞춰 반응형으로 조절 */
        .sudoku-container-box {
            width: 95vw;
            max-width: 380px;
            margin: 0 auto;
        }

        .sudoku-grid { 
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            background-color: #38bdf8; /* 격자 선 색상 */
            border: 2px solid #38bdf8;
            gap: 1px;
        }

        .cell { 
            aspect-ratio: 1 / 1;
            background-color: #1e293b; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }

        /* 고정 숫자 (시스템 숫자) */
        .cell.fixed { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* 입력 숫자 */
        .cell input { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            text-align: center; 
            color: #38bdf8; 
            border: none; 
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            padding: 0;
            appearance: none;
        }

        /* 3x3 박스 구분선 강화 */
        .cell:nth-child(3n):not(:nth-child(9n)) { border-right: 2px solid #38bdf8; }
        .cell:nth-child(n+19):nth-child(-n+27), 
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #38bdf8; }

        .overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <div id="start-overlay" class="overlay">
        <h2 class="text-2xl font-bold text-blue-400 mb-6 tracking-widest text-center">BRAIN PROTOCOL</h2>
        <button onclick="startGame()" class="px-10 py-4 bg-blue-600 text-white font-bold rounded-xl border-b-4 border-blue-800 transition-all active:translate-y-1 active:border-b-0 shadow-[0_0_20px_rgba(37,99,235,0.4)]">
            SYNC START
        </button>
    </div>

    <div id="ad-overlay" class="overlay" style="display: none;">
        <div class="w-72 p-6 bg-slate-800 border-2 border-blue-400 rounded-2xl text-center shadow-2xl">
            <div class="text-4xl mb-4">💊</div>
            <h3 class="text-lg font-bold text-white mb-4 uppercase">AD: Mana Potion</h3>
            <div id="ad-timer" class="text-blue-400 text-sm mb-4">Wait 5s...</div>
            <button id="ad-close-btn" onclick="finishGame()" disabled class="w-full py-3 bg-slate-700 text-slate-500 rounded-lg font-bold transition-all">CLOSE</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-xs flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            BACK
        </button>
        <h1 class="text-lg font-bold text-purple-400 tracking-wider">SUDOKU INT+1</h1>
        <div class="w-8"></div>
    </header>

    <div class="mx-4 mb-4 p-3 bg-slate-900/80 border border-slate-700 rounded-lg flex justify-around shrink-0">
        <div class="text-center">
            <span class="text-[10px] text-slate-400 block uppercase font-bold">Reward</span>
            <span class="text-purple-400 font-bold text-sm">INT +1</span>
        </div>
        <div class="text-center border-l border-slate-700 pl-4">
            <span class="text-[10px] text-slate-400 block uppercase font-bold">Time</span>
            <span id="timer-display" class="text-emerald-400 font-bold text-sm">00:00</span>
        </div>
    </div>

    <div class="flex-1 flex items-center justify-center">
        <div class="sudoku-container-box">
            <div id="sudoku-grid" class="sudoku-grid shadow-2xl">
            </div>
        </div>
    </div>

    <footer class="p-6 shrink-0">
        <button onclick="checkAnswer()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl border-b-4 border-purple-800 active:translate-y-1 active:border-b-0 shadow-lg transition-all">
            CHECK ANSWER
        </button>
    </footer>

    <script>
        // 로그인 체크
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            location.href = 'login.html';
        }

        // 초기 보드 (0은 빈칸)
        const board = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0], [6, 0, 0, 1, 9, 5, 0, 0, 0], [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3], [4, 0, 0, 8, 0, 3, 0, 0, 1], [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0], [0, 0, 0, 4, 1, 9, 0, 0, 5], [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        const solution = [
            [5, 3, 4, 6, 7, 8, 9, 1, 2], [6, 7, 2, 1, 9, 5, 3, 4, 8], [1, 9, 8, 3, 4, 2, 5, 6, 7],
            [8, 5, 9, 7, 6, 1, 4, 2, 3], [4, 2, 6, 8, 5, 3, 7, 9, 1], [7, 1, 3, 9, 2, 4, 8, 5, 6],
            [9, 6, 1, 5, 3, 7, 2, 8, 4], [2, 8, 7, 4, 1, 9, 6, 3, 5], [3, 4, 5, 2, 8, 6, 1, 7, 9]
        ];

        let startTime;
        let timerInterval;

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            renderBoard();
            startTimer();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const delta = Date.now() - startTime;
                const min = Math.floor(delta / 60000).toString().padStart(2, '0');
                const sec = Math.floor((delta % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${min}:${sec}`;
            }, 1000);
        }

        function renderBoard() {
            const grid = document.getElementById('sudoku-grid');
            grid.innerHTML = ''; 
            
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (board[r][c] !== 0) {
                        cell.classList.add('fixed');
                        cell.innerText = board[r][c];
                    } else {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.id = `cell-${r}-${c}`;
                        input.setAttribute('inputmode', 'numeric');
                        input.oninput = function() { if(this.value.length > 1) this.value = this.value.slice(0,1); };
                        cell.appendChild(input);
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function checkAnswer() {
            let correct = true;
            let complete = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0) {
                        const input = document.getElementById(`cell-${r}-${c}`);
                        const val = parseInt(input.value);
                        if (!val) { complete = false; break; }
                        if (val !== solution[r][c]) { correct = false; break; }
                    }
                }
                if (!complete) break;
            }

            if (!complete) {
                alert('빈칸을 모두 채워주세요!');
                return;
            }

            if (correct) {
                clearInterval(timerInterval);
                showAd();
            } else {
                alert('틀린 숫자가 있는 것 같아! 다시 한번 확인해볼래?');
            }
        }

        function showAd() {
            const adOverlay = document.getElementById('ad-overlay');
            const adCloseBtn = document.getElementById('ad-close-btn');
            adOverlay.style.display = 'flex';
            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) document.getElementById('ad-timer').innerText = `Wait ${timeLeft}s...`;
                else {
                    clearInterval(timer);
                    document.getElementById('ad-timer').innerText = "AD COMPLETE!";
                    adCloseBtn.disabled = false;
                    adCloseBtn.classList.remove('bg-slate-700', 'text-slate-500');
                    adCloseBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-500', 'shadow-lg');
                }
            }, 1000);
        }

        function finishGame() {
            alert('지능(INT) +1 상승!');
            location.href = 'index.html';
        }
    </script>
</body>
</html>
