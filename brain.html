<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Sudoku Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 90%; max-width: 320px; margin-top: 20px; }
        .stage-btn { aspect-ratio: 1/1; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; transition: 0.2s; }
        .stage-btn.cleared { opacity: 0.2; border-color: #475569; color: #475569; pointer-events: none; }

        .info-panel { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; backdrop-filter: blur(5px); }

        .sudoku-table { width: 85vw; height: 85vw; max-width: 320px; max-height: 320px; margin: auto; border-collapse: collapse; table-layout: fixed; border: 2px solid #38bdf8; background-color: #1e293b; }
        .sudoku-table td { border: 1px solid #38bdf8; text-align: center; vertical-align: middle; font-size: 1.1rem; }
        .sudoku-table td:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .sudoku-table tr:nth-child(3n) td { border-bottom: 3px solid #38bdf8; }
        .fixed-cell { background-color: #0f172a; color: #ffffff; font-weight: bold; }
        .user-cell { color: #38bdf8; cursor: pointer; }
        .user-cell.selected { background-color: #334155; box-shadow: inset 0 0 10px #38bdf8; }

        .number-pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: 90vw; max-width: 360px; margin: 8px auto; }
        .num-btn { background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 6px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; }
        .num-btn.completed { opacity: 0.1; pointer-events: none; }

        .ad-banner { width: 100%; height: 50px; background: #020617; display: flex; align-items: center; justify-content: center; border-top: 1px solid #1e293b; font-size: 10px; color: #475569; shrink-0; }

        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <audio id="bgm" loop>
        <source src="music/brainbgm.mp3" type="audio/mpeg">
    </audio>

    <div id="start-overlay" class="overlay">
        <h2 class="text-xl font-bold text-blue-400 mb-2 tracking-widest uppercase">Select Stage</h2>
        <div id="stage-list" class="stage-grid"></div>
    </div>

    <div id="ad-overlay" class="overlay" style="display: none;">
        <div class="w-72 p-6 bg-slate-800 border-2 border-blue-400 rounded-2xl text-center">
            <h3 class="text-lg font-bold text-white mb-2 uppercase text-emerald-400">Sync Complete!</h3>
            <p class="text-white text-xs mb-6 uppercase">INT +1 Reward</p>
            <button onclick="finishGame()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold">GET REWARD</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-xs font-bold">◀ BACK</button>
        <h1 id="stage-title" class="text-sm font-bold text-purple-400 uppercase">Ready</h1>
        <button onclick="toggleMusic()" id="music-btn" class="text-[10px] text-slate-500 border border-slate-700 px-2 py-1 rounded">BGM: OFF</button>
    </header>

    <div class="info-panel mx-4 mb-2 p-3 rounded-lg flex justify-around shrink-0 shadow-lg">
        <div class="text-center"><p class="text-[8px] text-slate-500 uppercase font-bold">Reward</p><p class="text-purple-400 font-bold text-xs">INT +1</p></div>
        <div class="text-center border-l border-slate-700 pl-6"><p class="text-[8px] text-slate-500 uppercase font-bold">Time</p><p id="timer-display" class="text-emerald-400 font-bold text-xs">00:00</p></div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center min-h-0">
        <div class="sudoku-container"><table id="sudoku-grid" class="sudoku-table"></table></div>
        <div id="number-pad" class="number-pad"></div>
    </div>

    <footer class="p-4 shrink-0">
        <button onclick="checkAnswer()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl shadow-xl active:scale-95 transition-all uppercase">Check Result</button>
    </footer>

    <div class="ad-banner">
        <span>AD SLOT AREA</span>
    </div>

    <script>
        const stages = [
            { b: [[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]], s: [[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]] },
            { b: [[0,0,0,2,6,0,7,0,1],[6,8,0,0,7,0,0,9,0],[1,9,0,0,0,4,5,0,0],[8,2,0,1,0,0,0,4,0],[0,0,4,6,0,2,9,0,0],[0,5,0,0,0,3,0,2,8],[0,0,9,3,0,0,0,7,4],[0,4,0,0,5,0,0,3,6],[7,0,3,0,1,8,0,0,0]], s: [[4,3,5,2,6,9,7,8,1],[6,8,2,5,7,1,4,9,3],[1,9,7,8,3,4,5,6,2],[8,2,6,1,9,5,3,4,7],[3,7,4,6,8,2,9,1,5],[9,5,1,7,4,3,6,2,8],[5,1,9,3,2,6,8,7,4],[2,4,8,9,5,7,1,3,6],[7,6,3,4,1,8,2,5,9]] }
            // ... 나머지 데이터 생략
        ];

        let currentStageIdx = 0;
        let selectedCell = null;
        let startTime, timerInterval;
        const bgm = document.getElementById('bgm');

        window.onload = function() { renderStages(); };

        function toggleMusic() {
            if (bgm.paused) { bgm.play(); document.getElementById('music-btn').innerText = "BGM: ON"; document.getElementById('music-btn').classList.add('text-blue-400'); }
            else { bgm.pause(); document.getElementById('music-btn').innerText = "BGM: OFF"; document.getElementById('music-btn').classList.remove('text-blue-400'); }
        }

        function renderStages() {
            const list = document.getElementById('stage-list');
            list.innerHTML = "";
            const cleared = JSON.parse(localStorage.getItem('cleared_stages') || "[]");
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = `stage-btn ${cleared.includes(i) ? 'cleared' : ''}`;
                btn.innerText = i + "번"; // 마스터 요청: '번' 추가
                btn.onclick = () => { if(!cleared.includes(i)) initGame(i-1); };
                list.appendChild(btn);
            }
        }

        function initGame(idx) {
            currentStageIdx = idx;
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('stage-title').innerText = `STAGE ${idx + 1}`;
            bgm.play().catch(() => {});
            renderBoard();
            startTimer();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const d = Date.now() - startTime;
                const m = Math.floor(d / 60000).toString().padStart(2, '0');
                const s = Math.floor((d % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${m}:${s}`;
            }, 1000);
        }

        function renderBoard() {
            const table = document.getElementById('sudoku-grid');
            table.innerHTML = "";
            const data = stages[currentStageIdx] || stages[0];
            for (let r = 0; r < 9; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    const td = document.createElement('td');
                    if (data.b[r][c] !== 0) { td.innerText = data.b[r][c]; td.className = "fixed-cell"; }
                    else { td.id = `cell-${r}-${c}`; td.className = "user-cell"; td.onclick = () => { if (selectedCell) document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`).classList.remove('selected'); selectedCell = { r, c }; td.classList.add('selected'); }; }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            updateNumberPad();
        }

        function updateNumberPad() {
            const pad = document.getElementById('number-pad');
            pad.innerHTML = "";
            const counts = Array(10).fill(0);
            const data = stages[currentStageIdx] || stages[0];
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    const val = data.b[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                    if (val > 0) counts[val]++;
                }
            }
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('div');
                const rem = Math.max(0, 9 - counts[i]);
                btn.className = `num-btn ${rem === 0 ? 'completed' : ''}`;
                btn.innerHTML = `<span class="text-xs font-bold">${i}번</span><span class="text-[8px] text-slate-400">${rem}</span>`;
                btn.onclick = () => { if (!selectedCell) return; document.getElementById(`cell-${selectedCell.r}-${selectedCell.c}`).innerText = i; updateNumberPad(); };
                pad.appendChild(btn);
            }
        }

        function checkAnswer() {
            const data = stages[currentStageIdx] || stages[0];
            let win = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    const val = data.b[r][c] || (cell ? parseInt(cell.innerText) || 0 : 0);
                    if (val !== data.s[r][c]) { win = false; break; }
                }
            }
            if (win) { clearInterval(timerInterval); document.getElementById('ad-overlay').style.display = 'flex'; }
            else alert('SYNC FAILED!');
        }

        function finishGame() {
            localStorage.setItem('user_int', (parseInt(localStorage.getItem('user_int')) || 0) + 1);
            let cleared = JSON.parse(localStorage.getItem('cleared_stages') || "[]");
            if (!cleared.includes(currentStageIdx + 1)) cleared.push(currentStageIdx + 1);
            localStorage.setItem('cleared_stages', JSON.stringify(cleared));
            location.href = 'index.html';
        }
    </script>
</body>
</html>
