<header class="p-4 bg-slate-900 border-b-2 border-slate-700 flex justify-between items-center z-20">
        <div class="flex flex-col">
            <span class="text-[10px] text-slate-400 tracking-widest">VILLAGE HP</span>
            <div class="w-24 bg-slate-800 h-1.5 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="village-hp" class="bg-emerald-500 h-full w-full"></div>
            </div>
        </div>
        <div class="flex gap-2 text-right items-center">
            <div class="mr-1">
                <span class="text-[10px] text-slate-400 uppercase">Coin</span>
                <p id="user-coin" class="font-bold text-yellow-400 text-sm">1,250</p>
            </div>
            <div class="border-l border-slate-700 pl-2">
                <span class="text-[10px] text-slate-400 uppercase">Mana</span>
                <p id="user-mana" class="font-bold text-blue-400 text-sm">10 / 10</p>
            </div>
            
            <button onclick="resetCharacter()" class="p-2 bg-red-900/30 rounded-lg border border-red-900/50 text-red-500 active:scale-95 transition-all" title="초기화">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>

            <button onclick="logout()" class="p-2 bg-slate-800/50 rounded-lg border border-slate-700 text-slate-400 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </button>
        </div>
    </header>

<script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            location.href = 'login.html';
        }

        window.onload = function() {
            updateUI();
        };

        function updateUI() {
            const savedInt = parseInt(localStorage.getItem('user_int')) || 0;
            const baseMana = 10;
            const maxMana = baseMana + savedInt;
            
            document.getElementById('int-val').innerText = savedInt;
            document.getElementById('int-bar').style.width = Math.min(savedInt, 100) + '%';
            document.getElementById('user-mana').innerText = `${maxMana} / ${maxMana}`;

            if (savedInt >= 50) {
                document.getElementById('guide-text').innerText = "훌륭해! 지능이 상당히 높아졌어. 마나통이 넉넉해졌군.";
            } else {
                document.getElementById('guide-text').innerText = "지능을 높여서 마나 최대치를 확장해봐!";
            }
        }

        // 🔥 캐릭터 초기화 함수
        function resetCharacter() {
            if(confirm('캐릭터의 모든 스탯과 스테이지 기록이 사라집니다. 정말 초기화할까?')) {
                localStorage.removeItem('user_int');
                localStorage.removeItem('cleared_stages');
                localStorage.removeItem('user_str'); // 나중에 쓸 STR도 미리 삭제
                localStorage.removeItem('user_coin');
                
                alert('데이터 삭제 완료. 다시 시작해봐!');
                location.reload(); // 새로고침해서 UI 반영
            }
        }

        function logout() {
            if(confirm('로그아웃 하시겠습니까?')) {
                sessionStorage.removeItem('isLoggedIn');
                location.href = 'login.html';
            }
        }
    </script>
