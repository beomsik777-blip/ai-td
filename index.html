<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Master Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif; margin: 0; padding: 0; height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        * { box-sizing: border-box; }
        .neon-glow { box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .status-bar { transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .main-container { height: calc(100dvh - 160px); overflow-y: auto; scrollbar-width: none; }
        .main-container::-webkit-scrollbar { display: none; }
        #character-sprite { background-size: contain; background-repeat: no-repeat; background-position: center bottom; transition: background-image 0.5s; }
        .chart-section { background: rgba(30, 41, 59, 0.3); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 24px; padding: 15px; width: 100%; max-width: 320px; }
        .stat-card { background: rgba(15, 23, 42, 0.8); border-radius: 12px; padding: 8px; text-align: center; border: 1px solid #1e293b; }
        .water-wave { position: relative; width: 100%; height: 120px; background: #020617; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
        .water-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0ea5e9, #38bdf8); transition: height 1.5s; }
        .evaporating-text { animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <audio id="main-bgm" loop preload="auto"><source src="music/loginbgm.mp3" type="audio/mpeg"></audio>

    <header class="p-4 bg-slate-900 border-b-2 border-slate-700 flex justify-between items-center z-20 shrink-0">
        <div class="flex flex-col">
            <span class="text-[9px] text-slate-500 tracking-widest uppercase">Village HP (마을 체력)</span>
            <div class="w-20 bg-slate-800 h-1 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="village-hp" class="bg-emerald-500 h-full w-full status-bar"></div>
            </div>
        </div>
        <div class="flex gap-2 text-right items-center">
            <div><span class="text-[9px] text-slate-500 uppercase">Coin (재화)</span><p id="user-coin" class="font-bold text-yellow-400 text-xs">0</p></div>
            <div class="border-l border-slate-700 pl-2"><span class="text-[9px] text-slate-500 uppercase">Mana (마나)</span><p id="user-mana" class="font-bold text-blue-400 text-xs">10 / 10</p></div>
            <button onclick="location.href='title.html'" class="p-1.5 bg-blue-900/20 rounded border border-blue-900/40 text-blue-400 active:scale-95 ml-1 text-[10px]">🏅</button>
            <button onclick="resetCharacter()" class="p-1.5 bg-red-900/20 rounded border border-red-900/40 text-red-500 active:scale-95 ml-1 text-[10px]">🔄</button>
        </div>
    </header>

    <main class="main-container relative flex flex-col items-center p-5 space-y-8">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] pointer-events-none"></div>

        <div class="relative z-10 w-72 flex flex-col items-center">
            <div id="character-sprite" class="w-64 h-64 bg-slate-800/20 rounded-xl border-4 border-slate-700 neon-glow flex items-center justify-center overflow-hidden"></div>
            <div class="mt-4 text-center">
                <span id="user-lv" class="bg-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase">Lv. 1</span>
                <p id="user-title" class="text-[9px] text-yellow-400 font-bold tracking-[0.1em] uppercase mt-2 mb-1">칭호 없음 (No Title)</p>
                <h2 id="user-nickname" class="text-xl font-bold tracking-wider text-white uppercase italic">미등록 상태 (Unregistered)</h2>
                <p id="user-weight" class="text-[10px] text-blue-400 font-bold mt-1 uppercase">Weight (체중): -- kg</p>
            </div>
        </div>

        <div class="chart-section z-10 space-y-4">
            <div class="flex justify-between items-center w-full">
                <h3 class="text-[10px] font-bold text-blue-400 tracking-widest uppercase">Body Guide (분석 가이드)</h3>
                <div onclick="location.href='inbody.html'" class="p-1 px-3 rounded-full cursor-pointer text-[8px] text-emerald-400 font-bold uppercase border border-emerald-500/30">Sync (연동) ✓</div>
            </div>
            <div class="h-[210px]"><canvas id="bodyChart"></canvas></div>
            <div class="grid grid-cols-3 gap-2 w-full">
                <div class="stat-card"><p class="text-[7px] text-orange-400 font-bold">Muscle ▲</p><p id="stat-muscle" class="text-[10px] font-bold">--</p></div>
                <div class="stat-card"><p class="text-[7px] text-blue-400 font-bold">Fat ▼</p><p id="stat-fat" class="text-[10px] font-bold">--</p></div>
                <div class="stat-card"><p class="text-[7px] text-emerald-400 font-bold">BMI ▼</p><p id="stat-bmi" class="text-[10px] font-bold">--</p></div>
            </div>
        </div>

        <div class="w-full max-w-xs bg-slate-900/70 p-5 rounded-2xl border border-slate-800 neon-glow z-10 space-y-4">
            <div class="flex justify-between items-center"><h3 class="text-blue-400 font-bold text-xs tracking-widest">HYDRATION</h3><span class="text-[8px] text-slate-500 evaporating-text font-bold">EVAPORATING (증발중)...</span></div>
            <div class="water-wave"><div id="water-fill" class="water-fill"></div><div class="absolute inset-0 flex flex-col items-center justify-center font-bold"><span id="current-water" class="text-2xl">0</span><span class="text-[10px] text-slate-500 uppercase">/ 2000 ml</span></div></div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="drinkWater(100)" class="bg-slate-800 py-2 rounded-lg text-[9px]">💧 100</button>
                <button onclick="drinkWater(200)" class="bg-slate-800 py-2 rounded-lg text-[9px]">🥛 200</button>
                <button onclick="drinkWater(350)" class="bg-slate-800 py-2 rounded-lg text-[9px]">🥤 350</button>
            </div>
            <div id="hydration-history" class="pt-2 border-t border-slate-800 space-y-1"></div>
        </div>
    </main>

    <nav class="bg-slate-950 border-t border-slate-800 grid grid-cols-4 h-20 z-20">
        <button onclick="location.href='gym.html'" class="flex flex-col items-center justify-center text-slate-400"><span class="text-2xl">🏋️</span><span class="text-[8px] font-bold uppercase">Gym</span></button>
        <button onclick="location.href='brain.html'" class="flex flex-col items-center justify-center text-slate-400"><span class="text-2xl">🧩</span><span class="text-[8px] font-bold uppercase">Brain</span></button>
        <button onclick="location.href='defense.html'" class="flex flex-col items-center justify-center text-slate-400"><span class="text-2xl">🛡️</span><span class="text-[8px] font-bold uppercase">Defense</span></button>
        <button onclick="location.href='shop.html'" class="flex flex-col items-center justify-center text-slate-400"><span class="text-2xl">🏪</span><span class="text-[8px] font-bold uppercase">Shop</span></button>
    </nav>

    <script>
        let bodyChart = null;
        window.onload = () => { if (sessionStorage.getItem('isLoggedIn') !== 'true') location.href = 'login.html'; updateUI(); evaporateLoop(); };

        function drinkWater(ml) {
            let data = JSON.parse(localStorage.getItem('user_hydration')) || { current: 0, history: [], lastUpdate: Date.now(), dailyIntake: 0, lastDrinkDate: new Date().toLocaleDateString() };
            data.current = Math.min(2000, data.current + ml);
            data.dailyIntake += ml;
            data.lastUpdate = Date.now();
            localStorage.setItem('user_hydration', JSON.stringify(data));
            updateUI();
        }

        function evaporateLoop() {
            setInterval(() => {
                let data = JSON.parse(localStorage.getItem('user_hydration'));
                if(data && data.current > 0) {
                    data.current = Math.max(0, data.current - 10);
                    localStorage.setItem('user_hydration', JSON.stringify(data));
                    updateUI();
                }
            }, 1000 * 60 * 15);
        }

        function updateUI() {
            const sInt = parseInt(localStorage.getItem('user_int')) || 0;
            const sStr = parseInt(localStorage.getItem('user_str')) || 0;
            document.getElementById('user-coin').innerText = (parseInt(localStorage.getItem('user_coin')) || 0).toLocaleString();
            document.getElementById('user-mana').innerText = `${10 + sInt} / ${10 + sInt}`;
            document.getElementById('user-lv').innerText = `LV. ${sInt + sStr + 1}`;

            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            const title = localStorage.getItem('equipped_title');
            document.getElementById('user-title').innerText = title || "칭호 없음 (No Title)";
            
            if(inbody) {
                document.getElementById('user-nickname').innerText = inbody.name || "미등록 상태 (Unregistered)";
                document.getElementById('user-weight').innerText = `Weight: ${inbody.weight}kg`;
                document.getElementById('stat-muscle').innerText = `${inbody.muscle}kg`;
                document.getElementById('stat-fat').innerText = `${inbody.fatMass}kg`;
                document.getElementById('stat-bmi').innerText = inbody.bmi;
                document.getElementById('character-sprite').style.backgroundImage = inbody.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
                renderRadarChart(inbody);
            }
            
            const hyd = JSON.parse(localStorage.getItem('user_hydration'));
            if(hyd) {
                document.getElementById('water-fill').style.height = (hyd.current / 2000 * 100) + '%';
                document.getElementById('current-water').innerText = Math.floor(hyd.current);
            }
        }

        function renderRadarChart(data) {
            const ctx = document.getElementById('bodyChart').getContext('2d');
            if (bodyChart) bodyChart.destroy();
            bodyChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Muscle', 'Fat', 'BMI', 'Fat%', 'BMR'],
                    datasets: [{ data: [(data.muscle/45)*100, (data.fatMass/30)*100, (data.bmi/35)*100, (data.fatPercent/40)*100, (data.bmr/2000)*100], backgroundColor: 'rgba(56, 189, 248, 0.2)', borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0 }]
                },
                options: { scales: { r: { suggestedMin: 0, suggestedMax: 100, ticks: { display: false }, pointLabels: { color: '#94a3b8', font: { size: 8 } } } }, plugins: { legend: { display: false } } }
            });
        }

        function resetCharacter() { if(confirm('모든 데이터를 초기화할까?')) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
