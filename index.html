<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Main Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif; }
        .pixel-border { border: 4px solid #334155; }
        .neon-glow { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2); }
        .status-bar { transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 캐릭터 스프라이트 기본 설정 */
        #character-sprite {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            background-color: transparent;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
            transition: background-image 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <audio id="main-bgm" loop>
        <source src="music/loginbgm.mp3" type="audio/mpeg">
    </audio>

    <header class="p-4 bg-slate-900 border-b-2 border-slate-700 flex justify-between items-center z-20">
        <div class="flex flex-col">
            <span class="text-[10px] text-slate-400 tracking-widest uppercase">Village HP</span>
            <div class="w-24 bg-slate-800 h-1.5 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="village-hp" class="bg-emerald-500 h-full w-full"></div>
            </div>
        </div>
        <div class="flex gap-2 text-right items-center">
            <div class="mr-1">
                <span class="text-[10px] text-slate-400 uppercase">Coin</span>
                <p id="user-coin" class="font-bold text-yellow-400 text-sm">100</p>
            </div>
            <div class="border-l border-slate-700 pl-2">
                <span class="text-[10px] text-slate-400 uppercase">Weight</span>
                <p id="user-weight" class="font-bold text-blue-400 text-sm">-- kg</p>
            </div>
            
            <button onclick="resetCharacter()" class="p-2 bg-red-900/30 rounded-lg border border-red-900/50 text-red-500 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>

            <button onclick="logout()" class="p-2 bg-slate-800/50 rounded-lg border border-slate-700 text-slate-400 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-1 relative flex flex-col items-center justify-center p-6">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>

        <div class="relative z-10 w-72 h-80 flex flex-col items-center">
            <div id="character-sprite" class="w-64 h-64 bg-slate-800/20 rounded-xl pixel-border neon-glow flex items-center justify-center overflow-hidden"></div>
            <div class="mt-4 text-center">
                <span id="user-lv" class="bg-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold">LV. 15</span>
                <h2 class="text-xl font-bold mt-1 tracking-wider text-white uppercase">Future Chaser</h2>
            </div>
        </div>

        <div class="w-full max-w-xs mt-8 space-y-4 z-10">
            <div class="bg-slate-900/60 p-3 rounded border border-slate-700 backdrop-blur-sm shadow-inner">
                <div class="flex justify-between text-[10px] mb-1">
                    <span class="text-orange-400 font-bold uppercase">Str (근력)</span>
                    <span id="str-val">70</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="str-bar" class="status-bar bg-gradient-to-r from-orange-600 to-orange-400 h-full w-[70%]"></div>
                </div>
            </div>
            
            <div class="bg-slate-900/60 p-3 rounded border border-slate-700 backdrop-blur-sm shadow-inner">
                <div class="flex justify-between text-[10px] mb-1">
                    <span class="text-purple-400 font-bold uppercase">Int (지능)</span>
                    <div class="flex items-center gap-2">
                        <span id="int-val" class="text-white font-bold">0</span>
                        <button onclick="location.href='brain.html'" class="bg-purple-600 hover:bg-purple-500 text-[8px] px-2 py-0.5 rounded font-bold transition-all active:scale-95">TRAINING</button>
                    </div>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="int-bar" class="status-bar bg-gradient-to-r from-purple-600 to-purple-400 h-full w-[0%]"></div>
                </div>
            </div>
        </div>
    </main>

    <section id="guide-section" class="mx-4 mb-4 z-20">
        <div onclick="location.href='inbody.html'" class="bg-slate-900 border-2 border-blue-500 p-3 rounded-lg flex items-start gap-3 shadow-[0_0_20px_rgba(59,130,246,0.3)] cursor-pointer active:scale-95 transition-all">
            <div class="w-10 h-10 bg-blue-500/20 rounded-full flex-shrink-0 border border-blue-400 flex items-center justify-center text-xl">🧬</div>
            <div>
                <p id="sync-status" class="text-[9px] text-blue-400 font-bold tracking-tighter uppercase">QuestBody Guide</p>
                <p id="guide-text" class="text-[11px] leading-tight text-slate-200 mt-1">"인바디 데이터를 동기화하여 성별과 체중을 적용해!"</p>
            </div>
        </div>
    </section>

    <nav class="bg-slate-950 border-t border-slate-800 grid grid-cols-4 h-20 z-20">
        <button onclick="location.href='gym.html'" class="flex flex-col items-center justify-center hover:bg-slate-900 transition text-slate-400">
            <span class="text-2xl">🏋️</span>
            <span class="text-[9px] font-bold mt-1 uppercase">Gym</span>
        </button>
        <button onclick="location.href='brain.html'" class="flex flex-col items-center justify-center hover:bg-slate-900 transition text-slate-400 border-x border-slate-900">
            <span class="text-2xl">🧩</span>
            <span class="text-[9px] font-bold mt-1 uppercase">Brain</span>
        </button>
        <button class="flex flex-col items-center justify-center bg-blue-900/20 text-blue-400 border-y-2 border-blue-500">
            <span class="text-2xl">🛡️</span>
            <span class="text-[9px] font-bold mt-1 uppercase tracking-tighter">Defense</span>
        </button>
        <button class="flex flex-col items-center justify-center hover:bg-slate-900 transition text-slate-400 border-l border-slate-900">
            <span class="text-2xl">🏪</span>
            <span class="text-[9px] font-bold mt-1 uppercase">Shop</span>
        </button>
    </nav>

    <script>
        // BGM 로직
        const bgm = document.getElementById('main-bgm');
        document.body.onclick = function() {
            if (bgm.paused) { bgm.play().catch(e => console.log(e)); }
        };

        if (sessionStorage.getItem('isLoggedIn') !== 'true') { location.href = 'login.html'; }

        window.onload = function() { updateUI(); };

        function updateUI() {
            // 1. 기본 스탯 로드
            const savedInt = parseInt(localStorage.getItem('user_int')) || 0;
            const savedStr = parseInt(localStorage.getItem('user_str')) || 70;
            const savedCoin = parseInt(localStorage.getItem('user_coin')) || 100;
            
            document.getElementById('int-val').innerText = savedInt;
            document.getElementById('int-bar').style.width = Math.min(savedInt, 100) + '%';
            document.getElementById('str-val').innerText = savedStr;
            document.getElementById('str-bar').style.width = Math.min(savedStr, 100) + '%';
            document.getElementById('user-coin').innerText = savedCoin.toLocaleString();

            // 2. 인바디 데이터 로드 및 반영
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            const sprite = document.getElementById('character-sprite');
            
            if (inbody) {
                // 성별에 따른 이미지 교체
                if (inbody.gender === 'woman') {
                    sprite.style.backgroundImage = "url('image/man/woman.png')";
                } else {
                    sprite.style.backgroundImage = "url('image/man/man.png')";
                }
                
                // 체중 및 가이드 텍스트 업데이트
                document.getElementById('user-weight').innerText = `${inbody.weight} kg`;
                document.getElementById('sync-status').innerText = "BODY DATA SYNCHRONIZED ✓";
                document.getElementById('sync-status').classList.replace('text-blue-400', 'text-emerald-400');
                document.getElementById('guide-text').innerText = `성별(${inbody.gender}) 및 체중 데이터가 성공적으로 반영되었습니다.`;
            } else {
                // 데이터 없을 때 기본값 (검정 실루엣 이미지 등)
                sprite.style.backgroundImage = "url('image/man/man.png')"; // 기본값
                document.getElementById('user-weight').innerText = "0.0 kg";
            }
        }

        function resetCharacter() {
            if(confirm('모든 데이터(코인 포함)를 초기화할까?')) {
                localStorage.clear();
                localStorage.setItem('user_coin', 100);
                alert('데이터가 초기화되었습니다.');
                location.reload();
            }
        }

        function logout() {
            if(confirm('로그아웃 하시겠습니까?')) {
                sessionStorage.removeItem('isLoggedIn');
                location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
