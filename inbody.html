<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - InBody Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background-color: #0f172a; color: white; font-family: 'Orbitron', sans-serif; overflow-x: hidden; }
        .input-card { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; backdrop-filter: blur(10px); }
        
        /* 텍스트 틀어짐 방지를 위한 입력창 고정 스타일 */
        .cyber-input { 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: #38bdf8; 
            text-align: center;
            height: 48px; /* 높이 고정 */
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cyber-input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        
        /* 라벨 스타일 통일 */
        .input-label {
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="p-6">
    <header class="flex justify-between items-center mb-8 shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-xs font-bold">◀ BACK</button>
        <h1 class="text-sm font-bold text-blue-400 tracking-widest uppercase text-center">Body Analysis<br><span class="text-[10px] text-slate-500">인바디 분석</span></h1>
        <div class="w-10"></div>
    </header>

    <div class="input-card rounded-2xl p-6 space-y-6 shadow-2xl">
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label class="input-label text-slate-500">Gender <span class="text-[8px] opacity-70">(성별)</span></label>
                <select id="gender" class="cyber-input w-full rounded-lg text-xs">
                    <option value="man">MALE (남성)</option>
                    <option value="woman">FEMALE (여성)</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="input-label text-slate-500">Height <span class="text-[8px] opacity-70">(키/cm)</span></label>
                <input type="number" id="height" step="0.1" value="168.0" class="cyber-input w-full rounded-lg text-sm">
            </div>
        </div>

        <div class="flex flex-col">
            <label class="input-label text-slate-400">Weight <span class="text-[8px] opacity-70">(체중/kg)</span></label>
            <input type="number" id="weight" step="0.1" value="68.1" class="cyber-input w-full rounded-lg text-lg font-bold text-white border-slate-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label class="input-label text-orange-500">Skeletal Muscle <span class="text-[8px] opacity-70">(골격근량)</span></label>
                <input type="number" id="muscle" step="0.1" value="28.3" class="cyber-input w-full rounded-lg text-sm">
            </div>
            <div class="flex flex-col">
                <label class="input-label text-blue-500">Body Fat <span class="text-[8px] opacity-70">(체지방량)</span></label>
                <input type="number" id="fat-mass" step="0.1" value="17.5" class="cyber-input w-full rounded-lg text-sm">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label class="input-label text-emerald-500">BMI <span class="text-[8px] opacity-70">(체질량지수)</span></label>
                <input type="number" id="bmi" step="0.1" value="24.1" class="cyber-input w-full rounded-lg text-sm">
            </div>
            <div class="flex flex-col">
                <label class="input-label text-rose-500">Fat % <span class="text-[8px] opacity-70">(체지방률)</span></label>
                <input type="number" id="fat-percent" step="0.1" value="25.7" class="cyber-input w-full rounded-lg text-sm">
            </div>
        </div>

        <div class="flex flex-col">
            <label class="input-label text-purple-400">Basal Metabolism <span class="text-[8px] opacity-70">(기초대사량/kcal)</span></label>
            <input type="number" id="bmr" value="1462" class="cyber-input w-full rounded-lg text-sm">
        </div>

        <button onclick="saveInbody()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 uppercase tracking-widest mt-4 text-xs">
            Sync Data (저장하기)
        </button>
    </div>

    <script>
        function saveInbody() {
            const data = {
                gender: document.getElementById('gender').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                muscle: document.getElementById('muscle').value,
                fatMass: document.getElementById('fat-mass').value,
                bmi: document.getElementById('bmi').value,
                fatPercent: document.getElementById('fat-percent').value,
                bmr: document.getElementById('bmr').value,
                syncDate: new Date().toLocaleDateString()
            };

            localStorage.setItem('user_inbody', JSON.stringify(data));
            localStorage.setItem('user_weight', data.weight);

            alert('BODY DATA SYNCHRONIZED!\n인바디 데이터 동기화 완료!');
            location.href = 'index.html';
        }

        window.onload = function() {
            const saved = JSON.parse(localStorage.getItem('user_inbody'));
            if(saved) {
                document.getElementById('gender').value = saved.gender || 'man';
                document.getElementById('height').value = saved.height;
                document.getElementById('weight').value = saved.weight;
                document.getElementById('muscle').value = saved.muscle;
                document.getElementById('fat-mass').value = saved.fatMass;
                document.getElementById('bmi').value = saved.bmi;
                document.getElementById('fat-percent').value = saved.fatPercent;
                document.getElementById('bmr').value = saved.bmr;
            }
        }
    </script>
</body>
</html>
