<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Nest Dungeon</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
}

#ui{
display:flex;
height:100vh;
}

#panel{
width:240px;
background:#020617;
border-right:2px solid #334155;
padding:10px;
}

button{
width:100%;
margin:4px 0;
padding:8px;
background:#334155;
border:none;
color:white;
}

#map{

flex:1;

display:grid;

grid-template-columns:repeat(40,1fr);
grid-template-rows:repeat(40,1fr);

background:#0f172a;

}

.cell{
border:1px solid #1e293b;
position:relative;
}

.room{background:#1e293b}
.trap{background:#7f1d1d}
.treasure{background:#78350f}
.nest{background:#14532d}

.hero,.monster{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-size:14px;

}

.damage{
position:absolute;
color:red;
font-size:12px;
animation:float .7s forwards;
}

@keyframes float{

0%{opacity:1;top:50%}
100%{opacity:0;top:20%}

}

</style>

</head>

<body>

<div id="ui">

<div id="panel">

<h3>🐉 Dragon Nest</h3>

Gold : <span id="gold">500</span>

<hr>

<button onclick="buildMode('room')">방</button>
<button onclick="buildMode('trap')">함정</button>
<button onclick="buildMode('treasure')">보물</button>

<hr>

<button onclick="monsterMode('goblin')">👾 고블린</button>
<button onclick="monsterMode('orc')">👹 오크</button>
<button onclick="monsterMode('slime')">🟢 슬라임</button>

<hr>

<button onclick="upgradeMonster()">몬스터 업그레이드</button>
<button onclick="upgradeDragon()">드래곤 강화</button>

<hr>

<button onclick="startRound()">▶ 라운드 시작</button>

</div>

<div id="map"></div>

</div>

<script>

const map=document.getElementById("map")

let size=40

let gold=500

let mode=null
let monsterType=null

let rooms=[]
let monsters=[]
let heroes=[]

let nestCell=820

let dragonHP=500

let monsterLevel=1

/* MAP */

function createMap(){

for(let i=0;i<size*size;i++){

const c=document.createElement("div")

c.className="cell"

c.onclick=()=>cellClick(i)

if(i==nestCell){

c.classList.add("nest")

}

map.appendChild(c)

}

}

createMap()

/* BUILD */

function buildMode(t){

mode="build"
buildType=t

}

function monsterMode(t){

mode="monster"
monsterType=t

}

function cellClick(i){

if(mode=="build"){

rooms.push(i)

map.children[i].classList.add(buildType)

}

if(mode=="monster"){

spawnMonster(i)

}

}

/* MONSTER */

function stats(t){

if(t=="goblin")return{hp:40,atk:6,icon:"👾"}
if(t=="orc")return{hp:90,atk:12,icon:"👹"}
if(t=="slime")return{hp:30,atk:4,icon:"🟢"}

}

function spawnMonster(cell){

if(!rooms.includes(cell))return

const s=stats(monsterType)

const el=document.createElement("div")

el.className="monster"

el.innerText=s.icon

map.children[cell].appendChild(el)

monsters.push({

cell,
hp:s.hp*monsterLevel,
atk:s.atk*monsterLevel,
el

})

}

/* HERO */

function spawnHero(){

const el=document.createElement("div")

el.className="hero"

el.innerText="⚔️"

map.children[0].appendChild(el)

heroes.push({

cell:0,
hp:120,
atk:10,
el

})

}

/* PATH */

function neighbors(i){

let x=i%size
let y=Math.floor(i/size)

let list=[]

if(x>0) list.push(i-1)
if(x<size-1) list.push(i+1)
if(y>0) list.push(i-size)
if(y<size-1) list.push(i+size)

return list

}

/* HERO MOVE */

function moveHeroes(){

heroes.forEach(h=>{

let next=neighbors(h.cell).find(n=>rooms.includes(n)||n==nestCell)

if(next==undefined)return

map.children[h.cell].removeChild(h.el)

h.cell=next

map.children[h.cell].appendChild(h.el)

})

}

/* BATTLE */

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
h.hp-=m.atk

if(m.hp<=0){

m.el.remove()

monsters.splice(mi,1)

gold+=50

}

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

}

}

})

})

/* NEST */

heroes.forEach((h,hi)=>{

if(h.cell==nestCell){

dragonHP-=h.atk

if(dragonHP<=0){

alert("GAME OVER")

}

}

})

}

/* ROUND */

function startRound(){

for(let i=0;i<10;i++){

setTimeout(spawnHero,i*1000)

}

}

/* UPGRADE */

function upgradeMonster(){

monsterLevel++

gold-=200

}

function upgradeDragon(){

dragonHP+=200

gold-=300

}

/* LOOP */

setInterval(()=>{

moveHeroes()

battle()

document.getElementById("gold").innerText=gold

},500)

</script>

</body>

</html>
