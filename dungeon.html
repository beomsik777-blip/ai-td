<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dragon Nest</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
}

/* UI */

#top{

position:fixed;
top:0;
left:0;

width:100%;

background:#020617;

padding:10px;

z-index:10;

border-bottom:2px solid #334155;

}

button{

padding:6px 10px;
margin:3px;

background:#334155;
border:none;
color:white;

}

/* MAP */

#mapWrap{

position:absolute;

top:120px;
bottom:0;
left:0;
right:0;

overflow:scroll;

}

#map{

display:grid;

grid-template-columns:repeat(40,30px);
grid-template-rows:repeat(40,30px);

width:1200px;
height:1200px;

background:#0f172a;

}

.cell{

width:30px;
height:30px;

border:1px solid #1e293b;

position:relative;

}

.room{background:#1e293b}
.trap{background:#7f1d1d}
.nest{background:#14532d}

.hero,.monster{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-size:16px;

}

</style>

</head>

<body>

<div id="top">

🐉 Dragon Nest

Gold : <span id="gold">500</span>

<br>

<button onclick="mode='room'">방</button>
<button onclick="mode='trap'">함정</button>

<button onclick="monsterMode('goblin')">👾</button>
<button onclick="monsterMode('orc')">👹</button>
<button onclick="monsterMode('slime')">🟢</button>

<button onclick="startRound()">▶ 라운드</button>

</div>

<div id="mapWrap">

<div id="map"></div>

</div>

<script>

const map=document.getElementById("map")

let size=40

let gold=500

let mode=null
let monsterType=null

let rooms=[]
let monsters=[]
let heroes=[]

let entrance=0
let nest=1599

/* MAP */

function createMap(){

for(let i=0;i<size*size;i++){

const c=document.createElement("div")

c.className="cell"

c.onclick=()=>cellClick(i)

if(i==nest){

c.classList.add("nest")

c.innerHTML="🐉"

}

if(i==entrance){

c.innerHTML="🚪"

}

map.appendChild(c)

}

}

createMap()

/* BUILD */

function cellClick(i){

if(mode=="room"){

rooms.push(i)

map.children[i].classList.add("room")

}

if(mode=="trap"){

map.children[i].classList.add("trap")

}

if(mode=="monster"){

spawnMonster(i)

}

}

function monsterMode(t){

mode="monster"

monsterType=t

}

/* MONSTER */

function stats(t){

if(t=="goblin")return{hp:40,atk:6,icon:"👾"}
if(t=="orc")return{hp:90,atk:12,icon:"👹"}
if(t=="slime")return{hp:30,atk:4,icon:"🟢"}

}

function spawnMonster(cell){

if(!rooms.includes(cell))return

const s=stats(monsterType)

const el=document.createElement("div")

el.className="monster"

el.innerText=s.icon

map.children[cell].appendChild(el)

monsters.push({

cell,
hp:s.hp,
atk:s.atk,
el

})

}

/* HERO */

function spawnHero(){

const el=document.createElement("div")

el.className="hero"

el.innerText="⚔️"

map.children[entrance].appendChild(el)

heroes.push({

cell:entrance,
hp:120,
atk:10,
el

})

}

/* PATH */

function neighbors(i){

let x=i%size
let y=Math.floor(i/size)

let list=[]

if(x>0) list.push(i-1)
if(x<size-1) list.push(i+1)
if(y>0) list.push(i-size)
if(y<size-1) list.push(i+size)

return list

}

/* HERO MOVE */

function moveHeroes(){

heroes.forEach(h=>{

let next=neighbors(h.cell)[0]

map.children[h.cell].removeChild(h.el)

h.cell=next

map.children[h.cell].appendChild(h.el)

})

}

/* BATTLE */

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
h.hp-=m.atk

if(m.hp<=0){

m.el.remove()

monsters.splice(mi,1)

gold+=50

}

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

}

}

})

})

}

/* ROUND */

function startRound(){

for(let i=0;i<10;i++){

setTimeout(spawnHero,i*1000)

}

}

/* LOOP */

setInterval(()=>{

moveHeroes()

battle()

document.getElementById("gold").innerText=gold

},500)

</script>

</body>

</html>
