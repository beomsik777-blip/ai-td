<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon Dungeon</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
text-align:center;
}

#top{
padding:10px;
border-bottom:2px solid #334155;
}

button{
padding:8px 12px;
margin:3px;
background:#1e293b;
border:none;
border-radius:6px;
color:white;
}

#map{

width:95vw;
max-width:520px;

height:95vw;
max-height:520px;

margin:auto;

display:grid;

grid-template-columns:repeat(10,1fr);
grid-template-rows:repeat(10,1fr);

background:#0f172a;

}

.cell{

border:1px solid #1e293b;
position:relative;

}

.room{

background:#1e293b;

}

.treasure{

background:#78350f;

}

.monster{

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:20px;

}

.hero{

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:20px;

}

#startScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#020617;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

}

</style>

</head>

<body>

<div id="startScreen">

<h1>🐉 Dragon Dungeon</h1>

<button onclick="startGame()">게임 시작</button>

</div>


<div id="top">

Gold : <span id="gold">200</span>

<br>

<button onclick="buildRoom()">🧱 방</button>
<button onclick="buildTreasure()">💰 보물방</button>

<button onclick="spawnMonster('goblin')">👾 고블린</button>
<button onclick="spawnMonster('orc')">👹 오크</button>
<button onclick="spawnMonster('slime')">🟢 슬라임</button>
<button onclick="spawnMonster('lich')">💀 리치</button>

<br>

<button onclick="dragonFire()">🔥 드래곤 브레스</button>
<button onclick="saveGame()">💾 저장</button>
<button onclick="exitGame()">🚪 나가기</button>

</div>

<div id="map"></div>

<script>

const map=document.getElementById("map")

let gold=200

let mode=null
let selectedMonster=null

let rooms=[]
let treasures=[]

let monsters=[]
let heroes=[]

function updateUI(){

document.getElementById("gold").innerText=gold

}

function startGame(){

document.getElementById("startScreen").style.display="none"

createMap()

loadGame()

spawnHeroLoop()

}

function createMap(){

for(let i=0;i<100;i++){

const c=document.createElement("div")

c.className="cell"

c.onclick=()=>cellClick(i)

map.appendChild(c)

}

}

function cellClick(i){

if(mode=="room"){

if(gold<50)return

if(rooms.includes(i))return

rooms.push(i)

map.children[i].classList.add("room")

gold-=50

updateUI()

}

if(mode=="treasure"){

if(gold<150)return

treasures.push(i)

map.children[i].classList.add("treasure")

gold-=150

updateUI()

}

if(mode=="monster"){

if(!rooms.includes(i))return

createMonster(i,selectedMonster)

}

}

function buildRoom(){mode="room"}
function buildTreasure(){mode="treasure"}

function spawnMonster(type){

mode="monster"
selectedMonster=type

}

function createMonster(cell,type){

let data={}

if(type=="goblin") data={hp:40,atk:5,icon:"👾"}
if(type=="orc") data={hp:70,atk:8,icon:"👹"}
if(type=="slime") data={hp:30,atk:3,icon:"🟢"}
if(type=="lich") data={hp:100,atk:12,icon:"💀"}

if(gold<100)return

gold-=100

const el=document.createElement("div")

el.className="monster"

el.innerText=data.icon

map.children[cell].appendChild(el)

monsters.push({

cell:cell,
hp:data.hp,
atk:data.atk,
el:el

})

updateUI()

}

function spawnHero(){

const h={

cell:0,
hp:80,
atk:7

}

const el=document.createElement("div")

el.className="hero"
el.innerText="🧙"

map.children[0].appendChild(el)

h.el=el

heroes.push(h)

}

function spawnHeroLoop(){

setInterval(spawnHero,6000)

}

function neighbors(i){

let list=[]

let x=i%10
let y=Math.floor(i/10)

if(x>0) list.push(i-1)
if(x<9) list.push(i+1)
if(y>0) list.push(i-10)
if(y<9) list.push(i+10)

return list

}

function heroMove(){

heroes.forEach(h=>{

let next=neighbors(h.cell).find(n=>rooms.includes(n)||treasures.includes(n))

if(next==undefined)return

map.children[h.cell].removeChild(h.el)

h.cell=next

map.children[h.cell].appendChild(h.el)

})

}

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
h.hp-=m.atk

if(m.hp<=0){

m.el.remove()
monsters.splice(mi,1)

}

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

gold+=40

updateUI()

}

}

})

})

}

function dragonFire(){

heroes.forEach((h,hi)=>{

h.hp-=40

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

gold+=20

}

})

updateUI()

}

function saveGame(){

localStorage.setItem("dungeon",JSON.stringify({

gold,
rooms,
treasures

}))

alert("저장됨")

}

function loadGame(){

const data=localStorage.getItem("dungeon")

if(!data)return

const d=JSON.parse(data)

gold=d.gold

rooms=d.rooms
treasures=d.treasures

rooms.forEach(i=>map.children[i].classList.add("room"))

treasures.forEach(i=>map.children[i].classList.add("treasure"))

updateUI()

}

function exitGame(){

location.reload()

}

setInterval(()=>{

heroMove()
battle()

},1000)

updateUI()

</script>

</body>

</html>
