<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dragon Dungeon</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
text-align:center;
}

#topbar{
background:#020617;
padding:10px;
border-bottom:2px solid #334155;
}

button{
padding:8px 14px;
margin:4px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
font-size:14px;
}

#map{
width:95vw;
max-width:500px;
height:95vw;
max-height:500px;
margin:auto;

display:grid;
grid-template-columns:repeat(10,1fr);
grid-template-rows:repeat(10,1fr);

background:#0f172a;
}

.cell{
border:1px solid #1e293b;
position:relative;
}

.room{
background:#1e293b;
}

.monster{
position:absolute;
font-size:20px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.hero{
position:absolute;
font-size:20px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.dragon{
font-size:24px;
}

#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#startBtn{
font-size:20px;
padding:16px 30px;
background:#7c3aed;
}

</style>

</head>

<body>

<div id="startScreen">

<h1>🐉 Dragon Dungeon</h1>
<p>던전을 만들고 영웅을 막아라</p>

<button id="startBtn" onclick="startGame()">게임 시작</button>

</div>


<div id="topbar">

<h2>🐉 Dragon Dungeon</h2>

Gold : <span id="gold">200</span>

<br>

<button onclick="buildMode()">🧱 방 만들기 (50)</button>
<button onclick="monsterMode()">👾 몬스터 (100)</button>
<button onclick="dragonAttack()">🔥 드래곤 불</button>

</div>

<div id="map"></div>

<script>

const map=document.getElementById("map")

let gold=200

let build=false
let monster=false

let rooms=[]
let monsters=[]
let heroes=[]

function updateUI(){

document.getElementById("gold").innerText=gold

}

function startGame(){

document.getElementById("startScreen").style.display="none"

createMap()

spawnHeroLoop()

}

function createMap(){

for(let i=0;i<100;i++){

const cell=document.createElement("div")
cell.className="cell"

cell.onclick=()=>cellClick(i)

map.appendChild(cell)

}

}

function buildMode(){

build=true
monster=false

}

function monsterMode(){

monster=true
build=false

}

function cellClick(i){

if(build){

if(gold<50)return

if(rooms.includes(i))return

rooms.push(i)

map.children[i].classList.add("room")

gold-=50

updateUI()

}

if(monster){

if(gold<100)return

if(!rooms.includes(i))return

gold-=100

const m={

cell:i,
hp:40,
atk:5

}

const el=document.createElement("div")
el.className="monster"
el.innerText="👾"

map.children[i].appendChild(el)

m.el=el

monsters.push(m)

updateUI()

}

}

function spawnHero(){

const h={

cell:0,
hp:60,
atk:6

}

const el=document.createElement("div")
el.className="hero"
el.innerText="🧙"

map.children[0].appendChild(el)

h.el=el

heroes.push(h)

}

function spawnHeroLoop(){

setInterval(spawnHero,5000)

}

function moveHeroes(){

heroes.forEach(h=>{

if(h.cell>=99)return

map.children[h.cell].removeChild(h.el)

h.cell++

map.children[h.cell].appendChild(h.el)

})

}

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
h.hp-=m.atk

if(m.hp<=0){

m.el.remove()
monsters.splice(mi,1)

}

if(h.hp<=0){

h.el.remove()
heroes.splice(hi,1)

gold+=30

updateUI()

}

}

})

})

}

function dragonAttack(){

heroes.forEach((h,hi)=>{

h.hp-=30

if(h.hp<=0){

h.el.remove()
heroes.splice(hi,1)

gold+=20

updateUI()

}

})

}

setInterval(()=>{

moveHeroes()
battle()

},1000)

updateUI()

</script>

</body>
</html>
