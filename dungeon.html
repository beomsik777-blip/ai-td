<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon Dungeon</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
text-align:center;
}

#top{

padding:10px;

background:#020617;

border-bottom:2px solid #334155;

}

button{

padding:8px 12px;

margin:4px;

border:none;

border-radius:8px;

background:#334155;

color:white;

}

#map{

width:95vw;
max-width:540px;

height:95vw;
max-height:540px;

margin:auto;

display:grid;

grid-template-columns:repeat(12,1fr);
grid-template-rows:repeat(12,1fr);

background:#0f172a;

}

.cell{

border:1px solid #1e293b;

position:relative;

}

.room{

background:#1e293b;

}

.treasure{

background:#78350f;

}

.hero,.monster{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-size:18px;

text-align:center;

}

.hp{

font-size:10px;

color:#22c55e;

}

.damage{

position:absolute;

color:red;

font-size:12px;

animation:float 0.7s forwards;

}

@keyframes float{

0%{opacity:1;top:50%}

100%{opacity:0;top:20%}

}

</style>

</head>

<body>

<div id="top">

<h2>🐉 Dragon Dungeon</h2>

Gold : <span id="gold">300</span>

<br>

<button onclick="mode='room'">🧱 방</button>
<button onclick="mode='treasure'">💰 보물방</button>

<button onclick="spawnMonster('goblin')">👾 고블린</button>
<button onclick="spawnMonster('orc')">👹 오크</button>
<button onclick="spawnMonster('slime')">🟢 슬라임</button>
<button onclick="spawnMonster('lich')">💀 리치</button>
<button onclick="spawnMonster('dragon')">🐲 드래곤</button>

<br>

<button onclick="dragonFire()">🔥 브레스</button>

<button onclick="saveGame()">💾 저장</button>
<button onclick="loadGame()">📂 불러오기</button>
<button onclick="location.reload()">🚪 나가기</button>

</div>

<div id="map"></div>

<script>

const map=document.getElementById("map")

let gold=300

let mode=null
let monsterType=null

let rooms=[]
let treasures=[]
let monsters=[]
let heroes=[]

function updateUI(){

document.getElementById("gold").innerText=gold

}

function createMap(){

for(let i=0;i<144;i++){

const c=document.createElement("div")

c.className="cell"

c.onclick=()=>cellClick(i)

map.appendChild(c)

}

}

function cellClick(i){

if(mode=="room"){

if(gold<50)return

rooms.push(i)

map.children[i].classList.add("room")

gold-=50

}

if(mode=="treasure"){

if(gold<200)return

treasures.push(i)

map.children[i].classList.add("treasure")

gold-=200

}

if(mode=="monster"){

createMonster(i,monsterType)

}

updateUI()

}

function spawnMonster(type){

mode="monster"

monsterType=type

}

function createMonster(cell,type){

if(!rooms.includes(cell))return

if(gold<100)return

gold-=100

let data={}

if(type=="goblin")data={hp:40,atk:6,icon:"👾"}
if(type=="orc")data={hp:80,atk:12,icon:"👹"}
if(type=="slime")data={hp:30,atk:4,icon:"🟢"}
if(type=="lich")data={hp:120,atk:18,icon:"💀"}
if(type=="dragon")data={hp:200,atk:25,icon:"🐲"}

const el=document.createElement("div")

el.className="monster"

el.innerHTML=data.icon+"<div class='hp'>"+data.hp+"</div>"

map.children[cell].appendChild(el)

monsters.push({

cell,
hp:data.hp,
atk:data.atk,
el

})

updateUI()

}

function spawnHero(){

const types=[

{icon:"⚔️",hp:120,atk:10},
{icon:"🏹",hp:90,atk:12},
{icon:"🔮",hp:80,atk:15}

]

const t=types[Math.floor(Math.random()*types.length)]

const el=document.createElement("div")

el.className="hero"

el.innerHTML=t.icon+"<div class='hp'>"+t.hp+"</div>"

map.children[0].appendChild(el)

heroes.push({

cell:0,
hp:t.hp,
atk:t.atk,
el

})

}

setInterval(spawnHero,5000)

function neighbors(i){

let list=[]

let x=i%12
let y=Math.floor(i/12)

if(x>0) list.push(i-1)
if(x<11) list.push(i+1)
if(y>0) list.push(i-12)
if(y<11) list.push(i+12)

return list

}

function moveHeroes(){

heroes.forEach(h=>{

let next=neighbors(h.cell).find(n=>rooms.includes(n)||treasures.includes(n))

if(next==undefined)return

map.children[h.cell].removeChild(h.el)

h.cell=next

map.children[h.cell].appendChild(h.el)

})

}

function showDamage(cell,amount){

const d=document.createElement("div")

d.className="damage"

d.innerText="-"+amount

map.children[cell].appendChild(d)

setTimeout(()=>d.remove(),700)

}

function updateHP(){

heroes.forEach(h=>{

h.el.querySelector(".hp").innerText=h.hp

})

monsters.forEach(m=>{

m.el.querySelector(".hp").innerText=m.hp

})

}

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
showDamage(h.cell,h.atk)

h.hp-=m.atk
showDamage(h.cell,m.atk)

if(m.hp<=0){

m.el.remove()

monsters.splice(mi,1)

gold+=50

}

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

}

updateUI()

updateHP()

}

})

})

}

function dragonFire(){

heroes.forEach((h,hi)=>{

h.hp-=40

showDamage(h.cell,40)

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

gold+=30

}

})

updateHP()

}

function saveGame(){

localStorage.setItem("dragonDungeon",JSON.stringify({

gold,
rooms,
treasures

}))

alert("저장됨")

}

function loadGame(){

const data=localStorage.getItem("dragonDungeon")

if(!data)return

const d=JSON.parse(data)

gold=d.gold
rooms=d.rooms
treasures=d.treasures

rooms.forEach(i=>map.children[i].classList.add("room"))

treasures.forEach(i=>map.children[i].classList.add("treasure"))

updateUI()

}

setInterval(()=>{

moveHeroes()
battle()

},1000)

createMap()

updateUI()

</script>

</body>

</html>
