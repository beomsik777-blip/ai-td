<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dungeon Idle</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#020617;
color:white;
font-family:sans-serif;
text-align:center;
overflow:hidden;
}

#map{
width:420px;
height:500px;
margin:auto;
background:#0f172a;
border:3px solid #334155;
position:relative;
overflow:hidden;
}

.hero{
position:absolute;
width:48px;
height:48px;
background:url("https://i.imgur.com/Y9a3G8R.png");
background-size:cover;
}

.monster{
position:absolute;
width:40px;
height:40px;
background:url("https://i.imgur.com/Z9q3K7S.png");
background-size:cover;
}

.boss{
background:url("https://i.imgur.com/o7QKQ8X.png");
background-size:cover;
width:70px;
height:70px;
}

.damage{

position:absolute;
color:#ff4444;
font-weight:bold;
animation:float 1s forwards;

}

@keyframes float{

0%{opacity:1;transform:translateY(0)}
100%{opacity:0;transform:translateY(-40px)}

}

.attack{

position:absolute;
width:24px;
height:24px;
background:yellow;
border-radius:50%;
animation:shot .4s linear forwards;

}

@keyframes shot{

0%{transform:scale(.5)}
100%{transform:scale(2);opacity:0}

}

.gold{
color:#facc15;
font-weight:bold;
}

button{
padding:10px;
background:#1e293b;
border-radius:8px;
margin:4px;
}

</style>

</head>

<body>

<h1 class="text-2xl font-bold mt-3">🏰 Dungeon Idle</h1>

<div>

Gold : <span id="gold" class="gold">0</span>

</div>

<div>

Dungeon LV : <span id="dungeonLv">1</span>

</div>

<div>

Hero ATK : <span id="atk">10</span>

</div>

<div class="mt-2">

<button onclick="upgradeAtk()">⚔ 공격력 (50)</button>

<button onclick="upgradeDungeon()">🏰 던전 (200)</button>

<button onclick="spawnBoss()">🐉 보스</button>

</div>

<div id="map">

<div id="hero" class="hero"></div>

</div>

<script>

let gold=0
let heroAtk=10
let dungeonLv=1

let monsters=[]

const heroX=190
const heroY=220

const map=document.getElementById("map")

const hero=document.getElementById("hero")

hero.style.left=heroX+"px"
hero.style.top=heroY+"px"

function updateUI(){

goldEl.innerText=gold
atkEl.innerText=heroAtk
lvEl.innerText=dungeonLv

}

const goldEl=document.getElementById("gold")
const atkEl=document.getElementById("atk")
const lvEl=document.getElementById("dungeonLv")

function spawnMonster(){

const hp=30+dungeonLv*10

const m={
hp:hp,
x:Math.random()*380,
y:Math.random()*450,
speed:0.3
}

const el=document.createElement("div")
el.className="monster"

el.style.left=m.x+"px"
el.style.top=m.y+"px"

map.appendChild(el)

m.el=el

monsters.push(m)

}

function spawnBoss(){

const m={
hp:300+dungeonLv*100,
x:200,
y:20,
speed:0.15,
boss:true
}

const el=document.createElement("div")

el.className="monster boss"

el.style.left=m.x+"px"
el.style.top=m.y+"px"

map.appendChild(el)

m.el=el

monsters.push(m)

}

function moveMonsters(){

monsters.forEach(m=>{

const dx=heroX-m.x
const dy=heroY-m.y

const dist=Math.sqrt(dx*dx+dy*dy)

m.x+=dx/dist*m.speed
m.y+=dy/dist*m.speed

m.el.style.left=m.x+"px"
m.el.style.top=m.y+"px"

})

}

function heroAttack(){

monsters.forEach((m,i)=>{

const dx=m.x-heroX
const dy=m.y-heroY

const dist=Math.sqrt(dx*dx+dy*dy)

if(dist<140){

m.hp-=heroAtk

showDamage(heroAtk,m.x,m.y)

showAttack(m.x,m.y)

if(m.hp<=0){

gold+=m.boss?200:10

m.el.remove()

monsters.splice(i,1)

updateUI()

}

}

})

}

function showDamage(dmg,x,y){

const d=document.createElement("div")

d.className="damage"

d.innerText=dmg

d.style.left=x+"px"
d.style.top=y+"px"

map.appendChild(d)

setTimeout(()=>d.remove(),900)

}

function showAttack(x,y){

const a=document.createElement("div")

a.className="attack"

a.style.left=x+"px"
a.style.top=y+"px"

map.appendChild(a)

setTimeout(()=>a.remove(),400)

}

function upgradeAtk(){

if(gold<50)return

gold-=50

heroAtk+=5

updateUI()

}

function upgradeDungeon(){

if(gold<200)return

gold-=200

dungeonLv++

updateUI()

}

setInterval(spawnMonster,2000)

setInterval(heroAttack,700)

setInterval(moveMonsters,30)

updateUI()

</script>

</body>
</html>
