<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon Dungeon Builder</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#020617;
color:white;
font-family:sans-serif;
text-align:center;
}

#map{

width:440px;
height:440px;
margin:auto;
display:grid;
grid-template-columns:repeat(11,1fr);
grid-template-rows:repeat(11,1fr);

background:#0f172a;

border:2px solid #334155;

}

.cell{

border:1px solid #1e293b;
position:relative;

}

.room{

background:#1e293b;

}

.monster{

position:absolute;
font-size:18px;

}

.hero{

position:absolute;
font-size:20px;

}

.hp{

position:absolute;
top:-6px;
font-size:9px;

}

.gold{

color:#facc15;
font-weight:bold;

}

button{

padding:8px;
background:#1e293b;
border-radius:6px;
margin:4px;

}

</style>

</head>

<body>

<h1 class="text-2xl mt-2">🐉 Dragon Dungeon</h1>

<div class="gold">Gold : <span id="gold">200</span></div>

<button onclick="buildRoom()">🧱 방 만들기 (50)</button>
<button onclick="spawnMonster()">👾 몬스터 배치 (100)</button>

<div id="map"></div>

<script>

const map=document.getElementById("map")

let gold=200

let rooms=[]

let monsters=[]

let heroes=[]

function updateUI(){

document.getElementById("gold").innerText=gold

}

for(let i=0;i<121;i++){

const cell=document.createElement("div")

cell.className="cell"

cell.onclick=()=>cellClick(i)

map.appendChild(cell)

}

let selectedCell=null

function cellClick(i){

selectedCell=i

}

function buildRoom(){

if(gold<50)return

if(selectedCell==null)return

gold-=50

rooms.push(selectedCell)

map.children[selectedCell].classList.add("room")

updateUI()

}

function spawnMonster(){

if(gold<100)return

if(selectedCell==null)return

if(!rooms.includes(selectedCell))return

gold-=100

const m={

cell:selectedCell,

hp:40,
atk:5

}

const el=document.createElement("div")

el.className="monster"

el.innerText="👾"

map.children[selectedCell].appendChild(el)

m.el=el

monsters.push(m)

updateUI()

}

function spawnHero(){

const h={

cell:0,

hp:60,
atk:6

}

const el=document.createElement("div")

el.className="hero"

el.innerText="🧙"

map.children[0].appendChild(el)

h.el=el

heroes.push(h)

}

function moveHeroes(){

heroes.forEach(h=>{

if(h.cell>=120)return

map.children[h.cell].removeChild(h.el)

h.cell++

map.children[h.cell].appendChild(h.el)

})

}

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk

h.hp-=m.atk

if(m.hp<=0){

m.el.remove()

monsters.splice(mi,1)

}

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

gold+=30

updateUI()

}

}

})

})

}

setInterval(()=>{

spawnHero()

},5000)

setInterval(()=>{

moveHeroes()

battle()

},1000)

updateUI()

</script>

</body>

</html>
