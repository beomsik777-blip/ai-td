<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dragon Dungeon</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:sans-serif;
}

#ui{

display:flex;
height:100vh;

}

#leftPanel{

width:220px;
background:#020617;
padding:10px;
border-right:2px solid #334155;

}

#map{

flex:1;

display:grid;

grid-template-columns:repeat(20,1fr);
grid-template-rows:repeat(20,1fr);

background:#0f172a;

}

.cell{

border:1px solid #1e293b;
position:relative;

}

.room{background:#1e293b}
.treasure{background:#78350f}
.trap{background:#7f1d1d}

.hero,.monster{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-size:18px;

}

.hpbar{

position:absolute;
bottom:0;
left:0;

height:3px;

background:#22c55e;

}

.damage{

position:absolute;
color:red;
font-size:12px;
animation:float .7s forwards;

}

@keyframes float{

0%{opacity:1;top:50%}
100%{opacity:0;top:20%}

}

button{

width:100%;
margin:3px 0;
padding:6px;

background:#334155;
border:none;
color:white;

}

</style>

</head>

<body>

<div id="ui">

<div id="leftPanel">

<h3>🐉 Dragon Dungeon</h3>

Gold : <span id="gold">500</span>

<hr>

<button onclick="buildMode('room')">방 건설</button>
<button onclick="buildMode('treasure')">보물방</button>
<button onclick="buildMode('trap')">함정방</button>

<hr>

<button onclick="monsterMode('goblin')">👾 고블린</button>
<button onclick="monsterMode('slime')">🟢 슬라임</button>
<button onclick="monsterMode('orc')">👹 오크</button>
<button onclick="monsterMode('lich')">💀 리치</button>
<button onclick="monsterMode('dragon')">🐲 드래곤</button>
<button onclick="monsterMode('golem')">🪨 골렘</button>

<hr>

<button onclick="dragonFire()">🔥 브레스</button>

<button onclick="saveGame()">💾 저장</button>

</div>

<div id="map"></div>

</div>

<script>

/* =====================
   GAME STATE
===================== */

let gold=500

let mapSize=20

let mode=null
let selectedMonster=null

let rooms=[]
let monsters=[]
let heroes=[]

/* =====================
   MAP
===================== */

const map=document.getElementById("map")

function createMap(){

for(let i=0;i<mapSize*mapSize;i++){

const c=document.createElement("div")

c.className="cell"

c.onclick=()=>cellClick(i)

map.appendChild(c)

}

}

/* =====================
   BUILDING
===================== */

function buildMode(type){

mode="build"
buildType=type

}

function monsterMode(type){

mode="monster"
selectedMonster=type

}

function cellClick(i){

if(mode=="build") buildRoom(i)

if(mode=="monster") spawnMonster(i)

}

/* =====================
   ROOMS
===================== */

function buildRoom(i){

if(rooms.includes(i))return

rooms.push(i)

if(buildType=="room") map.children[i].classList.add("room")

if(buildType=="treasure") map.children[i].classList.add("treasure")

if(buildType=="trap") map.children[i].classList.add("trap")

}

/* =====================
   MONSTERS
===================== */

function spawnMonster(cell){

if(!rooms.includes(cell))return

const data=monsterStats(selectedMonster)

const el=document.createElement("div")

el.className="monster"

el.innerHTML=data.icon

map.children[cell].appendChild(el)

const hpbar=document.createElement("div")
hpbar.className="hpbar"

el.appendChild(hpbar)

monsters.push({

cell,
hp:data.hp,
maxHp:data.hp,
atk:data.atk,
el,
hpbar

})

}

/* =====================
   STATS
===================== */

function monsterStats(t){

if(t=="goblin")return{hp:40,atk:6,icon:"👾"}
if(t=="slime")return{hp:30,atk:4,icon:"🟢"}
if(t=="orc")return{hp:90,atk:12,icon:"👹"}
if(t=="lich")return{hp:120,atk:18,icon:"💀"}
if(t=="dragon")return{hp:200,atk:24,icon:"🐲"}
if(t=="golem")return{hp:250,atk:20,icon:"🪨"}

}

/* =====================
   HERO
===================== */

function spawnHero(){

const types=[

{icon:"⚔️",hp:120,atk:10},
{icon:"🏹",hp:90,atk:14},
{icon:"🔮",hp:80,atk:18},
{icon:"🛡️",hp:150,atk:8}

]

const t=types[Math.floor(Math.random()*types.length)]

const el=document.createElement("div")

el.className="hero"

el.innerHTML=t.icon

map.children[0].appendChild(el)

heroes.push({

cell:0,
hp:t.hp,
maxHp:t.hp,
atk:t.atk,
el

})

}

setInterval(spawnHero,5000)

/* =====================
   MOVEMENT
===================== */

function neighbors(i){

let x=i%mapSize
let y=Math.floor(i/mapSize)

let list=[]

if(x>0) list.push(i-1)
if(x<mapSize-1) list.push(i+1)
if(y>0) list.push(i-mapSize)
if(y<mapSize-1) list.push(i+mapSize)

return list

}

function moveHeroes(){

heroes.forEach(h=>{

let next=neighbors(h.cell).find(n=>rooms.includes(n))

if(next==undefined)return

map.children[h.cell].removeChild(h.el)

h.cell=next

map.children[h.cell].appendChild(h.el)

})

}

/* =====================
   COMBAT
===================== */

function showDamage(cell,val){

const d=document.createElement("div")

d.className="damage"

d.innerText="-"+val

map.children[cell].appendChild(d)

setTimeout(()=>d.remove(),700)

}

function battle(){

heroes.forEach((h,hi)=>{

monsters.forEach((m,mi)=>{

if(h.cell==m.cell){

m.hp-=h.atk
h.hp-=m.atk

showDamage(h.cell,h.atk)
showDamage(h.cell,m.atk)

m.hpbar.style.width=(m.hp/m.maxHp*100)+"%"

if(m.hp<=0){

m.el.remove()
monsters.splice(mi,1)
gold+=50

}

if(h.hp<=0){

h.el.remove()
heroes.splice(hi,1)

}

}

})

})

}

/* =====================
   DRAGON
===================== */

function dragonFire(){

heroes.forEach((h,hi)=>{

h.hp-=40

showDamage(h.cell,40)

if(h.hp<=0){

h.el.remove()

heroes.splice(hi,1)

gold+=30

}

})

}

/* =====================
   SAVE
===================== */

function saveGame(){

localStorage.setItem("dragonDungeon",JSON.stringify({

gold,
rooms

}))

}

/* =====================
   GAME LOOP
===================== */

setInterval(()=>{

moveHeroes()
battle()

document.getElementById("gold").innerText=gold

},800)

createMap()

</script>

</body>
</html>
