<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Ultimate Gate Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; display: flex; flex-direction: column; }
        
        #map-container {
            width: 92vw; height: 92vw; max-width: 460px; max-height: 460px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 5px auto;
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); pointer-events: none; }
        .wall-cell { background: #1e293b; border: 1px solid #475569; z-index: 2; position: relative; }
        .wall-cell::after { content: '🧱'; position: absolute; font-size: 8px; opacity: 0.3; top: 25%; left: 25%; }
        .range-highlight { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; z-index: 5; }

        #village {
            position: absolute; top: 36.36%; left: 36.36%; width: 27.27%; height: 27.27%;
            background: #0f172a; border: 3px double #38bdf8; z-index: 10;
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        
        #south-gate {
            position: absolute; bottom: 18.18%; left: 45.45%; width: 9.09%; height: 9.09%;
            background: #451a03; border: 2px solid #f59e0b; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #gate-hp-container { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; }
        #gate-hp-fill { height: 100%; background: #eab308; width: 100%; }

        .unit { position: absolute; width: 9.09%; height: 9.09%; z-index: 100; display: flex; align-items: center; justify-content: center; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.2s; cursor: pointer; }
        .monster { position: absolute; width: 8%; height: 8%; z-index: 50; display: flex; align-items: center; justify-content: center; transition: all 0.2s linear; font-size: 20px; }
        
        .hp-bar-bg { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }

        #timer-container { width: 100%; height: 4px; background: #1e293b; position: absolute; top: 0; left: 0; z-index: 60; }
        #timer-fill { height: 100%; background: #ef4444; width: 100%; }
        #timer-text { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #ef4444; font-weight: bold; z-index: 65; }

        .projectile { position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 120; pointer-events: none; }
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: bold; font-size: 10px; z-index: 200; pointer-events: none; animation: popUp 0.5s ease-out forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; flex-shrink: 0; }
        .info-tab { position: absolute; top: 50px; left: 5px; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; padding: 5px; border-radius: 4px; font-size: 7px; z-index: 70; max-width: 100px; }
        .ctrl-btn { background: #1e293b; color: white; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #000; }
        #exp-fill { height: 100%; background: #a855f7; width: 0%; transition: width 0.3s; }
        .start-hint { position: absolute; top: -20px; white-space: nowrap; font-size: 8px; color: #fbbf24; animation: bounce 1s infinite; font-weight: bold; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body>

    <audio id="audio-bgm" loop></audio>

    <header class="p-2 bg-slate-900 flex justify-between items-center border-b border-slate-700 shrink-0 text-[Orbitron]">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold uppercase">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <div class="flex justify-between items-center mb-0.5">
                <span id="round-text" class="text-blue-400 text-[9px] font-bold uppercase">ROUND 1/20</span>
                <span id="level-display" class="text-purple-400 text-[9px] font-bold uppercase">LV. 1</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-1"><div id="village-hp-bar" class="bg-emerald-500 h-full w-full"></div></div>
            <div class="w-full bg-slate-800 h-0.5 rounded-full overflow-hidden"><div id="exp-fill"></div></div>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-[11px] font-bold text-yellow-400">300 G</p>
            <p id="monster-count" class="text-[8px] text-red-400 font-bold uppercase">Enemies: 0</p>
        </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div class="info-tab">
            <p class="text-blue-300 font-bold mb-1 underline uppercase text-[8px]">Unit Chance</p>
            <p>🛡️ KNT: 50% (Sld)</p>
            <p class="text-orange-400">🏹 ARC: 25% (Spd)</p>
            <p class="text-blue-400">🧙 MAG: 20% (Aoe)</p>
            <p class="text-purple-500 font-bold">🐉 DRG: 5% (Strong)</p>
            <p class="mt-1 text-emerald-400 border-t border-slate-700 pt-1">Mana Regen: <span id="regen-val">0.1</span>/s</p>
        </div>

        <div id="map-container">
            <script>
                const map = document.getElementById('map-container');
                for(let i=0; i<121; i++) {
                    const r = Math.floor(i/11), c = i%11;
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    if((r === 1 || r === 9 || c === 1 || c === 9) && !(r===0||r===10||c===0||c===10)) cell.classList.add('wall-cell');
                    cell.id = `grid-${r}-${c}`;
                    map.appendChild(cell);
                }
            </script>
            <div id="timer-container"><div id="timer-fill"></div></div>
            <div id="timer-text">00:30</div>
            <div id="village">🏰</div>
            <div id="south-gate"><div id="gate-hp-container"><div id="gate-hp-fill"></div></div><span class="text-[6px] text-white font-bold uppercase">GATE</span></div>
            <div id="player" class="unit" onclick="handleHeroClick()">
                <div id="start-label" class="start-hint">TAP HERO TO START</div>
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div id="unit-layer"></div>
        </div>
    </div>

    <div class="ui-panel">
        <div class="flex justify-between items-center gap-2 mb-2">
            <button onclick="buyGuardian()" class="flex-1 py-2 bg-purple-900/40 border border-purple-500 rounded text-[9px] font-bold uppercase">Add Unit (150G) <span id="guardian-limit" class="block text-[7px] text-purple-300">0/0</span></button>
            <button onclick="startWave()" id="start-btn" class="flex-1 py-3 bg-blue-600 rounded font-bold text-[11px] uppercase opacity-50 pointer-events-none">Start Wave</button>
            <div class="flex flex-col flex-1 gap-1">
                <p id="mana-display" class="text-[9px] text-blue-400 font-bold text-center uppercase tracking-tighter">Mana: 0/0</p>
                <button onclick="castSpeedMagic()" class="py-2 bg-indigo-600 rounded text-[9px] font-bold uppercase leading-none">Burst<br><span class="text-[6px]">ASPD UP (5)</span></button>
            </div>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">▶</button>
            </div>
            <div class="bg-slate-900/80 p-2 rounded border border-slate-700 flex-1 ml-4 grid grid-cols-2 gap-1 text-center">
                <div><p class="text-[6px] text-slate-500 uppercase">Hero HP</p><p id="hero-hp-val" class="text-[9px] text-emerald-400 font-bold">0/0</p></div>
                <div><p class="text-[6px] text-slate-500 uppercase">ASPD</p><p id="hero-speed-val" class="text-[9px] text-blue-400 font-bold">1.7/s</p></div>
                <div class="col-span-2 border-t border-slate-800 pt-1 text-[10px] font-bold text-orange-400 uppercase tracking-widest">ATK: <span id="hero-atk">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const audioBgm = document.getElementById('audio-bgm');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let gameStarted = false;
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let weekly = JSON.parse(localStorage.getItem('weekly_workout_data')) || { totalHpBonus: 0, totalDef: 0 };
        
        let villageHp = 100, gateHpMax = 500, gateHp = 500, currentRound = 1, dCoin = 300;
        let dLevel = 1, dExp = 0, dExpNext = 100;
        let isWaveActive = false, waveTimer = 30;
        let playerPos = { r: 8, c: 5 }, guardians = [], monsters = [], timerInterval;
        
        let playerHpMax = 100 + weekly.totalHpBonus;
        let playerHp = playerHpMax;
        let playerDef = weekly.totalDef || 0;
        let playerLastShot = 0, playerAtkSpeed = 600, magicActive = false;
        let manaMax = 10 + user_int, currentMana = 0;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            document.getElementById('player').style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            updatePlayerUI(); updateStats();
            setInterval(() => {
                if(gameStarted) {
                    const regenAmount = 0.1 * (1 + user_int/10); 
                    currentMana = Math.min(manaMax, currentMana + regenAmount);
                    updateStats();
                }
            }, 1000);
        };

        function playAttackSound() {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.setValueAtTime(200 + Math.random()*100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function changeBGM(src) {
            if (audioBgm.getAttribute('src') !== src) {
                audioBgm.src = src; audioBgm.play().catch(e => {});
            }
        }

        function handleHeroClick() {
            if (!gameStarted) {
                audioCtx.resume();
                gameStarted = true;
                document.getElementById('start-label').style.display = 'none';
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                changeBGM('music/townbgm.mp3');
                summonRandomGuardian(true);
            } else { showRange(document.getElementById('player'), 2); }
        }

        function updateStats() {
            const levelBonus = (dLevel - 1) * 15;
            document.getElementById('hero-atk').innerText = Math.floor(25 + user_str/4 + levelBonus);
            document.getElementById('level-display').innerText = `LV. ${dLevel}`;
            document.getElementById('exp-fill').style.width = (dExp/dExpNext * 100) + "%";
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)}/${playerHpMax}`;
            document.getElementById('hero-speed-val').innerText = `${(1000/playerAtkSpeed).toFixed(1)}/s`;
            document.getElementById('d-coin').innerText = dCoin + " G";
            document.getElementById('mana-display').innerText = `Mana: ${Math.floor(currentMana)}/${manaMax}`;
            document.getElementById('guardian-limit').innerText = `Limit: ${guardians.length}/${Math.floor(user_int/5) + currentRound}`;
            document.getElementById('regen-val').innerText = (0.1 * (1 + user_int/10)).toFixed(1);
        }

        function castSpeedMagic() {
            if (currentMana < 5 || magicActive || !gameStarted) return;
            currentMana -= 5; magicActive = true; playerAtkSpeed = 300; updateStats();
            setTimeout(() => { magicActive = false; playerAtkSpeed = 600; updateStats(); }, 5000);
        }

        function movePlayer(dr, dc) {
            if (!gameStarted) return;
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 11 && nc >= 0 && nc < 11) {
                if (nr >= 4 && nr <= 6 && nc >= 4 && nc <= 6) return;
                const cell = document.getElementById(`grid-${nr}-${nc}`);
                if (cell.classList.contains('wall-cell')) return;
                playerPos.r = nr; playerPos.c = nc;
                updatePlayerUI(); clearRange();
            }
        }

        function updatePlayerUI() {
            const p = document.getElementById('player');
            p.style.top = (playerPos.r * 9.09) + '%'; p.style.left = (playerPos.c * 9.09) + '%';
            document.getElementById('player-hp-fill').style.width = (playerHp/playerHpMax*100) + "%";
        }

        function buyGuardian() {
            if (!gameStarted || guardians.length >= Math.floor(user_int/5) + currentRound || dCoin < 150) return;
            dCoin -= 150; summonRandomGuardian();
        }

        function summonRandomGuardian(isFree = false) {
            const g = document.createElement('div');
            const rand = Math.random();
            let type = "Knight";
            if (rand < 0.05) type = "Dragon";
            else if (rand < 0.25) type = "Mage";
            else if (rand < 0.50) type = "Archer";

            g.className = `unit guardian`;
            g.innerHTML = type === "Dragon" ? '🐉' : type === "Mage" ? '🧙' : type === "Archer" ? '🏹' : '🛡️';
            
            let r, c;
            do { r = Math.floor(Math.random()*7)+2; c = Math.floor(Math.random()*7)+2; }
            while ((r >= 4 && r <= 6 && c >= 4 && c <= 6) || (r === playerPos.r && c === playerPos.c));
            
            g.unitR = r; g.unitC = c;
            g.hpMax = type === "Dragon" ? 300 : type === "Knight" ? 150 : 80; 
            g.hp = g.hpMax;
            g.style.top = (r*9.09)+'%'; g.style.left = (c*9.09)+'%';
            
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); g.appendChild(hpBg);
            
            g.stats = {
                atk: type === "Dragon" ? 100 : type === "Archer" ? 40 : type === "Mage" ? 35 : 25,
                cd: type === "Archer" ? 500 : type === "Mage" ? 1500 : 1000,
                range: type === "Archer" ? 4 : type === "Mage" ? 3 : 2,
                aoe: type === "Mage" || type === "Dragon",
                lastShot: 0
            };
            
            g.onclick = (e) => { e.stopPropagation(); showRange(g, g.stats.range); };
            document.getElementById('unit-layer').appendChild(g); guardians.push(g); updateStats();
        }

        function startWave() {
            if (isWaveActive || !gameStarted) return;
            isWaveActive = true; waveTimer = 30; gateHp = 500 + (currentRound*150);
            document.getElementById('gate-hp-fill').style.width = "100%";
            document.getElementById('start-btn').classList.add('opacity-50');
            changeBGM(currentRound % 5 === 0 ? 'music/bossbgm.mp3' : 'music/defensebgm.mp3');

            let count = (currentRound % 5 === 0) ? 1 : 5 + currentRound;
            const spawnInterval = setInterval(() => {
                if(count-- <= 0) { clearInterval(spawnInterval); return; }
                createMonster(currentRound % 5 === 0);
            }, 1000);

            timerInterval = setInterval(() => {
                waveTimer--;
                document.getElementById('timer-fill').style.width = (waveTimer/30*100) + "%";
                document.getElementById('timer-text').innerText = `00:${waveTimer < 10 ? '0' + waveTimer : waveTimer}`;
                if(waveTimer <= 0) { clearInterval(timerInterval); monsters.forEach(m => m.isCharging = true); }
            }, 1000);
        }

        function createMonster(isBoss) {
            const m = document.createElement('div'); m.className = 'monster'; m.innerHTML = isBoss ? '👹' : '👾';
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); m.appendChild(hpBg);
            let r, c;
            if(Math.random() < 0.5) { r = Math.random() < 0.5 ? 0 : 10; c = Math.floor(Math.random()*11); }
            else { c = Math.random() < 0.5 ? 0 : 10; r = Math.floor(Math.random()*11); }
            m.r = r; m.c = c; m.hp = (isBoss ? 5000 : 300) + (currentRound*150); m.maxHp = m.hp;
            m.atk = (isBoss ? 50 : 15) + currentRound; m.lastAttack = 0; m.isCharging = false;
            // 겹침 방지: 격자 내 미세 랜덤 위치
            m.offX = (Math.random()-0.5)*4; m.offY = (Math.random()-0.5)*4;
            document.getElementById('map-container').appendChild(m); monsters.push(m);
            document.getElementById('monster-count').innerText = `Enemies: ${monsters.length}`;
        }

        function gainExp(amt) {
            dExp += amt;
            if (dExp >= dExpNext) {
                dExp -= dExpNext; dLevel++; dExpNext = Math.floor(dExpNext * 1.5);
                updateStats(); alert(`LEVEL UP! LV.${dLevel}`);
            } updateStats();
        }

        function gameLoop() {
            const now = Date.now();
            monsters.forEach((m, idx) => {
                let target = null;
                // 성문 진입 모드일 때만 공격 타겟 감지
                if (m.isCharging) {
                    const dP = Math.hypot(m.r - playerPos.r, m.c - playerPos.c);
                    if (dP <= 1.2) target = { type: 'player' };
                    else {
                        const nG = guardians.find(g => Math.hypot(m.r - g.unitR, m.c - g.unitC) <= 1.2);
                        if (nG) target = { type: 'guardian', ref: nG };
                        else if (gateHp > 0 && Math.abs(m.r - 9) <= 0.3 && Math.abs(m.c - 5) <= 0.3) target = { type: 'gate' };
                    }
                }

                if (target) {
                    if (now - m.lastAttack > 1500) {
                        if (target.type === 'player') { playerHp -= Math.max(1, m.atk - playerDef); updatePlayerUI(); }
                        else if (target.type === 'guardian') { 
                            target.ref.hp -= m.atk; target.ref.querySelector('.hp-bar-fill').style.width = (target.ref.hp/target.ref.hpMax*100) + "%";
                            if (target.ref.hp <= 0) { target.ref.remove(); guardians.splice(guardians.indexOf(target.ref), 1); updateStats(); }
                        } else if (target.type === 'gate') {
                            gateHp -= m.atk; document.getElementById('gate-hp-fill').style.width = (gateHp/(500 + currentRound*150)*100) + "%";
                            if (gateHp <= 0) { gateHp = 0; document.getElementById('south-gate').style.opacity = "0.2"; }
                        }
                        m.lastAttack = now;
                    }
                } else if (m.isCharging) {
                    // 성벽 물리: 6시 성문 통로(r=10, c=5)를 거쳐서만 진입 가능
                    let tr = gateHp > 0 ? 10 : 5, tc = 5;
                    const step = 0.035;
                    // X축 먼저 성문 중앙으로 정렬 후 Y축 진입 (성벽 충돌 방지)
                    if (Math.abs(m.c - 5) > 0.1 && m.r > 8) {
                        if (m.c < 5) m.c += step; else m.c -= step;
                    } else {
                        if (m.r < tr) m.r += step; else if (m.r > tr) m.r -= step;
                        if (m.c < tc) m.c += step; else if (m.c > tc) m.c -= step;
                    }

                    if (gateHp <= 0 && Math.hypot(m.r - 5, m.c - 5) < 0.2) {
                        villageHp -= (m.innerHTML === '👹' ? 50 : 10);
                        document.getElementById('village-hp-bar').style.width = villageHp + "%";
                        m.remove(); monsters.splice(idx, 1);
                        if(villageHp <= 0) { alert("VILLAGE DESTROYED!"); location.reload(); }
                    }
                } else {
                    const step = 0.045; // 궤도 회전 속도 (성벽 밖 0/10 라인만 이용)
                    if(m.r <= 0.1 && m.c < 10) m.c += step;
                    else if(m.c >= 9.9 && m.r < 10) m.r += step;
                    else if(m.r >= 9.9 && m.c > 0.1) m.c -= step;
                    else if(m.c <= 0.1 && m.r > 0.1) m.r -= step;
                }
                m.style.top = (m.r * 9.09 + m.offY) + '%'; m.style.left = (m.c * 9.09 + m.offX) + '%';
            });

            // 아군 공격
            [...guardians, {unitR: playerPos.r, unitC: playerPos.c, atk: Math.floor(25 + user_str/4 + (dLevel-1)*15), lastShot: playerLastShot, isPlayer: true}].forEach(u => {
                const cd = u.isPlayer ? playerAtkSpeed : u.stats.cd;
                const lt = u.isPlayer ? playerLastShot : u.stats.lastShot;
                const range = u.isPlayer ? 2.8 : u.stats.range + 0.8;
                if (now - lt > cd) {
                    const t = monsters.find(m => Math.hypot(u.unitR - m.r, u.unitC - m.c) <= range);
                    if (t) { 
                        if (u.isPlayer) { fire(u.unitR, u.unitC, t, '#fbbf24', u.atk); playerLastShot = now; }
                        else { 
                            if (u.stats.aoe) { // 광역 공격 (Mage/Dragon)
                                monsters.filter(m => Math.hypot(t.r - m.r, t.c - m.c) <= 1.5).forEach(target => fire(u.unitR, u.unitC, target, '#38bdf8', u.stats.atk, false));
                            } else { fire(u.unitR, u.unitC, t, '#38bdf8', u.stats.atk); }
                            u.stats.lastShot = now; 
                        }
                    }
                }
            });

            if (playerHp <= 0) { alert("HERO DEFEATED!"); location.reload(); }
            if(isWaveActive && monsters.length === 0 && waveTimer < 20) {
                isWaveActive = false; document.getElementById('start-btn').classList.remove('opacity-50');
                changeBGM('music/townbgm.mp3'); currentRound++; dCoin += 200; 
                summonRandomGuardian(true); updateStats();
            }
            requestAnimationFrame(gameLoop);
        }

        function fire(sr, sc, target, color, dmg, sound = true) {
            if(sound) playAttackSound();
            const p = document.createElement('div'); p.className = 'projectile'; p.style.backgroundColor = color;
            p.style.top = (sr*9.09+4.5)+'%'; p.style.left = (sc*9.09+4.5)+'%';
            document.getElementById('map-container').appendChild(p);
            const d = document.createElement('div'); d.className = 'dmg-text'; d.innerText = dmg;
            d.style.top = (target.r*9.09)+'%'; d.style.left = (target.c*9.09)+'%';
            document.getElementById('map-container').appendChild(d);
            setTimeout(() => d.remove(), 500);
            p.animate([{top: p.style.top, left: p.style.left}, {top: (target.r*9.09+4.5)+'%', left: (target.c*9.09+4.5)+'%'}], 120).onfinish = () => {
                p.remove();
                if (monsters.includes(target)) {
                    target.hp -= dmg;
                    const fill = target.querySelector('.hp-bar-fill');
                    if(fill) fill.style.width = (target.hp/target.maxHp*100) + "%";
                    if(target.hp <= 0) { 
                        const midx = monsters.indexOf(target); 
                        if (midx > -1) { monsters.splice(midx, 1); target.remove(); dCoin += 50; gainExp(30); } 
                    }
                }
            };
        }
        gameLoop();
    </script>
</body>
</html>
