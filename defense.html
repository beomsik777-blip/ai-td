<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Ultimate Gate Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; display: flex; flex-direction: column; }
        
        #map-container {
            width: 95vw; height: 95vw; max-width: 480px; max-height: 480px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 5px auto;
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); pointer-events: none; }
        .wall-cell { background: rgba(51, 65, 85, 0.8); border: 1px solid #475569; z-index: 2; }
        .range-highlight { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; z-index: 5; }

        #village {
            position: absolute; top: 36.36%; left: 36.36%; width: 27.27%; height: 27.27%;
            background: #1e293b; border: 2px solid #38bdf8; z-index: 10;
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        
        #south-gate {
            position: absolute; bottom: 9.09%; left: 45.45%; width: 9.09%; height: 9.09%;
            background: #78350f; border: 2px solid #f59e0b; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #gate-hp-container { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; }
        #gate-hp-fill { height: 100%; background: #eab308; width: 100%; }

        .unit { position: absolute; width: 9.09%; height: 9.09%; z-index: 100; display: flex; align-items: center; justify-content: center; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.2s linear; }
        .monster { position: absolute; width: 9.09%; height: 9.09%; z-index: 50; display: flex; align-items: center; justify-content: center; transition: all 0.2s linear; }
        
        .hp-bar-bg { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }

        #timer-container { width: 100%; height: 4px; background: #1e293b; position: absolute; top: 0; left: 0; z-index: 60; }
        #timer-fill { height: 100%; background: #ef4444; width: 100%; }

        .projectile { position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 120; pointer-events: none; }
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: bold; font-size: 10px; z-index: 200; pointer-events: none; animation: popUp 0.5s ease-out forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 8px; flex-shrink: 0; }
        .ctrl-btn { background: #1e293b; color: white; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #000; }
    </style>
</head>
<body>

    <header class="p-2 bg-slate-900 flex justify-between items-center border-b border-slate-700 shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold uppercase">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <span id="round-text" class="text-blue-400 text-[10px] font-bold uppercase">ROUND 1/20</span>
            <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden mt-1">
                <div id="village-hp-bar" class="bg-emerald-500 h-full w-full"></div>
            </div>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-[11px] font-bold text-yellow-400">300 G</p>
            <p id="mana-display" class="text-[8px] text-blue-400 font-bold uppercase">Mana: 10/10</p>
        </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative overflow-hidden">
        <div id="map-container">
            <script>
                const container = document.getElementById('map-container');
                for(let i=0; i<121; i++) {
                    const r = Math.floor(i/11), c = i%11;
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    if((r === 1 || r === 9 || c === 1 || c === 9) && !(r===0||r===10||c===0||c===10)) {
                        cell.classList.add('wall-cell');
                    }
                    cell.id = `grid-${r}-${c}`;
                    container.appendChild(cell);
                }
            </script>
            <div id="timer-container"><div id="timer-fill"></div></div>
            <div id="village">🏰</div>
            <div id="south-gate">
                <div id="gate-hp-container"><div id="gate-hp-fill"></div></div>
                <span class="text-[6px] text-white font-bold uppercase">GATE</span>
            </div>
            <div id="player" class="unit" onclick="showRange(this, 2)">
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div id="unit-layer"></div>
        </div>
    </div>

    <div class="ui-panel">
        <div class="flex justify-between items-center gap-2 mb-2">
            <button onclick="buyGuardian()" class="flex-1 py-2 bg-purple-900/40 border border-purple-500 rounded text-[9px] font-bold uppercase">Summon (150G)</button>
            <button onclick="startWave()" id="start-btn" class="flex-1 py-2 bg-blue-600 rounded font-bold text-[10px] uppercase">Start Wave</button>
            <button onclick="castSpeedMagic()" class="flex-1 py-2 bg-indigo-600 rounded text-[9px] font-bold uppercase">Burst (Mana 5)</button>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">▶</button>
            </div>
            
            <div class="bg-slate-900/80 p-2 rounded border border-slate-700 flex-1 ml-4 grid grid-cols-2 gap-1 text-center">
                <div><p class="text-[6px] text-slate-500 uppercase">HP</p><p id="hero-hp-val" class="text-[9px] text-emerald-400 font-bold">0/0</p></div>
                <div><p class="text-[6px] text-slate-500 uppercase">ASPD</p><p id="hero-speed-val" class="text-[9px] text-blue-400 font-bold">1.7/s</p></div>
                <div class="col-span-2 border-t border-slate-800 pt-1 text-[10px] font-bold text-orange-400 uppercase tracking-widest">ATK: <span id="hero-atk">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let weekly = JSON.parse(localStorage.getItem('weekly_workout_data')) || { totalHpBonus: 0, totalDef: 0 };
        
        let villageHp = 100, gateHpMax = 500, gateHp = 500, currentRound = 1, dCoin = 300;
        let isWaveActive = false, waveTimer = 30;
        let playerPos = { r: 8, c: 5 }, guardians = [], monsters = [], timerInterval;
        
        let playerHpMax = 100 + weekly.totalHpBonus;
        let playerHp = playerHpMax;
        let playerDef = weekly.totalDef || 0;
        let playerLastShot = 0, playerAtkSpeed = 600, magicActive = false;
        let manaMax = 10 + user_int, currentMana = manaMax;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            document.getElementById('player').style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            updatePlayerUI(); updateStats(); summonRandomGuardian(true);
        };

        function updateStats() {
            document.getElementById('hero-atk').innerText = Math.floor(25 + user_str/4);
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)}/${playerHpMax}`;
            document.getElementById('hero-speed-val').innerText = `${(1000/playerAtkSpeed).toFixed(1)}/s`;
            document.getElementById('d-coin').innerText = dCoin + " G";
            document.getElementById('mana-display').innerText = `Mana: ${currentMana}/${manaMax}`;
        }

        function castSpeedMagic() {
            if (currentMana < 5 || magicActive) return;
            currentMana -= 5; magicActive = true; playerAtkSpeed = 300; updateStats();
            setTimeout(() => { magicActive = false; playerAtkSpeed = 600; updateStats(); }, 5000);
        }

        function movePlayer(dr, dc) {
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 11 && nc >= 0 && nc < 11) {
                if (nr >= 4 && nr <= 6 && nc >= 4 && nc <= 6) return; 
                const cell = document.getElementById(`grid-${nr}-${nc}`);
                if (cell.classList.contains('wall-cell') && !(nr === 8 && nc === 5)) return;
                playerPos.r = nr; playerPos.c = nc;
                updatePlayerUI(); clearRange();
            }
        }

        function updatePlayerUI() {
            const p = document.getElementById('player');
            p.style.top = (playerPos.r * 9.09) + '%'; p.style.left = (playerPos.c * 9.09) + '%';
            document.getElementById('player-hp-fill').style.width = (playerHp/playerHpMax*100) + "%";
        }

        function showRange(el, range) {
            clearRange();
            const r = el.unitR !== undefined ? el.unitR : playerPos.r;
            const c = el.unitC !== undefined ? el.unitC : playerPos.c;
            for(let i=r-range; i<=r+range; i++){
                for(let j=c-range; j<=c+range; j++){
                    const cell = document.getElementById(`grid-${i}-${j}`);
                    if(cell) cell.classList.add('range-highlight');
                }
            }
        }
        function clearRange() { document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('range-highlight')); }

        function buyGuardian() { if (guardians.length >= Math.floor(user_int/5) + 1 || dCoin < 150) return; dCoin -= 150; summonRandomGuardian(); }

        function summonRandomGuardian(isFree = false) {
            const g = document.createElement('div');
            const isHidden = !isFree && Math.random() < 0.1;
            g.className = `unit guardian ${isHidden ? 'hidden-guardian' : ''}`;
            g.innerHTML = isHidden ? '🐉' : '🛡️';
            let r, c;
            do { r = Math.floor(Math.random()*7)+2; c = Math.floor(Math.random()*7)+2; }
            while ((r >= 4 && r <= 6 && c >= 4 && c <= 6) || (r === playerPos.r && c === playerPos.c));
            g.unitR = r; g.unitC = c; g.hpMax = 60 + (currentRound*15); g.hp = g.hpMax;
            g.style.top = (r*9.09)+'%'; g.style.left = (c*9.09)+'%';
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); g.appendChild(hpBg);
            g.onclick = (e) => { e.stopPropagation(); showRange(g, 2); };
            g.atk = isHidden ? 65 : 25; g.lastShot = 0;
            document.getElementById('unit-layer').appendChild(g); guardians.push(g); updateStats();
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true; waveTimer = 30; gateHp = 500 + (currentRound*100);
            document.getElementById('gate-hp-fill').style.width = "100%";
            document.getElementById('start-btn').classList.add('opacity-50');
            const isBoss = currentRound % 5 === 0;
            let count = isBoss ? 1 : 5 + currentRound;
            const spawn = setInterval(() => { if(count-- <= 0) { clearInterval(spawn); return; } createMonster(isBoss); }, 1000);
            timerInterval = setInterval(() => {
                waveTimer--; document.getElementById('timer-fill').style.width = (waveTimer/30*100) + "%";
                if(waveTimer <= 0) { clearInterval(timerInterval); monsters.forEach(m => m.isCharging = true); }
            }, 1000);
        }

        function createMonster(isBoss) {
            const m = document.createElement('div'); m.className = 'monster'; m.innerHTML = isBoss ? '👹' : '👾';
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); m.appendChild(hpBg);
            let r, c;
            if(Math.random() < 0.5) { r = Math.random() < 0.5 ? 0 : 10; c = Math.floor(Math.random()*11); }
            else { c = Math.random() < 0.5 ? 0 : 10; r = Math.floor(Math.random()*11); }
            m.r = r; m.c = c; m.hp = (isBoss ? 3500 : 300) + (currentRound*120); m.maxHp = m.hp;
            m.atk = (isBoss ? 45 : 15) + currentRound; m.lastAttack = 0; m.isCharging = false;
            document.getElementById('map-container').appendChild(m); monsters.push(m);
            document.getElementById('monster-count').innerText = `Enemies: ${monsters.length}`;
        }

        function gameLoop() {
            const now = Date.now();
            monsters.forEach((m, idx) => {
                let target = null;
                if (m.isCharging) {
                    const dP = Math.abs(m.r - playerPos.r) + Math.abs(m.c - playerPos.c);
                    if (dP <= 1.2) target = { type: 'player' };
                    else {
                        const nG = guardians.find(g => Math.abs(m.r - g.unitR) + Math.abs(m.c - g.unitC) <= 1.2);
                        if (nG) target = { type: 'guardian', ref: nG };
                        else if (gateHp > 0 && Math.abs(m.r - 10) <= 1 && Math.abs(m.c - 5) <= 1) target = { type: 'gate' };
                    }
                }
                if (target) {
                    if (now - m.lastAttack > 1500) {
                        if (target.type === 'player') { playerHp -= Math.max(1, m.atk - playerDef); updatePlayerUI(); }
                        else if (target.type === 'guardian') { 
                            target.ref.hp -= m.atk; target.ref.querySelector('.hp-bar-fill').style.width = (target.ref.hp/target.ref.hpMax*100) + "%";
                            if (target.ref.hp <= 0) { target.ref.remove(); guardians.splice(guardians.indexOf(target.ref), 1); updateStats(); }
                        } else if (target.type === 'gate') {
                            gateHp -= m.atk; document.getElementById('gate-hp-fill').style.width = (gateHp/(500 + currentRound*100)*100) + "%";
                            if (gateHp <= 0) { gateHp = 0; document.getElementById('south-gate').style.display = "none"; }
                        }
                        m.lastAttack = now;
                    }
                } else if (m.isCharging) {
                    let tr = gateHp > 0 ? 10 : 5, tc = 5;
                    const step = 0.04;
                    if (m.r < tr) m.r += step; else if (m.r > tr) m.r -= step;
                    if (m.c < tc) m.c += step; else if (m.c > tc) m.c -= step;
                    if (gateHp <= 0 && Math.abs(m.r - 5) < 0.2 && Math.abs(m.c - 5) < 0.2) {
                        villageHp -= (m.innerHTML === '👹' ? 50 : 10);
                        document.getElementById('village-hp-bar').style.width = villageHp + "%";
                        m.remove(); monsters.splice(idx, 1);
                        if(villageHp <= 0) { alert("VILLAGE DESTROYED!"); location.reload(); }
                    }
                } else {
                    const step = 0.05;
                    if(Math.abs(m.r) <= 0.1 && m.c < 10) m.c += step;
                    else if(Math.abs(m.c - 10) <= 0.1 && m.r < 10) m.r += step;
                    else if(Math.abs(m.r - 10) <= 0.1 && m.c > 0) m.c -= step;
                    else if(Math.abs(m.c) <= 0.1 && m.r > 0) m.r -= step;
                }
                m.style.top = (m.r * 9.09) + '%'; m.style.left = (m.c * 9.09) + '%';
            });

            [...guardians, {unitR: playerPos.r, unitC: playerPos.c, atk: Math.floor(25 + user_str/4), lastShot: playerLastShot, isPlayer: true}].forEach(u => {
                const cd = u.isPlayer ? playerAtkSpeed : 1200;
                const lt = u.isPlayer ? playerLastShot : u.lastShot;
                if (now - lt > cd) {
                    const t = monsters.find(m => Math.hypot(u.unitR - m.r, u.unitC - m.c) <= (u.isPlayer ? 2.5 : 3.5));
                    if (t) { fire(u.unitR, u.unitC, t, u.isPlayer ? '#fbbf24' : '#38bdf8', u.atk); if(u.isPlayer) playerLastShot = now; else u.lastShot = now; }
                }
            });

            if (playerHp <= 0) { alert("HERO DEFEATED!"); location.reload(); }
            if(isWaveActive && monsters.length === 0 && waveTimer < 25) {
                isWaveActive = false; document.getElementById('start-btn').classList.remove('opacity-50');
                currentRound++; dCoin += 200; updateStats();
            }
            requestAnimationFrame(gameLoop);
        }

        function fire(sr, sc, target, color, dmg) {
            const p = document.createElement('div'); p.className = 'projectile'; p.style.backgroundColor = color;
            p.style.top = (sr*9.09+4.5)+'%'; p.style.left = (sc*9.09+4.5)+'%';
            document.getElementById('map-container').appendChild(p);
            const d = document.createElement('div'); d.className = 'dmg-text'; d.innerText = dmg;
            d.style.top = (target.r*9.09)+'%'; d.style.left = (target.c*9.09)+'%';
            document.getElementById('map-container').appendChild(d);
            setTimeout(() => d.remove(), 500); playHitSound();
            p.animate([{top: p.style.top, left: p.style.left}, {top: (target.r*9.09+4.5)+'%', left: (target.c*9.09+4.5)+'%'}], 120).onfinish = () => p.remove();
            target.hp -= dmg;
            const fill = target.querySelector('.hp-bar-fill');
            if(fill) fill.style.width = (target.hp/target.maxHp*100) + "%";
            if(target.hp <= 0) { const midx = monsters.indexOf(target); if (midx > -1) { monsters.splice(midx, 1); target.remove(); dCoin += 40; updateStats(); } }
        }
        gameLoop();
    </script>
</body>
</html>
