<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Defense Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        /* 🗺️ 20x20 격자 맵 */
        .grid-map { 
            display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(20, 1fr);
            width: 95vw; height: 95vw; max-width: 600px; max-height: 600px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 10px auto;
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); position: relative; }

        /* 🏰 중앙 기지 (9,9 ~ 10,10 영역) */
        #base { 
            position: absolute; top: 45%; left: 45%; width: 10%; height: 10%;
            background: #1e293b; border: 2px solid #38bdf8; z-index: 10; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 0 15px #38bdf8;
        }

        /* 🤺 플레이어 & 적 */
        #player { 
            position: absolute; width: 4.5%; height: 4.5%; z-index: 50; 
            background-size: contain; background-repeat: no-repeat; 
            transition: all 0.15s ease-out; filter: drop-shadow(0 0 5px #38bdf8);
        }
        .monster { position: absolute; width: 4%; height: 4%; z-index: 30; transition: all 0.1s linear; display: flex; align-items: center; justify-content: center; }
        .tower { position: absolute; width: 5%; height: 5%; z-index: 20; display: flex; align-items: center; justify-content: center; transform: translate(-10%, -10%); }

        /* 🏹 공격 이펙트 (번개/검기) */
        .laser { position: absolute; background: #38bdf8; z-index: 45; transform-origin: 0 50%; height: 2px; pointer-events: none; opacity: 0.8; }
        
        /* ⬇️ 시작지점 표시기 */
        .spawn-indicator { position: absolute; font-size: 20px; color: #ef4444; animation: bounce 0.6s infinite alternate; z-index: 60; }
        @keyframes bounce { from { opacity: 0.3; transform: translateY(0); } to { opacity: 1; transform: translateY(-10px); } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; }
        .tower-btn { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 4px; text-align: center; }
        .tower-btn.selected { border-color: #38bdf8; background: #020617; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-3 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold">◀ EXIT</button>
        <div class="text-center">
            <span id="round-display" class="text-blue-400 text-xs font-bold uppercase">Round 1</span>
            <div class="w-32 bg-slate-800 h-1.5 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="hp-bar" class="bg-emerald-500 h-full w-full"></div>
            </div>
        </div>
        <p id="d-coin" class="text-xs font-bold text-yellow-400">200 D-G</p>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div id="map" class="grid-map" onclick="handleMapClick(event)">
            <div id="base">🏰</div>
            <div id="player"></div>
            </div>
    </div>

    <div class="ui-panel shrink-0">
        <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
            <button onclick="selectTower('arrow', 50)" id="btn-arrow" class="tower-btn min-w-[70px]">🏹 <p class="text-[8px] mt-1">Arrow(50)</p></button>
            <button onclick="selectTower('magic', 80)" id="btn-magic" class="tower-btn min-w-[70px]">⚡ <p class="text-[8px] mt-1">Magic(80)</p></button>
            <button onclick="selectTower('cannon', 120)" id="btn-cannon" class="tower-btn min-w-[70px]">💣 <p class="text-[8px] mt-1">Cannon(120)</p></button>
            <button onclick="selectTower('hero', 0)" id="btn-hero" class="tower-btn min-w-[70px] border-emerald-500">🤺 <p class="text-[8px] mt-1 text-emerald-400">MOVE MODE</p></button>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div Sebastian></div><button class="bg-slate-800 w-8 h-8 rounded" onclick="movePlayer(0,-1)">▲</button><div></div>
                <button class="bg-slate-800 w-8 h-8 rounded" onclick="movePlayer(-1,0)">◀</button>
                <button class="bg-slate-800 w-8 h-8 rounded" onclick="movePlayer(0,1)">▼</button>
                <button class="bg-slate-800 w-8 h-8 rounded" onclick="movePlayer(1,0)">▶</button>
            </div>
            
            <div class="flex flex-col items-center gap-2">
                <button onclick="playerAttack()" class="w-14 h-14 bg-orange-600 rounded-full border-2 border-white shadow-lg active:scale-90 font-bold text-xs">ATTACK</button>
                <button onclick="startWave()" id="start-btn" class="px-4 py-1 bg-blue-600 rounded font-bold text-[10px]">START ROUND</button>
            </div>

            <div class="text-right text-[9px] text-slate-400 leading-tight">
                <p>STR: <span id="str-view" class="text-orange-400">0</span></p>
                <p>INT: <span id="int-view" class="text-blue-400">0</span></p>
            </div>
        </div>
    </div>

    <script>
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let dCoin = 200;
        let villageHp = 100;
        let currentRound = 1;
        let playerPos = { r: 10, c: 7 };
        let selectedTowerType = null;
        let monsters = [];
        let towers = [];
        let isWaveActive = false;

        const map = document.getElementById('map');
        const player = document.getElementById('player');
        const inbody = JSON.parse(localStorage.getItem('user_inbody'));

        // 캐릭터 설정
        if (inbody) player.style.backgroundImage = inbody.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
        else player.style.backgroundImage = "url('image/nocheck.png')";

        function createCells() {
            for (let i = 0; i < 400; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                map.appendChild(cell);
            }
            updatePlayerUI();
            document.getElementById('str-view').innerText = user_str;
            document.getElementById('int-view').innerText = user_int;
        }

        function updatePlayerUI() {
            player.style.top = (playerPos.r * 5) + '%';
            player.style.left = (playerPos.c * 5) + '%';
        }

        function movePlayer(dr, dc) {
            playerPos.r = Math.max(0, Math.min(19, playerPos.r + dr));
            playerPos.c = Math.max(0, Math.min(19, playerPos.c + dc));
            updatePlayerUI();
        }

        function selectTower(type, cost) {
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            selectedTowerType = type;
            document.getElementById('btn-' + type).classList.add('selected');
        }

        function handleMapClick(e) {
            if (!selectedTowerType || selectedTowerType === 'hero') return;
            const rect = map.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const c = Math.floor((x / rect.width) * 20);
            const r = Math.floor((y / rect.height) * 20);
            
            const cost = selectedTowerType === 'arrow' ? 50 : selectedTowerType === 'magic' ? 80 : 120;
            if (dCoin >= cost) {
                placeTower(r, c, selectedTowerType, cost);
            }
        }

        function placeTower(r, c, type, cost) {
            if (towers.find(t => t.r === r && t.c === c)) return;
            dCoin -= cost;
            document.getElementById('d-coin').innerText = dCoin + " D-G";
            
            const towerEl = document.createElement('div');
            towerEl.className = 'tower';
            towerEl.innerHTML = type === 'arrow' ? '🏹' : type === 'magic' ? '⚡' : '💣';
            towerEl.style.top = (r * 5) + '%';
            towerEl.style.left = (c * 5) + '%';
            map.appendChild(towerEl);
            
            towers.push({ r, c, type, lastShot: 0, cooldown: type === 'magic' ? 800 : 1500 });
        }

        function playerAttack() {
            const range = 3 + (user_int / 50);
            monsters.forEach(m => {
                const dist = Math.sqrt(Math.pow(playerPos.r - m.r, 2) + Math.pow(playerPos.c - m.c, 2));
                if (dist <= range) {
                    m.hp -= (10 + user_str / 5);
                    drawLaser(playerPos.r, playerPos.c, m.r, m.c, '#fbbf24');
                }
            });
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            document.getElementById('start-btn').style.display = 'none';
            
            const spawnDir = currentRound % 4; // 0북, 1동, 2남, 3서
            showIndicator(spawnDir);

            let count = currentRound * 5;
            if (currentRound % 5 === 0) count = 1; // 보스

            const interval = setInterval(() => {
                if (count <= 0) { clearInterval(interval); return; }
                spawnMonster(spawnDir, currentRound % 5 === 0);
                count--;
            }, 1000);
        }

        function showIndicator(dir) {
            const ind = document.createElement('div');
            ind.className = 'spawn-indicator';
            const pos = [
                {t:'-5%', l:'50%', txt:'⬇️'}, {t:'50%', l:'105%', txt:'⬅️'}, 
                {t:'105%', l:'50%', txt:'⬆️'}, {t:'50%', l:'-5%', txt:'➡️'}
            ][dir];
            ind.style.top = pos.t; ind.style.left = pos.l; ind.innerText = pos.txt;
            map.appendChild(ind);
            setTimeout(() => ind.remove(), 3000);
        }

        function spawnMonster(dir, isBoss) {
            const m = document.createElement('div');
            m.className = 'monster';
            m.innerHTML = isBoss ? '👹' : '👾';
            if (isBoss) m.style.fontSize = '1.5rem';
            
            const start = [{r:0,c:10}, {r:10,c:19}, {r:19,c:10}, {r:10,c:0}][dir];
            m.r = start.r; m.c = start.c;
            m.hp = (isBoss ? 400 : 30) + (currentRound * 10);
            map.appendChild(m);
            monsters.push(m);
        }

        function drawLaser(r1, c1, r2, c2, color) {
            const laser = document.createElement('div');
            laser.className = 'laser';
            const x1 = c1 * 5 + 2.5, y1 = r1 * 5 + 2.5;
            const x2 = c2 * 5 + 2.5, y2 = r2 * 5 + 2.5;
            const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1);
            laser.style.width = dist + '%';
            laser.style.left = x1 + '%';
            laser.style.top = y1 + '%';
            laser.style.transform = `rotate(${angle}rad)`;
            laser.style.backgroundColor = color;
            map.appendChild(laser);
            setTimeout(() => laser.remove(), 150);
        }

        // 메인 게임 루프 (타워 공격 및 적 이동)
        setInterval(() => {
            if (!isWaveActive && monsters.length === 0) return;

            // 1. 적 이동
            monsters.forEach((m, index) => {
                const dr = 9.5 - m.r, dc = 9.5 - m.c;
                const dist = Math.sqrt(dr*dr + dc*dc);
                if (dist > 0.5) {
                    m.r += (dr/dist) * 0.15;
                    m.c += (dc/dist) * 0.15;
                    m.style.top = (m.r * 5) + '%';
                    m.style.left = (m.c * 5) + '%';
                } else {
                    villageHp -= (m.innerHTML === '👹' ? 40 : 10);
                    document.getElementById('hp-bar').style.width = villageHp + '%';
                    m.remove(); monsters.splice(index, 1);
                    if (villageHp <= 0) { alert("GAME OVER"); location.reload(); }
                }
                if (m.hp <= 0) {
                    m.remove(); monsters.splice(index, 1);
                    dCoin += 15; document.getElementById('d-coin').innerText = dCoin + " D-G";
                }
            });

            // 2. 타워 자동 공격
            const now = Date.now();
            towers.forEach(t => {
                if (now - t.lastShot > t.cooldown) {
                    const target = monsters.find(m => {
                        return Math.sqrt(Math.pow(t.r-m.r, 2) + Math.pow(t.c-m.c, 2)) < 6;
                    });
                    if (target) {
                        target.hp -= (15 + user_str/10);
                        t.lastShot = now;
                        drawLaser(t.r, t.c, target.r, target.c, '#38bdf8');
                    }
                }
            });

            if (isWaveActive && monsters.length === 0) {
                isWaveActive = false;
                currentRound++;
                document.getElementById('round-display').innerText = "ROUND " + currentRound;
                document.getElementById('start-btn').style.display = 'block';
            }
        }, 100);

        createCells();
    </script>
</body>
</html>
