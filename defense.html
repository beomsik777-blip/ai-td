<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Level Up Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        .grid-map { 
            display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(20, 1fr);
            width: 95vw; height: 95vw; max-width: 550px; max-height: 550px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 5px auto;
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); }
        .path-tile { background: rgba(56, 189, 248, 0.08) !important; }

        #base { 
            position: absolute; bottom: 0; left: 25%; width: 50%; height: 10%; 
            background: linear-gradient(to bottom, #1e293b, #0f172a); 
            border: 3px solid #38bdf8; z-index: 10; border-radius: 10px 10px 0 0;
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: bold;
        }

        #player { 
            position: absolute; width: 5%; height: 5%; z-index: 100; 
            background-size: contain; background-repeat: no-repeat; background-position: center;
            transition: all 0.2s; cursor: pointer;
        }
        #player.active { outline: 2px solid #fbbf24; border-radius: 50%; box-shadow: 0 0 10px #fbbf24; }

        .monster { position: absolute; width: 5%; height: 5%; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.6s linear; visibility: hidden; }
        .hp-bg { width: 90%; height: 3px; background: #450a0a; position: absolute; top: -4px; border-radius: 1px; }
        .hp-fill { height: 100%; background: #22c55e; }

        .tower { position: absolute; width: 5%; height: 5%; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; box-sizing: border-box; }
        #preview-tower { position: absolute; width: 5%; height: 5%; z-index: 45; display: none; background: rgba(251, 191, 36, 0.3); border: 1px solid #fbbf24; pointer-events: none; }

        .projectile { position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 80; pointer-events: none; }
        .dmg-text { position: absolute; font-weight: bold; color: #fbbf24; font-size: 8px; z-index: 110; animation: up-fade 0.4s forwards; }
        @keyframes up-fade { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; }
        .tower-btn { background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 4px; text-align: center; }
        .tower-btn.selected { border-color: #38bdf8; background: #0f172a; color: #38bdf8; }
        .ctrl-btn { background: #1e293b; color: white; width: 35px; height: 35px; border-radius: 6px; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        
        /* 🧬 경험치 바 스타일 */
        .exp-container { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        #exp-fill { height: 100%; background: #a855f7; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="flex flex-col">

    <audio id="bgm" loop><source src="music/townbgm.mp3" type="audio/mpeg"></audio>
    <audio id="snd-atk"><source src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3" type="audio/mpeg"></audio>
    <audio id="snd-tower"><source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg"></audio>

    <header class="p-2 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[9px] font-bold uppercase">◀ Exit</button>
        <div class="text-center flex-1 mx-4">
            <div class="flex justify-between items-center">
                <span id="round-display" class="text-blue-400 text-[9px] font-bold uppercase">Round 1</span>
                <span id="lv-display" class="text-purple-400 text-[9px] font-bold uppercase text-right">D-LV. 1</span>
            </div>
            <div class="w-full bg-slate-800 h-1 mt-0.5 rounded-full overflow-hidden border border-slate-700">
                <div id="hp-bar" class="bg-emerald-500 h-full w-full transition-all"></div>
            </div>
            <div class="exp-container"><div id="exp-fill"></div></div>
        </div>
        <div class="text-right ml-2">
            <p id="d-coin" class="text-xs font-bold text-yellow-400 leading-none">200 DG</p>
        </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div id="map" class="grid-map" onclick="handleMapClick(event)">
            <div id="base">🛡️ VILLAGE</div>
            <div id="p-range-circle" class="range-circle" style="border-color: #fbbf24;"></div>
            <div id="preview-range" class="range-circle" style="border-color: #38bdf8;"></div>
            <div id="preview-tower"></div>
            <div id="player" onclick="togglePlayer(event)"></div>
        </div>
    </div>

    <div class="ui-panel shrink-0">
        <div class="flex gap-1.5 mb-2">
            <button onclick="selectTowerType('arrow', 50)" id="btn-arrow" class="tower-btn flex-1">
                <p class="text-[9px] font-bold">🏹 50G</p>
                <p id="dmg-arrow" class="text-[7px] text-orange-400">ATK: 0</p>
            </button>
            <button onclick="selectTowerType('magic', 80)" id="btn-magic" class="tower-btn flex-1">
                <p class="text-[9px] font-bold">⚡ 80G</p>
                <p id="dmg-magic" class="text-[7px] text-blue-400">ATK: 0</p>
            </button>
            <button onclick="selectTowerType('cannon', 120)" id="btn-cannon" class="tower-btn flex-1">
                <p class="text-[9px] font-bold">💣 120G</p>
                <p id="dmg-cannon" class="text-[7px] text-red-400">ATK: 0</p>
            </button>
            <button id="confirm-btn" onclick="confirmBuild()" class="flex-1 bg-emerald-700 rounded text-[9px] font-bold hidden">BUILD</button>
        </div>
        
        <div class="flex justify-between items-center gap-2">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">▶</button>
            </div>
            <button onclick="startWave()" id="start-btn" class="flex-1 py-3 bg-blue-600 rounded-md font-bold text-[9px] uppercase active:scale-95">START WAVE</button>
            <div class="bg-slate-900/80 p-1.5 rounded border border-slate-700 min-w-[75px] text-center">
                <p class="text-[6px] text-slate-500 uppercase">Hero Attack</p>
                <p id="hero-atk-val" class="text-[10px] text-orange-400 font-bold">0</p>
                <p class="text-[6px] text-slate-500 uppercase mt-1">INT Buff</p>
                <p id="hero-int-val" class="text-[9px] text-blue-400 font-bold">0</p>
            </div>
        </div>
    </div>

    <script>
        // 기초 데이터
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let dCoin = 200, villageHp = 100, currentRound = 1;
        
        // 🧬 레벨업 시스템 데이터
        let dLevel = 1, currentExp = 0, nextExp = 100;
        let heroAtkBase = 30 + user_str/4;

        let playerPos = { r: 18, c: 9 }, playerActive = false, playerLastShot = 0;
        let selectedType = null, pendingBuild = null, towers = [], monsters = [], isWaveActive = false;
        
        const map = document.getElementById('map'), player = document.getElementById('player'), pRange = document.getElementById('p-range-circle');
        const previewTower = document.getElementById('preview-tower'), previewRange = document.getElementById('preview-range');
        const sndAtk = document.getElementById('snd-atk'), sndTower = document.getElementById('snd-tower');

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            player.style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            for (let i = 0; i < 400; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell'; cell.id = `cell-${Math.floor(i/20)}-${i%20}`;
                map.appendChild(cell);
            }
            updatePlayerUI();
            updateStatsDisplay();
            document.body.onclick = () => { document.getElementById('bgm').play().catch(e=>{}); };
            updateVisualPath();
        };

        function updateStatsDisplay() {
            const currentHeroAtk = heroAtkBase + (dLevel - 1) * 10;
            document.getElementById('hero-atk-val').innerText = Math.floor(currentHeroAtk);
            document.getElementById('hero-int-val').innerText = user_int;
            document.getElementById('dmg-arrow').innerText = `ATK: ${Math.floor(35 + user_str/6)}`;
            document.getElementById('dmg-magic').innerText = `ATK: ${Math.floor(25 + user_str/8)}`;
            document.getElementById('dmg-cannon').innerText = `ATK: ${Math.floor(60 + user_str/4)}`;
            document.getElementById('lv-display').innerText = `D-LV. ${dLevel}`;
        }

        // 🧬 경험치 획득 및 레벨업
        function gainExp(amount) {
            currentExp += amount;
            if (currentExp >= nextExp) {
                currentExp -= nextExp;
                dLevel++;
                nextExp = Math.floor(nextExp * 1.3);
                showDmgText(playerPos.r, playerPos.c, "LEVEL UP!", "#a855f7");
                updateStatsDisplay();
            }
            document.getElementById('exp-fill').style.width = (currentExp / nextExp * 100) + '%';
        }

        function togglePlayer(e) {
            e.stopPropagation();
            playerActive = !playerActive;
            player.className = playerActive ? 'active' : '';
            pRange.style.display = playerActive ? 'block' : 'none';
            updatePlayerUI();
        }

        function updatePlayerUI() {
            player.style.top = (playerPos.r * 5) + '%';
            player.style.left = (playerPos.c * 5) + '%';
            const rangeVal = 1.5 + (user_int / 100); 
            pRange.style.width = (rangeVal * 10 * 2) + '%';
            pRange.style.height = (rangeVal * 10 * 2) + '%';
            pRange.style.top = ((playerPos.r + 0.5) * 5) + '%';
            pRange.style.left = ((playerPos.c + 0.5) * 5) + '%';
        }

        function movePlayer(dr, dc) {
            if (!playerActive) return;
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 20 && nc >= 0 && nc < 20 && !towers.some(t => t.r === nr && t.c === nc)) {
                if (!(nr >= 18 && nc >= 5 && nc <= 14)) { playerPos.r = nr; playerPos.c = nc; updatePlayerUI(); }
            }
        }

        function selectTowerType(type, cost) {
            if (selectedType?.type === type) { cancelBuild(); selectedType = null; }
            else { 
                selectedType = { type, cost };
                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('btn-' + type).classList.add('selected');
            }
        }

        function handleMapClick(e) {
            if (!selectedType) return;
            const rect = map.getBoundingClientRect();
            const c = Math.floor(((e.clientX - rect.left) / rect.width) * 20);
            const r = Math.floor(((e.clientY - rect.top) / rect.height) * 20);
            if (towers.some(t => t.r === r && t.c === c) || (r >= 18 && c >= 5 && c <= 14)) return;
            if (!isPathPossible(r, c)) { alert("길을 막을 수 없습니다!"); return; }

            pendingBuild = { r, c, ...selectedType };
            previewTower.style.display = 'block';
            previewTower.style.top = (r * 5) + '%'; previewTower.style.left = (c * 5) + '%';
            previewRange.style.display = 'block';
            const tr = pendingBuild.type === 'magic' ? 3.5 : 5;
            previewRange.style.width = (tr * 10) + '%'; previewRange.style.height = (tr * 10) + '%';
            previewRange.style.top = ((r + 0.5) * 5) + '%'; previewRange.style.left = ((c + 0.5) * 5) + '%';
            document.getElementById('confirm-btn').classList.remove('hidden');
        }

        function isPathPossible(testR, testC) {
            const queue = [{r: 0, c: 10}];
            const visited = new Set(["0,10"]);
            while(queue.length > 0) {
                const cur = queue.shift();
                if (cur.r >= 18) return true;
                const nexts = [{r:cur.r+1, c:cur.c}, {r:cur.r, c:cur.c+1}, {r:cur.r, c:cur.c-1}, {r:cur.r-1, c:cur.c}];
                for(let n of nexts) {
                    const key = `${n.r},${n.c}`;
                    if (n.r >= 0 && n.r < 20 && n.c >= 0 && n.c < 20 && !visited.has(key)) {
                        const isBlocked = towers.some(t => t.r === n.r && t.c === n.c) || (n.r === testR && n.c === testC);
                        if (!isBlocked) { visited.add(key); queue.push(n); }
                    }
                }
            }
            return false;
        }

        function confirmBuild() {
            if (!pendingBuild || dCoin < pendingBuild.cost) return;
            dCoin -= pendingBuild.cost; document.getElementById('d-coin').innerText = dCoin + " DG";
            const el = document.createElement('div');
            el.className = 'tower'; el.innerHTML = pendingBuild.type === 'arrow' ? '🏹' : pendingBuild.type === 'magic' ? '⚡' : '💣';
            el.style.top = (pendingBuild.r * 5) + '%'; el.style.left = (pendingBuild.c * 5) + '%';
            map.appendChild(el);
            towers.push({ ...pendingBuild, lastShot: 0, cooldown: pendingBuild.type === 'magic' ? 700 : 1300, range: (pendingBuild.type === 'magic' ? 3.5 : 5)/2 });
            cancelBuild();
            updateVisualPath();
        }

        function cancelBuild() {
            pendingBuild = null; previewTower.style.display = 'none'; previewRange.style.display = 'none'; 
            document.getElementById('confirm-btn').classList.add('hidden');
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
        }

        function getNextMove(curR, curC) {
            const queue = [{r: curR, c: curC, path: []}];
            const visited = new Set([`${curR},${curC}`]);
            while(queue.length > 0) {
                const {r, c, path} = queue.shift();
                if (r >= 18) return path[0] || {r, c};
                const neighbors = [{r:r+1, c}, {r:r, c:c+1}, {r, c:c-1}, {r:r-1, c}];
                for(let n of neighbors) {
                    const key = `${n.r},${n.c}`;
                    if (n.r >=0 && n.r < 20 && n.c >= 0 && n.c < 20 && !towers.some(t => t.r === n.r && t.c === n.c) && !visited.has(key)) {
                        visited.add(key); queue.push({r: n.r, c: n.c, path: [...path, {r: n.r, c: n.c}]});
                    }
                }
            }
            return {r: curR, c: curC};
        }

        function updateVisualPath() {
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('path-tile'));
            let r = 0, c = 10;
            for(let i=0; i<60; i++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if(cell) cell.classList.add('path-tile');
                if (r >= 18) break;
                const next = getNextMove(r, c);
                if(r === next.r && c === next.c) break;
                r = next.r; c = next.c;
            }
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            document.getElementById('start-btn').classList.add('opacity-50', 'pointer-events-none');
            const isBoss = currentRound % 5 === 0;
            let count = isBoss ? 1 : 5 + currentRound;
            const interval = setInterval(() => {
                if (count-- <= 0) { clearInterval(interval); return; }
                spawnMonster(isBoss);
            }, 1000);
        }

        function spawnMonster(isBoss) {
            const m = document.createElement('div');
            m.className = 'monster'; m.innerHTML = isBoss ? '👹' : '👾';
            const hpCont = document.createElement('div'); hpCont.className = 'hp-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-fill';
            hpCont.appendChild(hpFill); m.appendChild(hpCont);
            m.r = 0; m.c = 10; m.maxHp = (isBoss ? 3000 : 300) + (currentRound * 100); m.hp = m.maxHp;
            m.style.top = (m.r * 5) + '%'; m.style.left = (m.c * 5) + '%'; m.style.visibility = 'visible';
            map.appendChild(m); monsters.push(m);
        }

        function fireProjectile(fromR, fromC, target, color, dmg) {
            const p = document.createElement('div');
            p.className = 'projectile'; p.style.backgroundColor = color;
            const sX = fromC * 5 + 2.5, sY = fromR * 5 + 2.5;
            p.style.left = sX + '%'; p.style.top = sY + '%';
            map.appendChild(p);

            p.animate([{ left: sX + '%', top: sY + '%' }, { left: (target.c * 5 + 2.5) + '%', top: (target.r * 5 + 2.5) + '%' }], { duration: 150 }).onfinish = () => {
                p.remove();
                if (monsters.includes(target)) {
                    target.hp -= dmg;
                    showDmgText(target.r, target.c, `-${Math.floor(dmg)}`);
                    target.querySelector('.hp-fill').style.width = (target.hp/target.maxHp*100) + '%';
                    if(target.hp <= 0) {
                        mDie(target);
                    }
                }
            };
        }

        function mDie(target) {
            const idx = monsters.indexOf(target);
            if(idx > -1) {
                monsters.splice(idx, 1);
                target.remove();
                dCoin += 65; gainExp(25); // 경험치 획득
                document.getElementById('d-coin').innerText = dCoin + " DG";
            }
        }

        function showDmgText(r, c, txt, color="#fbbf24") {
            const t = document.createElement('div'); t.className = 'dmg-text'; t.innerText = txt;
            t.style.color = color; t.style.top = (r*5)+'%'; t.style.left = (c*5)+'%'; 
            map.appendChild(t); setTimeout(() => t.remove(), 400);
        }

        // ⚙️ 엔진 (이동 루프)
        setInterval(() => {
            if (!isWaveActive && monsters.length === 0) return;
            monsters.forEach((m) => {
                const next = getNextMove(m.r, m.c);
                m.r = next.r; m.c = next.c;
                m.style.top = (m.r * 5) + '%'; m.style.left = (m.c * 5) + '%';

                if (m.r >= 18) {
                    villageHp -= (m.innerHTML === '👹' ? 60 : 15);
                    document.getElementById('hp-bar').style.width = Math.max(0, villageHp) + '%';
                    m.remove(); monsters.splice(monsters.indexOf(m), 1);
                    if (villageHp <= 0) { alert("DEFENSE FAILED!"); location.reload(); }
                }
            });
            if (isWaveActive && monsters.length === 0) {
                isWaveActive = false; currentRound++;
                document.getElementById('round-display').innerText = "ROUND " + currentRound;
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                updateVisualPath();
            }
        }, 600);

        // ⚔️ 자동 공격 (공격 루프 분리하여 렉 방지)
        setInterval(() => {
            if (monsters.length === 0) return;
            const now = Date.now();
            
            towers.forEach(t => {
                if (now - t.lastShot > t.cooldown) {
                    const target = monsters.find(m => Math.abs(t.r-m.r) + Math.abs(t.c-m.c) <= t.range * 2.5);
                    if (target) { sndTower.currentTime = 0; sndTower.play(); fireProjectile(t.r, t.c, target, '#38bdf8', (40 + user_str/6)); t.lastShot = now; }
                }
            });

            if (playerActive && now - playerLastShot > 600) {
                const pRangeVal = 1.5 + (user_int / 120);
                const target = monsters.find(m => Math.abs(playerPos.r-m.r) + Math.abs(playerPos.c-m.c) <= pRangeVal * 2.5);
                if (target) { 
                    sndAtk.currentTime = 0; sndAtk.play(); 
                    const curAtk = heroAtkBase + (dLevel - 1) * 10;
                    fireProjectile(playerPos.r, playerPos.c, target, '#fbbf24', curAtk); 
                    playerLastShot = now; 
                }
            }
        }, 150); // 공격 주기를 살짝 늦춰 최적화
    </script>
</body>
</html>
