<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Ultimate Gate Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        #map-container {
            width: 95vw; height: 95vw; max-width: 500px; max-height: 500px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 10px auto;
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.1); pointer-events: none; }
        .range-highlight { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; z-index: 5; }

        #village {
            position: absolute; top: 36.36%; left: 36.36%; width: 27.27%; height: 27.27%;
            background: #1e293b; border: 2px solid #38bdf8; z-index: 10;
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        #south-gate {
            position: absolute; bottom: 36.36%; left: 45.45%; width: 9.09%; height: 4px;
            background: #ef4444; z-index: 15; transition: all 0.5s;
        }
        #south-gate.open { background: #10b981; transform: scaleX(0); }

        /* 📍 수호자 이미지 쏠림 방지 (중앙 정렬) */
        .unit { position: absolute; width: 9.09%; height: 9.09%; z-index: 100; display: flex; align-items: center; justify-content: center; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.15s linear; pointer-events: auto; }
        .monster { position: absolute; width: 9.09%; height: 9.09%; z-index: 50; display: flex; align-items: center; justify-content: center; transition: all 0.2s linear; }
        
        .hp-bar-bg { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; border-radius: 1px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }

        #timer-container { width: 100%; height: 4px; background: #1e293b; position: absolute; top: 0; left: 0; z-index: 60; }
        #timer-fill { height: 100%; background: #ef4444; width: 100%; }

        .projectile { position: absolute; width: 5px; height: 5px; border-radius: 50%; z-index: 120; pointer-events: none; }
        
        /* 💥 데미지 팝업 연출 */
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: bold; font-size: 12px; z-index: 200; pointer-events: none; animation: popUp 0.6s ease-out forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; }
        .ctrl-btn { background: #1e293b; color: white; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #000; }
        .magic-btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: 1px solid #a78bfa; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="flex flex-col">

    <audio id="bgm" loop><source src="music/townbgm.mp3" type="audio/mpeg"></audio>

    <header class="p-3 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold uppercase">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <p id="round-text" class="text-blue-400 text-[10px] font-bold uppercase tracking-widest">ROUND 1/20</p>
            <p id="monster-count" class="text-[8px] text-red-400 font-bold uppercase">Enemies: 0</p>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-xs font-bold text-yellow-400">300 G</p>
            <p id="mana-display" class="text-[8px] text-blue-400 font-bold uppercase">Mana: 10/10</p>
        </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div id="map-container">
            <script>
                const mapContainer = document.getElementById('map-container');
                for(let i=0; i<121; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `grid-${Math.floor(i/11)}-${i%11}`;
                    mapContainer.appendChild(cell);
                }
            </script>
            <div id="timer-container"><div id="timer-fill"></div></div>
            <div id="village">🏰</div>
            <div id="south-gate"></div>
            <div id="player" class="unit" onclick="showRange(this, 2)">
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div id="unit-layer"></div>
        </div>
    </div>

    <div class="ui-panel shrink-0 space-y-3">
        <div class="flex justify-between items-center gap-2">
            <button onclick="buyGuardian()" class="flex-1 py-2 bg-purple-900/40 border border-purple-500 rounded text-[9px] font-bold uppercase">
                Summon Guardian (150G)
            </button>
            <button onclick="startWave()" id="start-btn" class="flex-1 py-3 bg-blue-600 rounded font-bold text-xs uppercase">Start Wave</button>
            <button onclick="castSpeedMagic()" class="flex-1 py-2 magic-btn rounded text-[9px] font-bold uppercase">
                ASPD UP (Mana 5)
            </button>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">▶</button>
            </div>
            
            <div class="bg-slate-900/80 p-2 rounded border border-slate-700 flex-1 ml-4 grid grid-cols-2 gap-2 text-center">
                <div>
                    <p class="text-[6px] text-slate-500 uppercase">Hero HP</p>
                    <p id="hero-hp-val" class="text-[10px] text-emerald-400 font-bold">0 / 0</p>
                </div>
                <div>
                    <p class="text-[6px] text-slate-500 uppercase">Hero ATK SPD</p>
                    <p id="hero-speed-val" class="text-[10px] text-blue-400 font-bold">1.5 / sec</p>
                </div>
                <div class="col-span-2 border-t border-slate-800 pt-1 mt-1">
                    <p id="hero-atk" class="text-[9px] text-orange-400 font-bold uppercase tracking-widest">ATK: 0</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let user_mana_max = 10 + user_int;
        let current_mana = user_mana_max;
        let weekly = JSON.parse(localStorage.getItem('weekly_workout_data')) || { totalHpBonus: 0, totalDef: 0 };
        
        let villageHp = 100, currentRound = 1, dCoin = 300, isWaveActive = false, waveTimer = 30;
        let playerPos = { r: 8, c: 5 }, guardians = [], monsters = [], timerInterval;
        
        let playerHpMax = 100 + weekly.totalHpBonus;
        let playerHp = playerHpMax;
        let playerDef = weekly.totalDef || 0;
        let playerLastShot = 0;
        let playerAtkSpeed = 600; // ms 단위
        let magicActive = false;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            document.getElementById('player').style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            updatePlayerUI();
            updateStats();
            summonRandomGuardian(true);
        };

        function updateStats() {
            document.getElementById('hero-atk').innerText = `ATK: ${Math.floor(25 + user_str/4)}`;
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)} / ${playerHpMax}`;
            document.getElementById('hero-speed-val').innerText = `${(1000 / playerAtkSpeed).toFixed(1)} / sec`;
            document.getElementById('d-coin').innerText = dCoin + " G";
            document.getElementById('mana-display').innerText = `Mana: ${current_mana}/${user_mana_max}`;
            document.getElementById('guardian-info').innerText = `${guardians.length}/${Math.floor(user_int/5) + 1}`;
        }

        function castSpeedMagic() {
            if (current_mana < 5) { alert("마나가 부족합니다!"); return; }
            if (magicActive) return;
            current_mana -= 5;
            magicActive = true;
            playerAtkSpeed = 300; // 공속 2배 증가
            updateStats();
            setTimeout(() => {
                magicActive = false;
                playerAtkSpeed = 600;
                updateStats();
            }, 5000);
        }

        function movePlayer(dr, dc) {
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 11 && nc >= 0 && nc < 11) {
                if (nr >= 4 && nr <= 6 && nc >= 4 && nc <= 6) return;
                playerPos.r = nr; playerPos.c = nc;
                updatePlayerUI();
                clearRange(); 
            }
        }

        function updatePlayerUI() {
            const p = document.getElementById('player');
            p.style.top = (playerPos.r * 9.09) + '%';
            p.style.left = (playerPos.c * 9.09) + '%';
            document.getElementById('player-hp-fill').style.width = (playerHp / playerHpMax * 100) + "%";
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)} / ${playerHpMax}`;
        }

        function showRange(el, range) {
            clearRange();
            const r = el.unitR !== undefined ? el.unitR : playerPos.r;
            const c = el.unitC !== undefined ? el.unitC : playerPos.c;
            for(let i = r - range; i <= r + range; i++) {
                for(let j = c - range; j <= c + range; j++) {
                    const cell = document.getElementById(`grid-${i}-${j}`);
                    if (cell) cell.classList.add('range-highlight');
                }
            }
        }

        function clearRange() { document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('range-highlight')); }

        function buyGuardian() {
            if (guardians.length >= Math.floor(user_int/5) + 1) { alert("지능 제한 도달!"); return; }
            if (dCoin < 150) { alert("코인 부족!"); return; }
            dCoin -= 150;
            summonRandomGuardian();
        }

        function summonRandomGuardian(isFree = false) {
            const g = document.createElement('div');
            const isHidden = !isFree && Math.random() < 0.1;
            g.className = `unit guardian ${isHidden ? 'hidden-guardian' : ''}`;
            g.innerHTML = isHidden ? '🐉' : '🛡️';
            let r, c;
            do { r = Math.floor(Math.random()*11); c = Math.floor(Math.random()*11); }
            while ((r >= 4 && r <= 6 && c >= 4 && c <= 6) || (r === playerPos.r && c === playerPos.c));
            g.unitR = r; g.unitC = c;
            g.hpMax = 60 + (currentRound * 15); g.hp = g.hpMax;
            g.style.top = (r * 9.09) + '%'; g.style.left = (c * 9.09) + '%';
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); g.appendChild(hpBg);
            g.onclick = (e) => { e.stopPropagation(); showRange(g, isHidden ? 4 : 2); };
            g.atk = isHidden ? 65 : 25; g.lastShot = 0;
            document.getElementById('unit-layer').appendChild(g);
            guardians.push(g);
            updateStats();
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true; waveTimer = 30;
            document.getElementById('start-btn').classList.add('opacity-50');
            document.getElementById('south-gate').classList.remove('open');
            const isBoss = currentRound % 5 === 0;
            let count = isBoss ? 1 : 5 + currentRound;
            const spawn = setInterval(() => { if(count-- <= 0) { clearInterval(spawn); return; } createMonster(isBoss); }, 800);
            timerInterval = setInterval(() => {
                waveTimer--;
                document.getElementById('timer-fill').style.width = (waveTimer / 30 * 100) + "%";
                if(waveTimer <= 0) { 
                    clearInterval(timerInterval);
                    document.getElementById('south-gate').classList.add('open');
                    monsters.forEach(m => m.isCharging = true); 
                }
            }, 1000);
        }

        function createMonster(isBoss) {
            const m = document.createElement('div');
            m.className = 'monster'; m.innerHTML = isBoss ? '👹' : '👾';
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
            hpBg.appendChild(hpFill); m.appendChild(hpBg);
            let r, c;
            if(Math.random() < 0.5) { r = Math.random() < 0.5 ? 0 : 10; c = Math.floor(Math.random()*11); }
            else { c = Math.random() < 0.5 ? 0 : 10; r = Math.floor(Math.random()*11); }
            m.r = r; m.c = c; m.hp = (isBoss ? 3500 : 300) + (currentRound*120); m.maxHp = m.hp;
            m.atk = (isBoss ? 45 : 15) + currentRound; m.lastAttack = 0;
            document.getElementById('map-container').appendChild(m);
            monsters.push(m);
            document.getElementById('monster-count').innerText = `Enemies: ${monsters.length}`;
        }

        function gameLoop() {
            const now = Date.now();
            monsters.forEach((m, idx) => {
                let target = null;
                const distToPlayer = Math.abs(m.r - playerPos.r) + Math.abs(m.c - playerPos.c);
                if (distToPlayer <= 1.2) target = { type: 'player' };
                else {
                    const nearG = guardians.find(g => Math.abs(m.r - g.unitR) + Math.abs(m.c - g.unitC) <= 1.2);
                    if (nearG) target = { type: 'guardian', ref: nearG };
                }

                if (target) {
                    if (now - m.lastAttack > 1200) {
                        if (target.type === 'player') { playerHp -= Math.max(1, m.atk - playerDef); updatePlayerUI(); }
                        else { target.ref.hp -= m.atk; target.ref.querySelector('.hp-bar-fill').style.width = (target.ref.hp / target.ref.hpMax * 100) + "%";
                            if (target.ref.hp <= 0) { target.ref.remove(); guardians.splice(guardians.indexOf(target.ref), 1); updateStats(); }
                        }
                        m.lastAttack = now;
                    }
                } else if (m.isCharging) {
                    // 6시 방향 외곽(r:10, c:5) 찍고 입성
                    let targetR = 10, targetC = 5;
                    if (!m.reachedGate && Math.abs(m.r - 10) < 0.2 && Math.abs(m.c - 5) < 0.2) m.reachedGate = true;
                    if (m.reachedGate) { targetR = 5; targetC = 5; } // 중앙 입성
                    if (m.reachedGate && Math.abs(m.r - 5) < 0.2 && Math.abs(m.c - 5) < 0.2) {
                        villageHp -= (m.innerHTML === '👹' ? 50 : 10);
                        m.remove(); monsters.splice(idx, 1);
                        if(villageHp <= 0) { alert("VILLAGE DESTROYED!"); location.reload(); }
                        return;
                    }
                    if (m.r < targetR) m.r += 0.08; else if (m.r > targetR) m.r -= 0.08;
                    if (m.c < targetC) m.c += 0.08; else if (m.c > targetC) m.c -= 0.08;
                } else {
                    if(m.r <= 0.1 && m.c < 10) m.c += 0.08; else if(m.c >= 9.9 && m.r < 10) m.r += 0.08;
                    else if(m.r >= 9.9 && m.c > 0.1) m.c -= 0.08; else if(m.c <= 0.1 && m.r > 0) m.r -= 0.08;
                }
                m.style.top = (m.r * 9.09) + '%'; m.style.left = (m.c * 9.09) + '%';
            });

            // 공격 로직
            [...guardians, {unitR: playerPos.r, unitC: playerPos.c, atk: Math.floor(25 + user_str/4), lastShot: playerLastShot, isPlayer: true}].forEach(u => {
                const cooldown = u.isPlayer ? playerAtkSpeed : 1000;
                const range = u.isPlayer ? 2 : (u.atk > 40 ? 4 : 2);
                const lastTime = u.isPlayer ? playerLastShot : u.lastShot;
                if (now - lastTime > cooldown) {
                    const target = monsters.find(m => Math.abs(u.unitR-m.r) <= range && Math.abs(u.unitC-m.c) <= range);
                    if (target) { fire(u.unitR, u.unitC, target, u.isPlayer ? '#fbbf24' : '#38bdf8', u.atk);
                        if(u.isPlayer) playerLastShot = now; else u.lastShot = now;
                    }
                }
            });

            if (playerHp <= 0) { alert("HERO DEFEATED!"); location.reload(); }
            if(isWaveActive && monsters.length === 0 && waveTimer < 25) {
                isWaveActive = false; clearInterval(timerInterval);
                document.getElementById('timer-fill').style.width = "100%";
                document.getElementById('start-btn').classList.remove('opacity-50');
                if(currentRound >= 20) { alert("VICTORY!"); location.href='index.html'; }
                else { currentRound++; document.getElementById('round-text').innerText = `ROUND ${currentRound}/20`; dCoin += 200; updateStats(); }
            }
            requestAnimationFrame(gameLoop);
        }

        function fire(sr, sc, target, color, dmg) {
            const p = document.createElement('div');
            p.className = 'projectile'; p.style.backgroundColor = color;
            p.style.top = (sr * 9.09 + 4) + '%'; p.style.left = (sc * 9.09 + 4) + '%';
            document.getElementById('map-container').appendChild(p);
            
            // 데미지 팝업
            const d = document.createElement('div');
            d.className = 'dmg-text'; d.innerText = dmg;
            d.style.top = (target.r * 9.09) + '%'; d.style.left = (target.c * 9.09) + '%';
            document.getElementById('map-container').appendChild(d);
            setTimeout(() => d.remove(), 600);

            p.animate([{top: p.style.top, left: p.style.left}, {top: (target.r*9.09+4)+'%', left: (target.c*9.09+4)+'%'}], 150).onfinish = () => {
                p.remove();
                if (monsters.includes(target)) {
                    target.hp -= dmg;
                    const fill = target.querySelector('.hp-bar-fill');
                    if(fill) fill.style.width = (target.hp/target.maxHp*100) + "%";
                    if(target.hp <= 0) { monsters.splice(monsters.indexOf(target), 1); target.remove(); dCoin += 40; updateStats(); }
                }
            };
        }
        gameLoop();
    </script>
</body>
</html>
