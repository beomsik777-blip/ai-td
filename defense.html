<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Ultimate Gate Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; display: flex; flex-direction: column; }
        
        /* 🗺️ 맵 컨테이너: 뒤틀림 방지를 위해 정방형 비율 유지 */
        #map-container {
            width: 92vw; height: 92vw; max-width: 460px; max-height: 460px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 5px auto;
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); position: relative; z-index: 1; }
        .grid-cell.selected { background: rgba(251, 146, 60, 0.25); box-shadow: inset 0 0 8px #fb923c; }
        
        /* 🧱 성벽 위치 고정 */
        .wall-cell { background: #1e293b; border: 1px solid #475569; z-index: 2; position: relative; }
        .wall-cell::after { content: '🧱'; position: absolute; font-size: 8px; opacity: 0.4; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .range-highlight { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; z-index: 5; }

        #village { position: absolute; top: 36.36%; left: 36.36%; width: 27.27%; height: 27.27%; background: #0f172a; border: 2px solid #38bdf8; z-index: 10; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        #south-gate { position: absolute; bottom: 9.09%; left: 45.45%; width: 9.09%; height: 9.09%; background: #451a03; border: 2px solid #f59e0b; z-index: 20; display: flex; align-items: center; justify-content: center; }
        
        .unit { position: absolute; width: 9.09%; height: 9.09%; z-index: 100; display: flex; align-items: center; justify-content: center; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.2s; pointer-events: none; }
        .unit-click-area { position: absolute; width: 9.09%; height: 9.09%; z-index: 110; cursor: pointer; }
        .unit.wait { filter: grayscale(1); opacity: 0.6; }
        
        .monster { position: absolute; width: 9.09%; height: 9.09%; z-index: 50; display: flex; align-items: center; justify-content: center; font-size: 22px; pointer-events: none; }
        
        .hp-bar-bg { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; border-radius: 1px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: bold; font-size: 11px; z-index: 200; pointer-events: none; animation: popUp 0.6s forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }
        
        /* ✨ 레벨업 시각 효과 */
        .lv-up-fx { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 300; }
        .flash { animation: flashAnim 0.5s ease-out; }
        @keyframes flashAnim { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; flex-shrink: 0; }
        .ctrl-btn { background: #1e293b; color: white; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #000; font-weight: bold; }
        .ctrl-btn:active { border-bottom: 0; transform: translateY(2px); }
        
        #unit-control-panel { position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.98); border: 2px solid #fb923c; padding: 12px; border-radius: 12px; z-index: 250; display: none; min-width: 200px; box-shadow: 0 0 25px #000; }
        .info-tab { position: absolute; top: 45px; left: 5px; background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; padding: 5px; border-radius: 4px; font-size: 7.5px; z-index: 70; }
    </style>
</head>
<body>

    <audio id="audio-bgm" loop></audio>
    <div id="lv-up-flash" class="lv-up-fx"></div>

    <header class="p-2 bg-slate-900 flex justify-between items-center border-b border-slate-700 shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold uppercase">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <div class="flex justify-between items-center mb-0.5">
                <span id="round-text" class="text-blue-400 text-[9px] font-bold">ROUND 1/20</span>
                <span id="level-display" class="text-purple-400 text-[9px] font-bold uppercase">LV. 1</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-1"><div id="village-hp-bar" class="bg-emerald-500 h-full w-full transition-all"></div></div>
            <div class="w-full bg-slate-800 h-0.5 rounded-full overflow-hidden"><div id="exp-fill" class="bg-purple-600 h-full w-0 transition-all"></div></div>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-[11px] font-bold text-yellow-400">300 G</p>
            <p id="monster-count" class="text-[8px] text-red-400 font-bold uppercase">Enemies: 0</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div class="info-tab">
            <p class="text-blue-300 font-bold mb-1 underline">UNIT ABILITY</p>
            <p>🛡️ Knight: Balanced</p>
            <p>🏹 Archer: Fast Atk</p>
            <p>🧙 Mage: Area Attack</p>
            <p class="mt-1 text-emerald-400">Mana Recovery: <span id="regen-val">0.1</span>/s</p>
        </div>

        <div id="unit-control-panel">
            <p id="ui-name" class="text-sm font-bold text-white mb-1 uppercase">Unit Name</p>
            <p id="ui-lv" class="text-[10px] text-orange-400 mb-3 font-bold">Level 1</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="upgradeUnit()" class="py-2 bg-emerald-700 rounded text-[10px] font-bold uppercase">Upgrade</button>
                <button onclick="startMoveMode()" class="py-2 bg-blue-700 rounded text-[10px] font-bold uppercase">Move Unit</button>
                <button onclick="closeUnitPanel()" class="col-span-2 py-1 bg-slate-700 rounded text-[10px] font-bold uppercase mt-1">Close</button>
            </div>
        </div>

        <div id="map-container">
            <script>
                const map = document.getElementById('map-container');
                for(let i=0; i<121; i++) {
                    const r = Math.floor(i/11), c = i%11;
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    if((r === 1 || r === 9 || c === 1 || c === 9) && !(r===0||r===10||c===0||c===10)) cell.classList.add('wall-cell');
                    cell.id = `grid-${r}-${c}`;
                    cell.onclick = () => onCellClick(r, c);
                    map.appendChild(cell);
                }
            </script>
            <div id="timer-text">00:30</div>
            <div id="village">🏰</div>
            <div id="south-gate"><div id="gate-hp-container" class="absolute top-[-5px] w-full h-1 bg-red-900"><div id="gate-hp-fill" class="bg-yellow-500 w-full h-full"></div></div></div>
            <div id="player" class="unit">
                <div id="start-label" class="start-hint">TAP HERO TO START</div>
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div id="hero-click-area" class="unit-click-area" onclick="onHeroClick()"></div>
            <div id="unit-layer"></div>
        </div>
    </main>

    <div class="ui-panel">
        <div class="flex justify-between items-center gap-2 mb-2">
            <button id="install-btn" onclick="installGuardian()" class="flex-1 py-3 bg-orange-600 rounded font-bold text-[11px] uppercase hidden shadow-lg">Install Unit (150G)</button>
            <button id="start-btn" onclick="startWave()" class="flex-1 py-3 bg-blue-600 rounded font-bold text-[11px] uppercase opacity-50 pointer-events-none">Start Wave</button>
            <div class="flex flex-col flex-1 gap-1 items-center">
                <p id="mana-display" class="text-[9px] text-blue-400 font-bold uppercase">Mana: 0/10</p>
                <button onclick="castMagic()" class="w-full py-2 bg-indigo-600 rounded text-[8px] font-bold uppercase leading-none">ASPD Burst</button>
            </div>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="moveHero(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="moveHero(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="moveHero(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="moveHero(0, 1)">▶</button>
            </div>
            <div class="bg-slate-900/80 p-2 rounded border border-slate-700 flex-1 ml-4 grid grid-cols-2 gap-1 text-center">
                <div><p class="text-[6px] text-slate-500 uppercase">Hero HP</p><p id="hero-hp-val" class="text-[9px] text-emerald-400 font-bold">100/100</p></div>
                <div><p class="text-[6px] text-slate-500 uppercase">ASPD</p><p id="hero-speed-val" class="text-[9px] text-blue-400 font-bold">1.7/s</p></div>
                <div class="col-span-2 border-t border-slate-800 pt-1 text-[10px] font-bold text-orange-400 uppercase tracking-widest">ATK: <span id="hero-atk">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const audioBgm = document.getElementById('audio-bgm');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let gameStarted = false, isWaveActive = false, waveTimer = 30;
        let dCoin = 300, currentRound = 1, dLevel = 1, dExp = 0, dExpNext = 100;
        let villageHp = 100, gateHp = 500, gateHpMax = 500;
        let playerPos = { r: 8, c: 5 }, guardians = [], monsters = [];
        let selectedGrid = null, activeUnit = null, isMoveMode = false;

        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let weekly = JSON.parse(localStorage.getItem('weekly_workout_data')) || { totalHpBonus: 0, totalDef: 0 };
        let playerHpMax = 100 + (weekly.totalHpBonus || 0);
        let playerHp = playerHpMax, playerDef = (weekly.totalDef || 0);
        let playerAtkSpeed = 600, manaMax = 10 + user_int, currentMana = 0;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            document.getElementById('player').style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            updatePlayerUI(); updateStats();
            setInterval(() => { if(gameStarted) { currentMana = Math.min(manaMax, currentMana + 0.1 * (1 + user_int/10)); updateStats(); } }, 1000);
        };

        function playHitSound() {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square'; osc.frequency.setValueAtTime(150 + Math.random()*100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function onHeroClick() {
            if (!gameStarted) {
                gameStarted = true; audioCtx.resume();
                document.getElementById('start-label').style.display = 'none';
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                audioBgm.src = 'music/townbgm.mp3'; audioBgm.play();
                updateStats();
            } else { showRange(playerPos.r, playerPos.c, 2); }
        }

        function onCellClick(r, c) {
            if (!gameStarted) return;
            // 몬스터 경로 및 성벽 체크
            if (r===0 || r===10 || c===0 || c===10) {
                if(!isMoveMode) { alert("몬스터 이동 경로는 선택할 수 없습니다."); return; }
            }
            if ((r===1 || r===9 || c===1 || c===9)) { alert("성벽 지역입니다."); return; }
            if (r >= 4 && r <= 6 && c >= 4 && c <= 6) { alert("중앙 마을 내부입니다."); return; }

            // 이동 모드
            if (isMoveMode && activeUnit) {
                activeUnit.r = r; activeUnit.c = c;
                activeUnit.el.style.top = (r*9.09)+'%'; activeUnit.el.style.left = (c*9.09)+'%';
                activeUnit.wait = 10; activeUnit.el.classList.add('wait');
                isMoveMode = false; closeUnitPanel(); return;
            }

            // 유닛 선택 혹은 설치 준비
            const existing = guardians.find(g => g.r === r && g.c === c);
            if (existing) {
                openUnitPanel(existing);
            } else {
                if(selectedGrid) document.getElementById(`grid-${selectedGrid.r}-${selectedGrid.c}`).classList.remove('selected');
                selectedGrid = {r, c};
                document.getElementById(`grid-${r}-${c}`).classList.add('selected');
                document.getElementById('install-btn').classList.remove('hidden');
            }
        }

        function installGuardian() {
            const maxU = Math.floor(user_int/5) + 1;
            if (guardians.length >= maxU) { alert("유닛 한도 초과!"); return; }
            if (dCoin < 150) { alert("코인이 부족합니다!"); return; }
            
            dCoin -= 150;
            const rand = Math.random();
            const type = rand < 0.05 ? "Dragon" : rand < 0.2 ? "Mage" : rand < 0.45 ? "Archer" : "Knight";
            const g = { r: selectedGrid.r, c: selectedGrid.c, lv: 1, type, lastShot: 0, wait: 0 };
            g.atk = type==="Dragon"?100 : type==="Archer"?35 : 25;
            g.range = type==="Archer"?4 : type==="Mage"?3 : 2;
            g.cd = type==="Archer"?500 : 1200;
            
            const el = document.createElement('div');
            el.className = 'unit guardian';
            el.innerHTML = type==="Dragon"?'🐉' : type==="Mage"?'🧙' : type==="Archer"?'🏹' : '🛡️';
            el.style.top = (g.r*9.09)+'%'; el.style.left = (g.c*9.09)+'%';
            
            const area = document.createElement('div');
            area.className = 'unit-click-area';
            area.style.top = (g.r*9.09)+'%'; area.style.left = (g.c*9.09)+'%';
            area.onclick = (e) => { e.stopPropagation(); openUnitPanel(g); };
            
            const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
            const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill w-full';
            hpBg.appendChild(hpFill); el.appendChild(hpBg);
            
            document.getElementById('unit-layer').appendChild(el);
            document.getElementById('unit-layer').appendChild(area);
            g.el = el; g.area = area; g.hpFill = hpFill; guardians.push(g);
            
            document.getElementById(`grid-${selectedGrid.r}-${selectedGrid.c}`).classList.remove('selected');
            document.getElementById('install-btn').classList.add('hidden');
            selectedGrid = null; updateStats();
        }

        function openUnitPanel(g) {
            activeUnit = g;
            document.getElementById('unit-control-panel').style.display = 'block';
            document.getElementById('ui-name').innerText = g.type;
            document.getElementById('ui-lv').innerText = `Level ${g.lv} (Atk: ${g.atk})`;
            showRange(g.r, g.c, g.range);
        }

        function upgradeUnit() {
            const cost = activeUnit.lv * 100;
            if(dCoin < cost) return;
            dCoin -= cost; activeUnit.lv++; activeUnit.atk += 15;
            updateStats(); openUnitPanel(activeUnit);
        }

        function startMoveMode() { isMoveMode = true; alert("이동할 빈 칸을 선택하세요."); }
        function closeUnitPanel() { document.getElementById('unit-control-panel').style.display='none'; clearRange(); }

        function moveHero(dr, dc) {
            if (!gameStarted) return;
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 11 && nc >= 0 && nc < 11) {
                if (nr >= 4 && nr <= 6 && nc >= 4 && nc <= 6) return;
                const targetCell = document.getElementById(`grid-${nr}-${nc}`);
                if (targetCell.classList.contains('wall-cell') && !(nr === 8 && nc === 5)) return;
                playerPos.r = nr; playerPos.c = nc; updatePlayerUI();
            }
        }

        function updatePlayerUI() {
            const p = document.getElementById('player');
            const a = document.getElementById('hero-click-area');
            p.style.top = (playerPos.r * 9.09) + '%'; p.style.left = (playerPos.c * 9.09) + '%';
            a.style.top = (playerPos.r * 9.09) + '%'; a.style.left = (playerPos.c * 9.09) + '%';
            document.getElementById('player-hp-fill').style.width = (playerHp/playerHpMax*100) + "%";
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)}/${playerHpMax}`;
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true; waveTimer = 30; gateHp = gateHpMax + (currentRound*100);
            document.getElementById('gate-hp-fill').style.width = "100%";
            document.getElementById('start-btn').classList.add('opacity-50', 'pointer-events-none');
            audioBgm.src = (currentRound % 5 === 0) ? 'music/bossbgm.mp3' : 'music/defensebgm.mp3'; audioBgm.play();
            
            let count = (currentRound % 5 === 0) ? 1 : 5 + currentRound;
            const spawnInterval = setInterval(() => {
                if(count-- <= 0) { clearInterval(spawnInterval); return; }
                const m = { r:0, c:0, hp:(currentRound%5===0?5000:300)+(currentRound*150), isCharging:false, lastAtk:0 };
                const pos = Math.random();
                if(pos<0.25) { m.r=0; m.c=Math.floor(Math.random()*11); }
                else if(pos<0.5) { m.r=10; m.c=Math.floor(Math.random()*11); }
                else if(pos<0.75) { m.c=0; m.r=Math.floor(Math.random()*11); }
                else { m.c=10; m.r=Math.floor(Math.random()*11); }
                m.maxHp = m.hp; m.atk = 20 + currentRound*5;
                m.offX = (Math.random()-0.5)*3; m.offY = (Math.random()-0.5)*3;
                const el = document.createElement('div'); el.className='monster'; el.innerHTML=(currentRound%5===0)?'👹':'👾';
                const mb = document.createElement('div'); mb.className='hp-bar-bg'; const mf=document.createElement('div'); mf.className='hp-bar-fill w-full';
                mb.appendChild(mf); el.appendChild(mb); document.getElementById('map-container').appendChild(el);
                m.el = el; m.mf = mf; monsters.push(m);
                document.getElementById('monster-count').innerText = `Enemies: ${monsters.length}`;
            }, 1000);

            timerInterval = setInterval(() => {
                waveTimer--; document.getElementById('timer-text').innerText = `00:${waveTimer<10?'0'+waveTimer:waveTimer}`;
                if(waveTimer <= 0) { clearInterval(timerInterval); monsters.forEach(m => m.isCharging = true); }
            }, 1000);
        }

        function gameLoop() {
            const now = Date.now();
            monsters.forEach((m, idx) => {
                if (m.isCharging) {
                    let tr = gateHp > 0 ? 10 : 5, tc = 5;
                    const step = 0.04;
                    // 최외곽 라인(0 or 10)에서 성문 통로(10,5)로 먼저 이동
                    if (Math.abs(m.c - 5) > 0.1 && m.r > 8.5) {
                        if (m.c < 5) m.c += step; else m.c -= step;
                    } else {
                        if (m.r < tr) m.r += step; else if (m.r > tr) m.r -= step;
                        if (m.c < tc) m.c += step; else if (m.c > tc) m.c -= step;
                    }
                    
                    if (gateHp > 0 && Math.hypot(m.r-10, m.c-5) < 0.3) {
                        if(now - m.lastAtk > 1500) { gateHp -= m.atk; m.lastAtk = now; 
                            document.getElementById('gate-hp-fill').style.width = (gateHp/(gateHpMax+currentRound*100)*100)+'%';
                            if(gateHp<=0) document.getElementById('south-gate').style.opacity='0.2';
                        }
                    } else if (gateHp <= 0 && Math.hypot(m.r-5, m.c-5) < 0.2) {
                        villageHp -= 10; document.getElementById('village-hp-bar').style.width = villageHp+'%';
                        m.el.remove(); monsters.splice(idx, 1);
                        if(villageHp <= 0) { alert("VILLAGE DESTROYED"); location.reload(); }
                    }
                } else {
                    const step = 0.06;
                    if(Math.abs(m.r) <= 0.1 && m.c < 10) m.c += step; else if(Math.abs(m.c - 10) <= 0.1 && m.r < 10) m.r += step;
                    else if(Math.abs(m.r - 10) <= 0.1 && m.c > 0.1) m.c -= step; else if(Math.abs(m.c) <= 0.1 && m.r > 0.1) m.r -= step;
                }
                m.el.style.top = (m.r * 9.09 + m.offY) + '%'; m.el.style.left = (m.c * 9.09 + m.offX) + '%';
            });

            // 공격 감지
            [...guardians, {r:playerPos.r, c:playerPos.c, atk:Math.floor(25+user_str/4+(dLevel-1)*15), isP:true}].forEach(u => {
                if(u.wait > 0) { u.wait -= 0.016; if(u.wait<=0) u.el.classList.remove('wait'); return; }
                const cd = u.isP ? playerAtkSpeed : u.cd;
                const lt = u.isP ? playerLastShot : u.lShot;
                if (now - (lt||0) > cd) {
                    const t = monsters.find(m => Math.hypot(u.r - m.r, u.c - m.c) <= (u.isP?2.8 : u.range));
                    if(t) { fire(u.r, u.c, t, u.isP?'#fbbf24':'#38bdf8', u.atk); if(u.isP) playerLastShot=now; else u.lShot=now; }
                }
            });

            if(isWaveActive && monsters.length === 0 && waveTimer < 20) {
                isWaveActive = false; currentRound++; 
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                audioBgm.src = 'music/townbgm.mp3'; audioBgm.play(); updateStats();
            }
            requestAnimationFrame(gameLoop);
        }

        function fire(sr, sc, t, color, dmg) {
            playHitSound();
            const p = document.createElement('div'); p.className = 'projectile'; p.style.backgroundColor = color;
            p.style.top = (sr*9.09+4)+'%'; p.style.left = (sc*9.09+4)+'%';
            document.getElementById('map-container').appendChild(p);
            p.animate([{top:p.style.top, left:p.style.left},{top:(t.r*9.09+4)+'%', left:(t.c*9.09+4)+'%'}], 120).onfinish = () => {
                p.remove(); t.hp -= dmg; t.mf.style.width = (t.hp/t.maxHp*100)+'%';
                const d = document.createElement('div'); d.className='dmg-text'; d.innerText=dmg; d.style.top=(t.r*9.09)+'%'; d.style.left=(t.c*9.09)+'%';
                document.getElementById('map-container').appendChild(d); setTimeout(()=>d.remove(), 400);
                if(t.hp<=0 && monsters.includes(t)) { monsters.splice(monsters.indexOf(t),1); t.el.remove(); dCoin+=45; dExp+=25; checkLvUp(); updateStats(); }
            };
        }

        function checkLvUp() {
            if(dExp >= dExpNext){
                dLevel++; dExp=0; dExpNext=Math.floor(dExpNext*1.5); 
                document.getElementById('lv-up-flash').classList.add('flash');
                setTimeout(()=>document.getElementById('lv-up-flash').classList.remove('flash'), 500);
            }
        }
        function updateStats() {
            document.getElementById('hero-atk').innerText = Math.floor(25 + user_str/4 + (dLevel-1)*15);
            document.getElementById('mana-display').innerText = `Mana: ${Math.floor(currentMana)}/${manaMax}`;
            document.getElementById('level-display').innerText = `LV. ${dLevel}`;
            document.getElementById('d-coin').innerText = dCoin + " G";
            document.getElementById('exp-fill').style.width = (dExp/dExpNext*100)+'%';
            document.getElementById('regen-val').innerText = (0.1 * (1 + user_int/10)).toFixed(1);
        }
        function showRange(r, c, rg) { clearRange(); for(let i=r-rg; i<=r+rg; i++) for(let j=c-rg; j<=c+rg; j++) { const cell = document.getElementById(`grid-${i}-${j}`); if(cell) cell.classList.add('range-highlight'); } }
        function clearRange() { document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('range-highlight')); }
        function castMagic() { if(currentMana>=5){currentMana-=5; playerAtkSpeed=300; setTimeout(()=>playerAtkSpeed=600, 5000);} }
        gameLoop();
    </script>
</body>
</html>
