<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Strategic Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        /* 🗺️ 격자 맵 스타일 */
        .grid-map { 
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            width: 100vw; height: 100vw; max-width: 500px; max-height: 500px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: auto;
        }
        .grid-cell { border: 0.5px solid rgba(56, 189, 248, 0.1); display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .grid-cell.active { background: rgba(56, 189, 248, 0.05); }

        /* 🏰 중앙 기지 */
        #base { grid-column: 5 / 7; grid-row: 5 / 7; background: #1e293b; border: 2px solid #38bdf8; z-index: 10; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 0 20px #38bdf8; }

        /* 🗼 타워 & 몬스터 */
        .tower { font-size: 1.2rem; z-index: 20; position: absolute; }
        .monster { position: absolute; width: 24px; height: 24px; z-index: 30; transition: all 0.2s linear; display: flex; align-items: center; justify-content: center; }
        .boss { width: 40px; height: 40px; font-size: 1.5rem; z-index: 31; }

        /* 💰 하단 UI 박스 */
        .ui-panel { background: rgba(15, 23, 42, 0.95); border-top: 2px solid #334155; padding: 15px; }
        .tower-btn { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 5px; text-align: center; }
        .tower-btn.selected { border-color: #38bdf8; box-shadow: 0 0 10px #38bdf8; background: #0f172a; }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-3 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold">◀ EXIT</button>
        <div class="text-center">
            <span id="round-display" class="text-blue-400 text-xs font-bold">ROUND 1/10</span>
            <div class="w-24 bg-slate-800 h-1 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="hp-bar" class="bg-emerald-500 h-full w-full transition-all"></div>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[8px] text-yellow-400 font-bold">D-COIN</p>
            <p id="d-coin" class="text-xs font-bold text-yellow-400">150</p>
        </div>
    </header>

    <div class="flex-1 flex items-center justify-center bg-black overflow-hidden">
        <div id="map" class="grid-map">
            <div id="base">🏰</div>
            </div>
    </div>

    <div class="ui-panel shrink-0">
        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="selectTower('arrow', 50)" id="btn-arrow" class="tower-btn">
                <span class="text-lg">🏹</span><p class="text-[7px] mt-1">Arrow (50)</p>
            </button>
            <button onclick="selectTower('magic', 80)" id="btn-magic" class="tower-btn">
                <span class="text-lg">⚡</span><p class="text-[7px] mt-1">Magic (80)</p>
            </button>
            <button onclick="selectTower('cannon', 120)" id="btn-cannon" class="tower-btn">
                <span class="text-lg">💣</span><p class="text-[7px] mt-1">Cannon (120)</p>
            </button>
            <button onclick="selectTower('slow', 100)" id="btn-slow" class="tower-btn">
                <span class="text-lg">❄️</span><p class="text-[7px] mt-1">Slow (100)</p>
            </button>
        </div>
        
        <div class="flex justify-between items-center text-[9px] text-slate-400">
            <p>STR Buff: <span id="str-bonus" class="text-orange-400">+0%</span></p>
            <button onclick="startWave()" id="start-btn" class="px-6 py-2 bg-blue-600 text-white rounded font-bold text-xs active:scale-95">START ROUND</button>
            <p>INT Buff: <span id="int-bonus" class="text-blue-400">+0%</span></p>
        </div>
    </div>

    <script>
        // 기초 데이터
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let dCoin = 150;
        let villageHp = 100;
        let currentRound = 1;
        let selectedTowerType = null;
        let selectedTowerCost = 0;
        let isWaveActive = false;

        const map = document.getElementById('map');
        const towers = [];
        const monsters = [];

        // 1. 맵 격자 생성 (10x10)
        function createGrid() {
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;
                const r = Math.floor(i / 10);
                const c = i % 10;
                
                // 기지 영역 제외 (4,4 ~ 5,5)
                if ((r >= 4 && r <= 5) && (c >= 4 && c <= 5)) {
                    cell.classList.add('pointer-events-none');
                } else {
                    cell.onclick = () => placeTower(cell, r, c);
                }
                map.appendChild(cell);
            }
        }

        // 2. 타워 선택
        function selectTower(type, cost) {
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            if (selectedTowerType === type) {
                selectedTowerType = null;
            } else {
                selectedTowerType = type;
                selectedTowerCost = cost;
                document.getElementById('btn-' + type).classList.add('selected');
            }
        }

        // 3. 타워 배치
        function placeTower(cell, r, c) {
            if (!selectedTowerType || cell.innerHTML !== "" || dCoin < selectedTowerCost) return;

            dCoin -= selectedTowerCost;
            document.getElementById('d-coin').innerText = dCoin;
            
            const towerIcons = { arrow: '🏹', magic: '⚡', cannon: '💣', slow: '❄️' };
            cell.innerHTML = `<span class="tower">${towerIcons[selectedTowerType]}</span>`;
            
            towers.push({
                r, c,
                type: selectedTowerType,
                range: selectedTowerType === 'cannon' ? 3 : 2,
                damage: (selectedTowerType === 'arrow' ? 10 : 20) * (1 + user_str / 100),
                cooldown: selectedTowerType === 'magic' ? 500 : 1000,
                lastShot: 0
            });
            
            selectedTowerType = null;
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
        }

        // 4. 웨이브 시작
        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "DEFENDING...";

            let spawnCount = currentRound * 5;
            if (currentRound === 5 || currentRound === 10) spawnCount = 1; // 보스전

            const spawnInterval = setInterval(() => {
                if (spawnCount <= 0) {
                    clearInterval(spawnInterval);
                    checkWaveEnd();
                    return;
                }
                spawnMonster(currentRound === 5 || currentRound === 10);
                spawnCount--;
            }, 1000);
        }

        function spawnMonster(isBoss) {
            const m = document.createElement('div');
            m.className = `monster ${isBoss ? 'boss' : ''}`;
            const sides = [
                { r: 0, c: 5 }, // 북
                { r: 9, c: 5 }, // 남
                { r: 5, c: 0 }, // 서
                { r: 5, c: 9 }  // 동
            ];
            const start = sides[Math.floor(Math.random() * 4)];
            m.r = start.r; m.c = start.c;
            m.hp = (isBoss ? 500 : 30) * (1 + currentRound * 0.2);
            m.innerHTML = isBoss ? '👹' : '👾';
            map.appendChild(m);
            monsters.push(m);
            updateMonsterPos(m);
        }

        function updateMonsterPos(m) {
            m.style.top = (m.r * 10) + '%';
            m.style.left = (m.c * 10) + '%';
        }

        // 5. 게임 엔진 (100ms 마다 실행)
        setInterval(() => {
            if (!isWaveActive) return;

            // 타워 공격
            towers.forEach(t => {
                const now = Date.now();
                if (now - t.lastShot < t.cooldown) return;

                const target = monsters.find(m => {
                    const dist = Math.abs(t.r - m.r) + Math.abs(t.c - m.c);
                    return dist <= t.range;
                });

                if (target) {
                    target.hp -= t.damage;
                    t.lastShot = now;
                    if (target.hp <= 0) {
                        target.remove();
                        monsters.splice(monsters.indexOf(target), 1);
                        dCoin += 10;
                        document.getElementById('d-coin').innerText = dCoin;
                    }
                }
            });

            // 몬스터 이동
            monsters.forEach(m => {
                if (m.r < 4.5) m.r += 0.1;
                else if (m.r > 5.5) m.r -= 0.1;
                if (m.c < 4.5) m.c += 0.1;
                else if (m.c > 5.5) m.c -= 0.1;

                updateMonsterPos(m);

                // 기지 충돌
                if (Math.abs(m.r - 5) < 0.5 && Math.abs(m.c - 5) < 0.5) {
                    villageHp -= (m.classList.contains('boss') ? 50 : 10);
                    document.getElementById('hp-bar').style.width = villageHp + '%';
                    m.remove();
                    monsters.splice(monsters.indexOf(m), 1);
                    if (villageHp <= 0) {
                        alert("마을이 함락되었습니다!");
                        location.reload();
                    }
                }
            });

            if (monsters.length === 0 && isWaveActive) {
                checkWaveEnd();
            }
        }, 100);

        function checkWaveEnd() {
            if (monsters.length === 0) {
                isWaveActive = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "NEXT ROUND";
                currentRound++;
                if (currentRound > 10) {
                    alert("축하합니다! 모든 웨이브를 방어했습니다!");
                    location.href = 'index.html';
                }
                document.getElementById('round-display').innerText = `ROUND ${currentRound}/10`;
            }
        }

        createGrid();
        document.getElementById('str-bonus').innerText = `+${user_str}%`;
        document.getElementById('int-bonus').innerText = `+${user_int}%`;
    </script>
</body>
</html>
