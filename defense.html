<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Ultimate Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        .grid-map { 
            display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(20, 1fr);
            width: 95vw; height: 95vw; max-width: 550px; max-height: 550px;
            background: #0f172a; border: 2px solid #334155; position: relative; margin: 5px auto;
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); position: relative; }

        #base { position: absolute; top: 45%; left: 45%; width: 10%; height: 10%; background: #1e293b; border: 2px solid #38bdf8; z-index: 10; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

        #player { position: absolute; width: 5%; height: 5%; z-index: 100; background-size: contain; background-repeat: no-repeat; transition: all 0.2s ease-out; cursor: pointer; }
        #player.active { filter: drop-shadow(0 0 10px #38bdf8); outline: 2px solid #38bdf8; border-radius: 50%; }

        /* ⚔️ 범위 시각화 */
        .range-circle { position: absolute; border: 1px dashed rgba(56, 189, 248, 0.4); border-radius: 50%; background: rgba(56, 189, 248, 0.05); pointer-events: none; z-index: 5; transform: translate(-50%, -50%); display: none; }
        #p-range-circle { border-color: #fbbf24; background: rgba(251, 191, 36, 0.05); z-index: 90; }

        .monster { position: absolute; width: 5%; height: 5%; z-index: 30; transition: all 0.3s linear; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .tower { position: absolute; width: 5%; height: 5%; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(56, 189, 248, 0.15); border-radius: 4px; }
        
        /* 프리뷰 타워 */
        #preview-tower { position: absolute; width: 5%; height: 5%; z-index: 45; display: none; filter: opacity(0.6); pointer-events: none; }

        .laser { position: absolute; background: #38bdf8; z-index: 45; transform-origin: 0 50%; height: 2px; pointer-events: none; }
        
        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; }
        .tower-btn { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 5px; text-align: center; }
        .tower-btn.selected { border-color: #38bdf8; color: #38bdf8; }
        
        .ctrl-btn { background: #1e293b; color: white; width: 40px; height: 35px; border-radius: 8px; font-size: 1rem; }
    </style>
</head>
<body class="flex flex-col">

    <audio id="bgm" loop><source src="music/townbgm.mp3" type="audio/mpeg"></audio>
    <audio id="snd-atk"><source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg"></audio> <audio id="snd-tower"><source src="https://assets.mixkit.co/active_storage/sfx/1653/1653-preview.mp3" type="audio/mpeg"></audio> <header class="p-3 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold">◀ EXIT</button>
        <div class="text-center">
            <span id="round-display" class="text-blue-400 text-[10px] font-bold uppercase">Round 1</span>
            <div class="w-24 bg-slate-800 h-1 mt-1 rounded-full overflow-hidden border border-slate-700">
                <div id="hp-bar" class="bg-emerald-500 h-full w-full"></div>
            </div>
        </div>
        <p id="d-coin" class="text-xs font-bold text-yellow-400">200 DG</p>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black">
        <div id="map" class="grid-map" onclick="handleMapClick(event)">
            <div id="base">🏰</div>
            <div id="p-range-circle" class="range-circle"></div>
            <div id="preview-range" class="range-circle" style="border-color: #38bdf8;"></div>
            <div id="preview-tower"></div>
            <div id="player" onclick="togglePlayer(event)"></div>
        </div>
    </div>

    <div class="ui-panel shrink-0">
        <div class="flex gap-2 mb-2">
            <button onclick="selectTowerType('arrow', 50)" id="btn-arrow" class="tower-btn flex-1 text-[9px]">🏹 Arrow</button>
            <button onclick="selectTowerType('magic', 80)" id="btn-magic" class="tower-btn flex-1 text-[9px]">⚡ Magic</button>
            <button onclick="selectTowerType('cannon', 120)" id="btn-cannon" class="tower-btn flex-1 text-[9px]">💣 Cannon</button>
            <button id="confirm-btn" onclick="confirmBuild()" class="flex-1 bg-emerald-600 rounded text-[9px] font-bold hidden">BUILD (설치)</button>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">▶</button>
            </div>
            
            <button onclick="playerAttack()" class="w-14 h-14 bg-orange-600 rounded-full border-2 border-white font-bold active:scale-90 text-[10px]">ATTACK</button>
            
            <div class="flex flex-col items-end gap-1">
                <button onclick="startWave()" id="start-btn" class="px-4 py-2 bg-blue-600 rounded font-bold text-[10px]">START</button>
                <p class="text-[8px] text-slate-500">STR: <span id="s-val" class="text-orange-400">0</span></p>
            </div>
        </div>
    </div>

    <script>
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let dCoin = 200, villageHp = 100, currentRound = 1;
        let playerPos = { r: 10, c: 7 }, playerActive = false;
        let selectedType = null, pendingBuild = null, towers = [], monsters = [], isWaveActive = false;
        
        const map = document.getElementById('map'), player = document.getElementById('player'), pRange = document.getElementById('p-range-circle');
        const previewTower = document.getElementById('preview-tower'), previewRange = document.getElementById('preview-range');
        const bgm = document.getElementById('bgm'), sndAtk = document.getElementById('snd-atk'), sndTower = document.getElementById('snd-tower');

        const inbody = JSON.parse(localStorage.getItem('user_inbody'));
        if (inbody) player.style.backgroundImage = inbody.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
        else player.style.backgroundImage = "url('image/nocheck.png')";

        window.onload = () => {
            for (let i = 0; i < 400; i++) map.appendChild(document.createElement('div')).className = 'grid-cell';
            updatePlayerUI();
            document.getElementById('s-val').innerText = user_str;
            document.body.onclick = () => { if(bgm.paused) bgm.play(); };
        };

        function togglePlayer(e) {
            e.stopPropagation();
            playerActive = !playerActive;
            player.className = playerActive ? 'active' : '';
            pRange.style.display = playerActive ? 'block' : 'none';
            updatePlayerUI();
        }

        function updatePlayerUI() {
            player.style.top = (playerPos.r * 5) + '%';
            player.style.left = (playerPos.c * 5) + '%';
            const rangeVal = 3 + (user_int / 50);
            pRange.style.width = (rangeVal * 10) + '%';
            pRange.style.height = (rangeVal * 10) + '%';
            pRange.style.top = ((playerPos.r + 0.5) * 5) + '%';
            pRange.style.left = ((playerPos.c + 0.5) * 5) + '%';
        }

        function movePlayer(dr, dc) {
            if (!playerActive) return;
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 20 && nc >= 0 && nc < 20 && !towers.some(t => t.r === nr && t.c === nc)) {
                playerPos.r = nr; playerPos.c = nc;
                updatePlayerUI();
            }
        }

        function selectTowerType(type, cost) {
            selectedType = { type, cost };
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('btn-' + type).classList.add('selected');
        }

        function handleMapClick(e) {
            if (!selectedType) return;
            const rect = map.getBoundingClientRect();
            const c = Math.floor(((e.clientX - rect.left) / rect.width) * 20);
            const r = Math.floor(((e.clientY - rect.top) / rect.height) * 20);
            
            if (towers.some(t => t.r === r && t.c === c) || (r >= 9 && r <= 10 && c >= 9 && c <= 10)) return;

            pendingBuild = { r, c, ...selectedType };
            
            // 프리뷰 업데이트
            previewTower.style.display = 'flex';
            previewTower.innerHTML = pendingBuild.type === 'arrow' ? '🏹' : pendingBuild.type === 'magic' ? '⚡' : '💣';
            previewTower.style.top = (r * 5) + '%';
            previewTower.style.left = (c * 5) + '%';

            previewRange.style.display = 'block';
            const tRange = pendingBuild.type === 'magic' ? 4 : 6;
            previewRange.style.width = (tRange * 10) + '%';
            previewRange.style.height = (tRange * 10) + '%';
            previewRange.style.top = ((r + 0.5) * 5) + '%';
            previewRange.style.left = ((c + 0.5) * 5) + '%';

            document.getElementById('confirm-btn').classList.remove('hidden');
        }

        function confirmBuild() {
            if (!pendingBuild || dCoin < pendingBuild.cost) {
                alert("코인이 부족해!"); return;
            }
            dCoin -= pendingBuild.cost;
            document.getElementById('d-coin').innerText = dCoin + " DG";
            
            const el = document.createElement('div');
            el.className = 'tower'; el.innerHTML = previewTower.innerHTML;
            el.style.top = (pendingBuild.r * 5) + '%'; el.style.left = (pendingBuild.c * 5) + '%';
            
            // 설치된 타워에도 범위 표시 추가용 데이터
            const rangeEl = document.createElement('div');
            rangeEl.className = 'range-circle';
            const tr = pendingBuild.type === 'magic' ? 4 : 6;
            rangeEl.style.width = (tr * 10) + '%'; rangeEl.style.height = (tr * 10) + '%';
            rangeEl.style.top = '50%'; rangeEl.style.left = '50%';
            rangeEl.style.display = 'block';
            el.appendChild(rangeEl);

            map.appendChild(el);
            towers.push({ ...pendingBuild, lastShot: 0, cooldown: pendingBuild.type === 'magic' ? 600 : 1200, range: tr/2 });
            
            cancelBuild();
        }

        function cancelBuild() {
            pendingBuild = null;
            previewTower.style.display = 'none';
            previewRange.style.display = 'none';
            document.getElementById('confirm-btn').classList.add('hidden');
        }

        function playerAttack() {
            if (!playerActive) return;
            sndAtk.currentTime = 0; sndAtk.play();
            const rangeVal = 3 + (user_int / 50);
            monsters.forEach(m => {
                const dist = Math.sqrt(Math.pow(playerPos.r - m.r, 2) + Math.pow(playerPos.c - m.c, 2));
                if (dist <= rangeVal) {
                    m.hp -= (15 + user_str / 5);
                    drawLaser(playerPos.r + 0.5, playerPos.c + 0.5, m.r + 0.5, m.c + 0.5, '#fbbf24');
                }
            });
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            document.getElementById('start-btn').style.display = 'none';
            let count = currentRound * 3 + 2;
            const interval = setInterval(() => {
                if (count-- <= 0) { clearInterval(interval); return; }
                spawnMonster(currentRound % 4);
            }, 800);
        }

        function spawnMonster(dir) {
            const m = document.createElement('div');
            m.className = 'monster'; m.innerHTML = '👾';
            const start = [{r:0,c:10}, {r:10,c:19}, {r:19,c:10}, {r:10,c:0}][dir];
            m.r = start.r; m.c = start.c; m.hp = 30 + (currentRound * 20);
            map.appendChild(m); monsters.push(m);
        }

        function drawLaser(r1, c1, r2, c2, color) {
            const laser = document.createElement('div');
            laser.className = 'laser';
            const x1 = c1 * 5, y1 = r1 * 5, x2 = c2 * 5, y2 = r2 * 5;
            const d = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            laser.style.width = d + '%'; laser.style.left = x1 + '%'; laser.style.top = y1 + '%';
            laser.style.transform = `rotate(${Math.atan2(y2-y1, x2-x1)}rad)`;
            laser.style.backgroundColor = color;
            map.appendChild(laser);
            setTimeout(() => laser.remove(), 100);
        }

        setInterval(() => {
            if (!isWaveActive && monsters.length === 0) return;
            monsters.forEach((m, idx) => {
                let dr = 9.5 - m.r, dc = 9.5 - m.c;
                let nextR = m.r + (dr > 0 ? 0.08 : -0.08);
                let nextC = m.c + (dc > 0 ? 0.08 : -0.08);
                if (towers.some(t => Math.abs(t.r - nextR) < 0.7 && Math.abs(t.c - m.c) < 0.7)) nextR = m.r;
                if (towers.some(t => Math.abs(t.r - m.r) < 0.7 && Math.abs(t.c - nextC) < 0.7)) nextC = m.c;
                m.r = nextR; m.c = nextC;
                m.style.top = (m.r * 5) + '%'; m.style.left = (m.c * 5) + '%';
                if (Math.abs(9.5-m.r) < 0.6 && Math.abs(9.5-m.c) < 0.6) {
                    villageHp -= 10; document.getElementById('hp-bar').style.width = villageHp + '%';
                    m.remove(); monsters.splice(idx, 1);
                    if (villageHp <= 0) { alert("마을이 함락되었습니다!"); location.reload(); }
                }
                if (m.hp <= 0) { m.remove(); monsters.splice(idx, 1); dCoin += 25; document.getElementById('d-coin').innerText = dCoin + " DG"; }
            });
            const now = Date.now();
            towers.forEach(t => {
                if (now - t.lastShot > t.cooldown) {
                    const target = monsters.find(m => Math.sqrt(Math.pow(t.r-m.r,2)+Math.pow(t.c-m.c,2)) < t.range);
                    if (target) {
                        sndTower.currentTime = 0; sndTower.play();
                        target.hp -= (20 + user_str/10); t.lastShot = now;
                        drawLaser(t.r + 0.5, t.c + 0.5, target.r + 0.5, target.c + 0.5, '#38bdf8');
                    }
                }
            });
            if (isWaveActive && monsters.length === 0) { isWaveActive = false; currentRound++; document.getElementById('round-display').innerText = "ROUND " + currentRound; document.getElementById('start-btn').style.display = 'block'; }
        }, 100);
    </script>
</body>
</html>
