<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Circular Village Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        /* 🗺️ 맵 설정: 중앙 집중형 */
        #map-container {
            width: 95vw; height: 95vw; max-width: 500px; max-height: 500px;
            background: radial-gradient(circle, #1e293b 0%, #020617 70%);
            border: 4px solid #334155; position: relative; margin: 10px auto;
            border-radius: 50%; overflow: hidden;
        }

        /* 🏰 중앙 마을 */
        #village {
            position: absolute; top: 50%; left: 50%; width: 25%; height: 25%;
            transform: translate(-50%, -50%); background: #0f172a;
            border: 3px solid #38bdf8; border-radius: 20%; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        /* 🤺 플레이어 및 수호자 */
        .unit { position: absolute; width: 10%; height: 10%; z-index: 100; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.2s; }
        .guardian { z-index: 80; filter: drop-shadow(0 0 5px #38bdf8); }
        .hidden-guardian { filter: drop-shadow(0 0 10px #a855f7) brightness(1.2); }

        /* 👾 몬스터 */
        .monster { position: absolute; width: 8%; height: 8%; z-index: 30; transition: transform 0.1s linear; }
        .hp-bar-bg { width: 100%; height: 4px; background: #450a0a; position: absolute; top: -8px; border-radius: 2px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }

        /* ⏱️ 타이머 바 */
        #timer-container { width: 80%; height: 6px; background: #1e293b; border-radius: 3px; position: absolute; top: 15%; left: 10%; overflow: hidden; border: 1px solid #334155; }
        #timer-fill { height: 100%; background: #ef4444; width: 100%; transition: width 1s linear; }

        .projectile { position: absolute; width: 6px; height: 6px; border-radius: 50%; z-index: 120; pointer-events: none; }
        
        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 15px; }
        .ctrl-btn { background: #1e293b; color: white; width: 45px; height: 45px; border-radius: 10px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #020617; }
        .ctrl-btn:active { border-bottom: 0; transform: translateY(3px); }
    </style>
</head>
<body class="flex flex-col">

    <audio id="bgm" loop><source src="music/townbgm.mp3" type="audio/mpeg"></audio>

    <header class="p-3 bg-slate-900 flex justify-between items-center border-b border-slate-700">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <p id="round-text" class="text-blue-400 text-[10px] font-bold uppercase tracking-widest">ROUND 1/20</p>
            <div class="w-full bg-slate-800 h-2 mt-1 rounded-full overflow-hidden">
                <div id="village-hp-bar" class="bg-emerald-500 h-full w-full transition-all"></div>
            </div>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-xs font-bold text-yellow-400">300 G</p>
            <p id="guardian-count" class="text-[8px] text-purple-400 font-bold uppercase">Guardians: 0</p>
        </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div id="map-container">
            <div id="timer-container"><div id="timer-fill"></div></div>
            
            <div id="village">
                <span class="text-2xl">🏰</span>
                <span class="text-[8px] font-bold text-blue-300 mt-1 uppercase">Village</span>
            </div>

            <div id="player" class="unit"></div>
            
            <div id="guardian-layer"></div>
        </div>
    </div>

    <div class="ui-panel shrink-0 space-y-4">
        <div class="flex justify-between items-center gap-4">
            <button onclick="summonGuardian()" class="flex-1 py-3 bg-purple-900/40 border border-purple-500 rounded-lg text-[10px] font-bold">
                SUMMON GUARDIAN (INT 5)<br><span class="text-[8px] text-purple-300">지능 5당 1명 배치</span>
            </button>
            <button onclick="startWave()" id="start-btn" class="flex-1 py-3 bg-blue-600 rounded-lg font-bold text-xs shadow-lg shadow-blue-900/50">START WAVE</button>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-2">
                <div></div><button class="ctrl-btn" onclick="movePlayer(-5, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="movePlayer(0, -5)">◀</button>
                <button class="ctrl-btn" onclick="movePlayer(5, 0)">▼</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 5)">▶</button>
            </div>
            
            <div class="text-right space-y-1">
                <div class="bg-slate-900 p-2 rounded border border-slate-700">
                    <p class="text-[7px] text-slate-500 uppercase">Combat Power</p>
                    <p id="hero-atk" class="text-xs text-orange-400 font-bold">ATK: 0</p>
                </div>
                <p class="text-[8px] text-slate-600">30s limit! 성문 돌파 방지</p>
            </div>
        </div>
    </div>

    <script>
        // 기초 스탯
        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let villageHp = 100, currentRound = 1, dCoin = 300;
        let isWaveActive = false, waveTimer = 30;
        
        // 유닛 설정
        let playerPos = { x: 50, y: 50 }; // % 기준
        let guardians = [], monsters = [];
        let playerLastShot = 0;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            const playerEl = document.getElementById('player');
            playerEl.style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            
            updatePlayerPos();
            document.getElementById('hero-atk').innerText = `ATK: ${Math.floor(20 + user_str/5)}`;
            document.body.onclick = () => { document.getElementById('bgm').play().catch(e=>{}); };
        };

        function updatePlayerPos() {
            const p = document.getElementById('player');
            p.style.left = (playerPos.x - 5) + '%';
            p.style.top = (playerPos.y - 5) + '%';
        }

        function movePlayer(dx, dy) {
            playerPos.x = Math.max(10, Math.min(90, playerPos.x + dx));
            playerPos.y = Math.max(10, Math.min(90, playerPos.y + dy));
            updatePlayerPos();
        }

        // 🧠 지능 스탯 기반 수호자 소환
        function summonGuardian() {
            const maxGuardians = Math.floor(user_int / 5);
            if (guardians.length >= maxGuardians) {
                alert(`수호자 배치 제한 도달! (지능 5당 1명)\nMax Guardians reached!`);
                return;
            }
            if (dCoin < 100) { alert("코인이 부족합니다! (100G)"); return; }

            dCoin -= 100;
            document.getElementById('d-coin').innerText = `${dCoin} G`;

            const g = document.createElement('div');
            const isHidden = Math.random() < 0.1; // 10% 확률 히든
            g.className = `unit guardian ${isHidden ? 'hidden-guardian' : ''}`;
            g.innerHTML = isHidden ? '🐉' : '⚔️';
            
            // 마을 주변 랜덤 배치
            const angle = Math.random() * Math.PI * 2;
            const dist = 15 + Math.random() * 5;
            const gx = 50 + Math.cos(angle) * dist;
            const gy = 50 + Math.sin(angle) * dist;
            
            g.style.left = (gx - 5) + '%';
            g.style.top = (gy - 5) + '%';
            g.stats = { x: gx, y: gy, atk: isHidden ? 50 : 20, lastShot: 0, range: 25 };
            
            document.getElementById('guardian-layer').appendChild(g);
            guardians.push(g);
            document.getElementById('guardian-count').innerText = `Guardians: ${guardians.length}`;
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            waveTimer = 30;
            document.getElementById('start-btn').style.opacity = "0.5";
            
            const isBoss = currentRound % 5 === 0;
            spawnMonsters(isBoss);
            runTimer();
        }

        function runTimer() {
            const timerFill = document.getElementById('timer-fill');
            const interval = setInterval(() => {
                if (!isWaveActive) { clearInterval(interval); return; }
                waveTimer--;
                timerFill.style.width = (waveTimer / 30 * 100) + "%";
                
                if (waveTimer <= 0) {
                    clearInterval(interval);
                    breakGates();
                }
            }, 1000);
        }

        function spawnMonsters(isBoss) {
            const count = isBoss ? 1 : 5 + currentRound;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    if (!isWaveActive) return;
                    const m = document.createElement('div');
                    m.className = 'monster';
                    m.innerHTML = isBoss ? '👹' : '👾';
                    m.maxHp = (isBoss ? 2000 : 200) + (currentRound * 100);
                    m.hp = m.maxHp;
                    
                    const hpBg = document.createElement('div'); hpBg.className = 'hp-bar-bg';
                    const hpFill = document.createElement('div'); hpFill.className = 'hp-bar-fill';
                    hpBg.appendChild(hpFill); m.appendChild(hpBg);

                    // 원 궤도 초기화
                    m.angle = Math.random() * Math.PI * 2;
                    m.orbit = 40; // 반지름
                    monsters.push(m);
                    document.getElementById('map-container').appendChild(m);
                }, i * 1000);
            }
        }

        // 🚪 성문 돌파: 남은 몬스터들이 마을로 돌진
        function breakGates() {
            if (monsters.length === 0) return;
            alert("성문이 돌파되었습니다! 몬스터들이 습격합니다!");
            monsters.forEach(m => m.orbit = 0); // 궤도를 중심으로 좁힘
        }

        // 게임 루프
        function gameUpdate() {
            if (!isWaveActive && monsters.length === 0) {
                requestAnimationFrame(gameUpdate);
                return;
            }

            const now = Date.now();

            // 몬스터 이동 (빙글빙글 돌기)
            monsters.forEach((m, idx) => {
                if (m.orbit > 12) { // 외곽 궤도 주행
                    m.angle += 0.02;
                } else { // 마을 습격
                    m.orbit = Math.max(0, m.orbit - 0.5);
                    if (m.orbit <= 5) {
                        villageHp -= (m.innerHTML === '👹' ? 50 : 10);
                        document.getElementById('village-hp-bar').style.width = villageHp + "%";
                        m.remove();
                        monsters.splice(idx, 1);
                        if (villageHp <= 0) { alert("마을이 함락되었습니다..."); location.reload(); }
                        return;
                    }
                }
                const mx = 50 + Math.cos(m.angle) * m.orbit;
                const my = 50 + Math.sin(m.angle) * m.orbit;
                m.style.left = (mx - 4) + '%';
                m.style.top = (my - 4) + '%';
                m.currentPos = { x: mx, y: my };
            });

            // 플레이어 공격
            if (now - playerLastShot > 500) {
                const target = monsters[0];
                if (target) {
                    fireProjectile(playerPos.x, playerPos.y, target, '#fbbf24', Math.floor(20 + user_str/5));
                    playerLastShot = now;
                }
            }

            // 수호자 공격
            guardians.forEach(g => {
                if (now - g.stats.lastShot > 1000) {
                    const target = monsters.find(m => {
                        const dist = Math.sqrt(Math.pow(g.stats.x - m.currentPos?.x, 2) + Math.pow(g.stats.y - m.currentPos?.y, 2));
                        return dist < g.stats.range;
                    });
                    if (target) {
                        fireProjectile(g.stats.x, g.stats.y, target, '#38bdf8', g.stats.atk);
                        g.stats.lastShot = now;
                    }
                }
            });

            // 라운드 종료 체크
            if (isWaveActive && monsters.length === 0 && waveTimer > 0) {
                isWaveActive = false;
                if (currentRound >= 20) {
                    alert("20라운드 최종 방어 성공! 당신은 마을의 영웅입니다.");
                    location.href = 'index.html';
                } else {
                    currentRound++;
                    dCoin += 200;
                    document.getElementById('d-coin').innerText = `${dCoin} G`;
                    document.getElementById('round-text').innerText = `ROUND ${currentRound}/20`;
                    document.getElementById('start-btn').style.opacity = "1";
                    document.getElementById('timer-fill').style.width = "100%";
                }
            }

            requestAnimationFrame(gameUpdate);
        }

        function fireProjectile(sx, sy, target, color, dmg) {
            const p = document.createElement('div');
            p.className = 'projectile';
            p.style.backgroundColor = color;
            p.style.left = sx + '%'; p.style.top = sy + '%';
            document.getElementById('map-container').appendChild(p);

            const tx = target.currentPos.x;
            const ty = target.currentPos.y;

            p.animate([
                { left: sx + '%', top: sy + '%' },
                { left: tx + '%', top: ty + '%' }
            ], { duration: 200 }).onfinish = () => {
                p.remove();
                if (monsters.includes(target)) {
                    target.hp -= dmg;
                    const fill = target.querySelector('.hp-bar-fill');
                    if (fill) fill.style.width = (target.hp / target.maxHp * 100) + "%";
                    if (target.hp <= 0) {
                        monsters.splice(monsters.indexOf(target), 1);
                        target.remove();
                        dCoin += 20;
                        document.getElementById('d-coin').innerText = `${dCoin} G`;
                    }
                }
            };
        }

        gameUpdate();
    </script>
</body>
</html>
