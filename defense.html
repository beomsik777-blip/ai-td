<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuestBody - Maze Defense KR/EN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #020617; color: white; font-family: 'Orbitron', 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; display: flex; flex-direction: column; }
        
        #map-container {
            width: 95vw; height: 95vw; max-width: 460px; max-height: 460px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); 
            border: 2px solid #334155; position: relative; margin: 5px auto;
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
        }
        .grid-cell { border: 0.1px solid rgba(56, 189, 248, 0.05); position: relative; z-index: 1; }
        .grid-cell.selected { background: rgba(251, 146, 60, 0.3); box-shadow: inset 0 0 15px #fb923c; }
        .wall-cell { background: #1e293b; border: 1px solid #475569; z-index: 2; position: relative; }
        .wall-cell::after { content: '🧱'; position: absolute; font-size: 8px; opacity: 0.4; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .range-highlight { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; z-index: 5; }

        #village { position: absolute; top: 36.36%; left: 36.36%; width: 27.27%; height: 27.27%; background: #0f172a; border: 2px solid #38bdf8; z-index: 10; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        #south-gate { position: absolute; bottom: 9.09%; left: 45.45%; width: 9.09%; height: 9.09%; background: #451a03; border: 2px solid #f59e0b; z-index: 20; display: flex; align-items: center; justify-content: center; }
        #gate-hp-container { position: absolute; top: -5px; width: 100%; height: 3px; background: #450a0a; border-radius: 1px; }
        #gate-hp-fill { height: 100%; background: #eab308; width: 100%; transition: width 0.3s; }

        .unit { position: absolute; width: 9.09%; height: 9.09%; z-index: 100; display: flex; align-items: center; justify-content: center; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.3s; pointer-events: none; }
        .unit-click-area { position: absolute; width: 9.09%; height: 9.09%; z-index: 110; cursor: pointer; }
        .unit.wait { filter: grayscale(1) brightness(0.6); opacity: 0.7; }
        .wait-timer-text { position: absolute; top: -15px; width: 100%; text-align: center; color: #38bdf8; font-weight: bold; font-size: 9px; text-shadow: 0 0 4px #000; z-index: 120; }

        .monster { position: absolute; width: 9.09%; height: 9.09%; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; transition: none; pointer-events: none; }
        .monster.stunned { filter: hue-rotate(180deg) brightness(1.5); }
        .monster-hp-text { font-size: 7px; color: #fff; font-weight: bold; margin-top: -2px; text-shadow: 1px 1px 1px #000; }
        .hp-bar-bg { width: 80%; height: 3px; background: #450a0a; position: absolute; top: -5px; border-radius: 1px; }
        .hp-bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }
        
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: 800; font-size: 12px; z-index: 200; pointer-events: none; animation: popUp 0.6s forwards; text-shadow: 1px 1px 2px black; }
        .crit { color: #facc15 !important; font-size: 16px !important; }
        @keyframes popUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-20px) scale(1.2); opacity: 0; } }

        .projectile { position: absolute; width: 6px; height: 6px; border-radius: 50%; z-index: 120; pointer-events: none; box-shadow: 0 0 10px currentColor; }
        .flash-screen { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 300; }
        .flash { animation: flashAnim 0.5s ease-out; }
        @keyframes flashAnim { 0% { opacity: 0.6; } 100% { opacity: 0; } }

        .ui-panel { background: #0f172a; border-top: 2px solid #334155; padding: 10px; flex-shrink: 0; }
        .ctrl-btn { background: #1e293b; color: white; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #000; font-size: 18px; }
        
        #unit-control-panel { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.98); border: 2px solid #fb923c; padding: 12px; border-radius: 12px; z-index: 250; display: none; min-width: 220px; box-shadow: 0 0 30px #000; text-align: center; }
        .info-tab { position: absolute; top: 45px; left: 5px; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; padding: 6px; border-radius: 4px; font-size: 7px; z-index: 70; }
        .start-hint { position: absolute; top: -14px; white-space: nowrap; font-size: 7px; color: #fbbf24; animation: bounce 1.5s infinite; font-weight: 300; width: 100%; text-align: center; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-3px); opacity: 1; } }
    </style>
</head>
<body>

    <audio id="audio-bgm" loop></audio>
    <div id="flash-overlay" class="flash-screen"></div>

    <header class="p-2 bg-slate-900 flex justify-between items-center border-b border-slate-700 shrink-0">
        <button onclick="location.href='index.html'" class="text-slate-400 text-[10px] font-bold uppercase">◀ HUB</button>
        <div class="text-center flex-1 mx-4">
            <div class="flex justify-between items-center mb-0.5">
                <span id="round-text" class="text-blue-400 text-[9px] font-bold uppercase">ROUND 1/20</span>
                <span id="level-display" class="text-purple-400 text-[9px] font-bold uppercase">LV. 1</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-1"><div id="village-hp-bar" class="bg-emerald-500 h-full w-full"></div></div>
            <div class="w-full bg-slate-800 h-0.5 rounded-full overflow-hidden"><div id="exp-fill" class="bg-purple-600 h-full w-0 transition-all"></div></div>
        </div>
        <div class="text-right">
            <p id="d-coin" class="text-[11px] font-bold text-yellow-400">300 G</p>
            <p id="monster-count" class="text-[8px] text-red-400 font-bold uppercase">Enemies: 0</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center bg-black relative">
        <div class="info-tab text-slate-300">
            <p class="text-blue-400 font-bold mb-1 underline text-[8px] uppercase">Unit Skill & Luck</p>
            <p>🛡️ Knight: Stun Chance (스턴)</p>
            <p class="text-orange-400">🏹 Archer: Long Range (장거리)</p>
            <p class="text-blue-300">🧙 Mage: Multi-Target (다중공격)</p>
            <p class="text-purple-400 font-bold">🐉 Dragon: Critical (치명타)</p>
            <p class="mt-1 text-emerald-400 border-t border-slate-800 pt-1 uppercase">Mana Regen: <span id="regen-val">0.1</span>/s</p>
        </div>

        <div id="unit-control-panel">
            <p id="ui-name" class="text-sm font-bold text-white mb-0.5 uppercase">Unit</p>
            <p id="ui-lv" class="text-[10px] text-orange-400 mb-3 font-bold uppercase">Level 1</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="upgradeUnit()" class="py-2 bg-emerald-700 rounded text-[9px] font-bold uppercase border-b-2 border-emerald-900 active:border-0 active:translate-y-1">Upgrade 강화<br>(<span id="ui-cost">100</span>G)</button>
                <button onclick="startMoveMode()" class="py-2 bg-blue-700 rounded text-[9px] font-bold uppercase border-b-2 border-blue-900 active:border-0 active:translate-y-1">Relocate 이동<br>(10s)</button>
                <button onclick="closeUnitPanel()" class="col-span-2 py-1 bg-slate-700 rounded text-[9px] font-bold uppercase mt-1">Close 닫기</button>
            </div>
        </div>

        <div id="map-container">
            <script>
                const map = document.getElementById('map-container');
                for(let i=0; i<121; i++) {
                    const r = Math.floor(i/11), c = i%11;
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    if((r === 1 || r === 9 || c === 1 || c === 9) && !(r===0||r===10||c===0||c===10)) cell.classList.add('wall-cell');
                    cell.id = `grid-${r}-${c}`;
                    cell.onclick = () => onCellClick(r, c);
                    map.appendChild(cell);
                }
            </script>
            <div id="timer-text" style="position: absolute; top: 6px; right: 10px; font-size: 10px; color: #ef4444; font-weight: bold; z-index: 65;">00:30</div>
            <div id="village">🏰</div>
            <div id="south-gate"><div id="gate-hp-container"><div id="gate-hp-fill"></div></div></div>
            
            <div id="player" class="unit">
                <div id="start-label" class="start-hint italic font-light lowercase">tap hero 히어로를 클릭하세요</div>
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div id="hero-trigger" class="unit-click-area" style="top:72.72%; left:45.45%; z-index:150;" onclick="handleHeroClick()"></div>
            <div id="unit-layer"></div>
        </div>
    </main>

    <div class="ui-panel">
        <div class="flex justify-between items-center gap-2 mb-2">
            <button id="install-btn" onclick="installGuardian()" class="flex-1 py-3 bg-orange-600 rounded font-bold text-[10px] uppercase hidden border-b-4 border-orange-800 shadow-lg">Deploy 설치 (150G)</button>
            <button id="start-btn" onclick="startWave()" class="flex-1 py-3 bg-blue-600 rounded font-bold text-[10px] uppercase opacity-50 pointer-events-none border-b-4 border-blue-800">Start Wave 웨이브 시작</button>
            <div class="flex flex-col flex-1 gap-1 items-center">
                <p id="mana-display" class="text-[9px] text-blue-400 font-bold uppercase tracking-tighter">Mana: 0/10</p>
                <button onclick="castMagic()" class="w-full py-2 bg-indigo-600 rounded text-[8px] font-bold uppercase border-b-4 border-indigo-800 leading-none">Mana Burst<br>마나 버스트</button>
            </div>
        </div>
        
        <div class="flex justify-between items-center">
            <div class="grid grid-cols-3 gap-1">
                <div></div><button class="ctrl-btn" onclick="moveHero(-1, 0)">▲</button><div></div>
                <button class="ctrl-btn" onclick="moveHero(0, -1)">◀</button>
                <button class="ctrl-btn" onclick="moveHero(1, 0)">▼</button>
                <button class="ctrl-btn" onclick="moveHero(0, 1)">▶</button>
            </div>
            <div class="bg-slate-900/80 p-2 rounded border border-slate-700 flex-1 ml-4 grid grid-cols-2 gap-1 text-center">
                <div><p class="text-[6px] text-slate-500 uppercase">Hero HP</p><p id="hero-hp-val" class="text-[9px] text-emerald-400 font-bold">100/100</p></div>
                <div><p class="text-[6px] text-slate-500 uppercase">Limit 설치제한</p><p id="guardian-limit" class="text-[9px] text-blue-400 font-bold">0/0</p></div>
                <div class="col-span-2 border-t border-slate-800 pt-1 text-[10px] font-bold text-orange-400 uppercase tracking-tighter">Hero ATK: <span id="hero-atk">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const audioBgm = document.getElementById('audio-bgm');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let gameStarted = false, isWaveActive = false, waveTimer = 30;
        let dCoin = 300, currentRound = 1, dLevel = 1, dExp = 0, dExpNext = 100;
        let villageHp = 100, gateHp = 500, gateHpMax = 500;
        let playerPos = { r: 8, c: 5 }, guardians = [], monsters = [];
        let selectedGrid = null, activeUnit = null, isMoveMode = false;
        let playerLastShot = 0, playerAtkSpeed = 650;

        let user_str = parseInt(localStorage.getItem('user_str')) || 0;
        let user_int = parseInt(localStorage.getItem('user_int')) || 0;
        let weekly = JSON.parse(localStorage.getItem('weekly_workout_data')) || { totalHpBonus: 0 };
        let playerHpMax = 100 + (weekly.totalHpBonus || 0);
        let playerHp = playerHpMax;
        let manaMax = 10 + user_int, currentMana = 0;

        window.onload = () => {
            const inbody = JSON.parse(localStorage.getItem('user_inbody'));
            document.getElementById('player').style.backgroundImage = inbody?.gender === 'woman' ? "url('image/woman.png')" : "url('image/man/man.png')";
            updatePlayerUI(); updateStats();
            setInterval(() => { if(gameStarted) { currentMana = Math.min(manaMax, currentMana + 0.1 * (1 + user_int/10)); updateStats(); } }, 1000);
        };

        function playHitSound(type) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = type === 'player' ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(type === 'player' ? 330 : 180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function handleHeroClick() {
            if (!gameStarted) {
                gameStarted = true; audioCtx.resume();
                document.getElementById('start-label').style.display = 'none';
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                audioBgm.src = 'music/townbgm.mp3'; audioBgm.play();
                updateStats();
            } else {
                if(activeUnit === 'player') { closeUnitPanel(); }
                else { activeUnit = 'player'; showRange(playerPos.r, playerPos.c, 2.5); }
            }
        }

        function onCellClick(r, c) {
            if (!gameStarted) return;
            
            // 🚀 이동 모드일 때 (빈 칸 클릭 시 바로 이동)
            if (isMoveMode && activeUnit) {
                if (isPosBlocked(r, c, false)) return;
                activeUnit.r = r; activeUnit.c = c;
                activeUnit.el.style.top = (r*9.09)+'%'; activeUnit.el.style.left = (c*9.09)+'%';
                activeUnit.area.style.top = (r*9.09)+'%'; activeUnit.area.style.left = (c*9.09)+'%';
                activeUnit.wait = 10000; // 10초
                activeUnit.el.classList.add('wait');
                
                // 쿨타임 텍스트 생성
                if(activeUnit.timerTxt) activeUnit.timerTxt.remove();
                const timerTxt = document.createElement('div');
                timerTxt.className = 'wait-timer-text';
                timerTxt.innerText = '10s';
                activeUnit.el.appendChild(timerTxt);
                activeUnit.timerTxt = timerTxt;

                isMoveMode = false; 
                closeUnitPanel(); 
                return;
            }

            const existing = guardians.find(g => g.r === r && g.c === c);
            if (existing) {
                if (activeUnit === existing) { closeUnitPanel(); }
                else { openUnitPanel(existing); }
            } 
            else {
                if(selectedGrid && selectedGrid.r === r && selectedGrid.c === c) {
                    document.getElementById(`grid-${r}-${c}`).classList.remove('selected');
                    document.getElementById('install-btn').classList.add('hidden');
                    selectedGrid = null;
                } else {
                    if(selectedGrid) document.getElementById(`grid-${selectedGrid.r}-${selectedGrid.c}`).classList.remove('selected');
                    if(isPosBlocked(r, c, true)) return;
                    selectedGrid = {r, c};
                    document.getElementById(`grid-${r}-${c}`).classList.add('selected');
                    document.getElementById('install-btn').classList.remove('hidden');
                    closeUnitPanel();
                }
            }
        }

        function isPosBlocked(r, c, isInstall) {
            if (isInstall && (r===0 || r===10 || c===0 || c===10)) return true;
            if (r===1 || r===9 || c===1 || c===9) return true;
            if (r >= 4 && r <= 6 && c >= 4 && c <= 6) return true;
            if (guardians.some(g => g.r === r && g.c === c)) return true;
            if (playerPos.r === r && playerPos.c === c) return true;
            return false;
        }

        function getUnitVisual(type, lv) {
            const icons = {
                "Knight": lv >= 7 ? '👑' : (lv >= 4 ? '⚔️' : '🛡️'),
                "Archer": lv >= 7 ? '💥' : (lv >= 4 ? '🏹' : '🎯'),
                "Mage": lv >= 7 ? '☄️' : (lv >= 4 ? '🧙' : '🔮'),
                "Dragon": lv >= 7 ? '🔥' : (lv >= 4 ? '🐲' : '🐉')
            };
            return icons[type] || '🛡️';
        }

        function installGuardian() {
            const limit = Math.floor(user_int/5) + currentRound;
            if (guardians.length >= limit || dCoin < 150) return;
            dCoin -= 150;
            const rand = Math.random();
            const type = rand < 0.05 ? "Dragon" : rand < 0.25 ? "Mage" : rand < 0.55 ? "Archer" : "Knight";
            const g = { r: selectedGrid.r, c: selectedGrid.c, lv: 1, type, wait: 0, lShot: 0 };
            g.atk = type==="Dragon"?100 : type==="Archer"?35 : 28;
            g.range = type==="Archer"?4.5 : type==="Mage"?3.2 : 2.5;
            g.cd = type==="Archer"?400 : type==="Mage"?1500 : 1200;
            
            const el = document.createElement('div'); el.className = 'unit guardian';
            el.innerHTML = getUnitVisual(type, 1);
            el.style.top = (g.r*9.09)+'%'; el.style.left = (g.c*9.09)+'%';
            
            const area = document.createElement('div'); area.className = 'unit-click-area';
            area.style.top = (g.r*9.09)+'%'; area.style.left = (g.c*9.09)+'%';
            area.onclick = (e) => { e.stopPropagation(); onCellClick(g.r, g.c); };
            
            const hb = document.createElement('div'); hb.className='hp-bar-bg'; const hf = document.createElement('div'); hf.className='hp-bar-fill w-full'; hb.appendChild(hf); el.appendChild(hb);
            document.getElementById('unit-layer').appendChild(el); document.getElementById('unit-layer').appendChild(area);
            g.el = el; g.area = area; g.hf = hf; guardians.push(g);
            
            document.getElementById(`grid-${selectedGrid.r}-${selectedGrid.c}`).classList.remove('selected');
            document.getElementById('install-btn').classList.add('hidden');
            selectedGrid = null; updateStats();
        }

        function openUnitPanel(g) {
            if(g.wait > 0) return;
            activeUnit = g; 
            document.getElementById('unit-control-panel').style.display='block'; 
            document.getElementById('ui-name').innerText = g.type;
            document.getElementById('ui-lv').innerText = `Lv.${g.lv} (Atk:${g.atk})`; 
            document.getElementById('ui-cost').innerText = g.lv * 100;
            showRange(g.r, g.c, g.range); 
        }
        function closeUnitPanel() { activeUnit = null; document.getElementById('unit-control-panel').style.display='none'; clearRange(); }
        
        function upgradeUnit() {
            if(!activeUnit) return;
            const cost = activeUnit.lv * 100;
            if(dCoin < cost) return;
            dCoin -= cost;
            activeUnit.lv++;
            activeUnit.atk += 25;
            if(activeUnit.type === "Archer") activeUnit.range += 0.3;
            activeUnit.el.innerHTML = getUnitVisual(activeUnit.type, activeUnit.lv);
            updateStats(); openUnitPanel(activeUnit);
        }
        function startMoveMode() { if(!activeUnit) return; isMoveMode = true; closeUnitPanel(); alert("Click an empty cell to move. 빈 칸을 눌러 이동하세요."); }

        function moveHero(dr, dc) {
            if (!gameStarted) return;
            const nr = playerPos.r + dr, nc = playerPos.c + dc;
            if (nr >= 0 && nr < 11 && nc >= 0 && nc < 11) {
                if (nr >= 4 && nr <= 6 && nc >= 4 && nc <= 6) return;
                const cell = document.getElementById(`grid-${nr}-${nc}`);
                if (cell.classList.contains('wall-cell') && !(nr === 8 && nc === 5)) return;
                playerPos.r = nr; playerPos.c = nc; updatePlayerUI();
            }
        }

        function updatePlayerUI() {
            const p = document.getElementById('player');
            const a = document.getElementById('hero-trigger');
            p.style.top = (playerPos.r * 9.09) + '%'; p.style.left = (playerPos.c * 9.09) + '%';
            a.style.top = (playerPos.r * 9.09) + '%'; a.style.left = (playerPos.c * 9.09) + '%';
            document.getElementById('player-hp-fill').style.width = (playerHp/playerHpMax*100) + "%";
            document.getElementById('hero-hp-val').innerText = `${Math.floor(playerHp)}/${playerHpMax}`;
        }

        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true; waveTimer = 30; gateHp = gateHpMax + (currentRound*150);
            document.getElementById('gate-hp-fill').style.width = "100%";
            document.getElementById('south-gate').style.display = "flex";
            document.getElementById('start-btn').classList.add('opacity-50', 'pointer-events-none');
            audioBgm.src = (currentRound % 5 === 0) ? 'music/bossbgm.mp3' : 'music/defensebgm.mp3'; audioBgm.play();
            
            let count = (currentRound % 5 === 0) ? 1 : 5 + currentRound;
            const spawnInterval = setInterval(() => {
                if(count-- <= 0) { clearInterval(spawnInterval); return; }
                const m = { r:0, c:0, hp:(currentRound%5===0?6000:350)+(currentRound*180), charge:false, lAtk:0, stun:0 };
                const pos = Math.random();
                if(pos<0.25){m.r=0; m.c=Math.floor(Math.random()*11);} else if(pos<0.5){m.r=10; m.c=Math.floor(Math.random()*11);}
                else if(pos<0.75){m.c=0; m.r=Math.floor(Math.random()*11);} else {m.c=10; m.r=Math.floor(Math.random()*11);}
                m.maxHp = m.hp; m.atk = 20 + currentRound*5;
                m.offX = (Math.random()-0.5)*3; m.offY = (Math.random()-0.5)*3;
                const el = document.createElement('div'); el.className='monster'; el.innerHTML=(currentRound%5===0)?'👹':'👾';
                const mb = document.createElement('div'); mb.className='hp-bar-bg'; const mf=document.createElement('div'); mf.className='hp-bar-fill w-full';
                const hpt = document.createElement('div'); hpt.className='monster-hp-text'; hpt.innerText = Math.floor(m.hp);
                mb.appendChild(mf); el.appendChild(mb); el.appendChild(hpt);
                document.getElementById('map-container').appendChild(el);
                m.el = el; m.mf = mf; m.hpt = hpt; monsters.push(m);
                document.getElementById('monster-count').innerText = `Enemies: ${monsters.length}`;
            }, 1000);
            timerInterval = setInterval(() => {
                waveTimer--; document.getElementById('timer-text').innerText = `00:${waveTimer<10?'0'+waveTimer:waveTimer}`;
                if(waveTimer <= 0) { clearInterval(timerInterval); monsters.forEach(m => m.charge = true); }
            }, 1000);
        }

        function gameLoop() {
            const now = Date.now();
            monsters.forEach((m, idx) => {
                if(m.stun > 0) { m.stun -= 16; m.el.classList.add('stunned'); return; }
                else { m.el.classList.remove('stunned'); }

                if (m.charge) {
                    const step = 0.04;
                    // 몬스터가 성문(10, 5)을 향해 최외곽 궤도(0, 10)를 따라 이동하게 로직 고정
                    if (gateHp > 0) {
                        // 현재 가로 테두리(0, 10)에 있을 때
                        if (Math.abs(m.r - 10) > 0.1 && (m.c === 0 || m.c === 10)) { m.r += step; } 
                        else if (Math.abs(m.c - 5) > 0.1) { 
                            m.r = 10; // 아래 테두리에 붙음
                            if (m.c < 5) m.c += step; else m.c -= step; 
                        }
                    } else {
                        // 성문 파괴 후 마을 진입
                        if (m.r > 5) m.r -= step;
                        if (Math.abs(m.c - 5) > 0.1) { if (m.c < 5) m.c += step; else m.c -= step; }
                    }
                    if (gateHp > 0 && Math.abs(m.r-10) < 0.3 && Math.abs(m.c-5) < 0.3) {
                        if(now - m.lAtk > 1500) { gateHp -= m.atk; m.lAtk = now; 
                            document.getElementById('gate-hp-fill').style.width = (gateHp/(500 + currentRound*150)*100)+'%';
                            if(gateHp<=0) document.getElementById('south-gate').style.display='none';
                        }
                    } else if (gateHp <= 0 && Math.hypot(m.r-5, m.c-5) < 0.2) {
                        villageHp -= 10; document.getElementById('village-hp-bar').style.width = villageHp+'%';
                        m.el.remove(); monsters.splice(idx, 1);
                        if(villageHp <= 0) { alert("VILLAGE DESTROYED"); location.reload(); }
                    }
                } else {
                    const step = 0.06;
                    if(Math.abs(m.r) <= 0.1 && m.c < 10) m.c += step; else if(Math.abs(m.c - 10) <= 0.1 && m.r < 10) m.r += step;
                    else if(Math.abs(m.r - 10) <= 0.1 && m.c > 0.1) m.c -= step; else if(Math.abs(m.c) <= 0.1 && m.r > 0.1) m.r -= step;
                }
                m.el.style.top = (m.r * 9.09 + m.offY) + '%'; m.el.style.left = (m.c * 9.09 + m.offX) + '%';
            });

            [...guardians, {r:playerPos.r, c:playerPos.c, atk:Math.floor(25+user_str/4+(dLevel-1)*15), isP:true, type:'Hero'}].forEach(u => {
                if(u.wait > 0) { 
                    u.wait -= 16; 
                    if(u.timerTxt) u.timerTxt.innerText = Math.ceil(u.wait/1000) + 's';
                    if(u.wait<=0) {
                        u.el.classList.remove('wait');
                        if(u.timerTxt) u.timerTxt.remove();
                    }
                    return; 
                }
                const cd = u.isP ? playerAtkSpeed : u.cd;
                const lt = u.isP ? playerLastShot : u.lShot;
                if (now - lt > cd) {
                    const range = u.isP ? 2.8 : u.range;
                    if (u.type === "Mage") {
                        const targets = monsters.filter(m => Math.hypot(u.r - m.r, u.c - m.c) <= range).slice(0, Math.min(monsters.length, 1 + Math.floor(u.lv/3)));
                        targets.forEach(t => fire(u.r, u.c, t, '#38bdf8', u.atk, false, u));
                        if(targets.length > 0) u.lShot = now;
                    } else {
                        const t = monsters.find(m => Math.hypot(u.r - m.r, u.c - m.c) <= range);
                        if(t) { fire(u.r, u.c, t, u.isP?'#fbbf24':'#38bdf8', u.atk, u.isP, u); if(u.isP) playerLastShot=now; else u.lShot=now; }
                    }
                }
            });

            if(isWaveActive && monsters.length === 0 && waveTimer < 20) {
                isWaveActive = false; currentRound++; dCoin += 250; updateStats();
                document.getElementById('start-btn').classList.remove('opacity-50', 'pointer-events-none');
                audioBgm.src = 'music/townbgm.mp3'; audioBgm.play();
            }
            requestAnimationFrame(gameLoop);
        }

        function fire(sr, sc, t, color, dmg, isP, unit) {
            playHitSound(isP ? 'player' : 'unit');
            let actualDmg = dmg;
            let isCrit = false;
            if(unit.type === "Dragon" && Math.random() < 0.15) { actualDmg *= 2; isCrit = true; }
            const p = document.createElement('div'); p.className = 'projectile'; p.style.backgroundColor = color; p.style.color = color;
            p.style.top = (sr*9.09+4.5)+'%'; p.style.left = (sc*9.09+4.5)+'%';
            document.getElementById('map-container').appendChild(p);
            p.animate([{top:p.style.top, left:p.style.left},{top:(t.r*9.09+4.5)+'%', left:(t.c*9.09+4.5)+'%'}], 120).onfinish = () => {
                p.remove(); t.hp -= actualDmg; if(t.mf) t.mf.style.width = (t.hp/t.maxHp*100)+'%';
                if(t.hpt) t.hpt.innerText = Math.max(0, Math.floor(t.hp));
                if(unit.type === "Knight" && Math.random() < (0.1 + unit.lv * 0.02)) { t.stun = 1000; }
                const d = document.createElement('div'); d.className=`dmg-text ${isCrit?'crit':''}`; d.innerText=isCrit ? 'CRIT '+actualDmg : actualDmg; 
                d.style.top=(t.r*9.09)+'%'; d.style.left=(t.c*9.09)+'%';
                document.getElementById('map-container').appendChild(d); setTimeout(()=>d.remove(), 400);
                if(t.hp<=0 && monsters.includes(t)) { monsters.splice(monsters.indexOf(t),1); t.el.remove(); dCoin+=50; dExp+=35; checkLvUp(); updateStats(); }
            };
        }

        function checkLvUp() { if(dExp >= dExpNext){ dLevel++; dExp=0; dExpNext=Math.floor(dExpNext*1.5); document.getElementById('flash-overlay').classList.add('flash'); setTimeout(()=>document.getElementById('flash-overlay').classList.remove('flash'), 500); } }
        function updateStats() {
            document.getElementById('hero-atk').innerText = Math.floor(25 + user_str/4 + (dLevel-1)*15);
            document.getElementById('mana-display').innerText = `Mana: ${Math.floor(currentMana)}/${manaMax}`;
            document.getElementById('level-display').innerText = `LV. ${dLevel}`;
            document.getElementById('d-coin').innerText = dCoin + " G";
            document.getElementById('exp-fill').style.width = (dExp/dExpNext*100)+'%';
            document.getElementById('round-text').innerText = `ROUND ${currentRound}/20`;
            document.getElementById('guardian-limit').innerText = `${guardians.length}/${Math.floor(user_int/5) + currentRound}`;
            document.getElementById('regen-val').innerText = (0.1 * (1 + user_int/10)).toFixed(1);
        }
        function showRange(r, c, rg) { clearRange(); for(let i=r-Math.floor(rg); i<=r+Math.floor(rg); i++) for(let j=c-Math.floor(rg); j<=c+Math.floor(rg); j++) { const cell = document.getElementById(`grid-${i}-${j}`); if(cell) cell.classList.add('range-highlight'); } }
        function clearRange() { document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('range-highlight')); }
        function castMagic() { if(currentMana>=5){currentMana-=5; playerAtkSpeed=320; setTimeout(()=>playerAtkSpeed=650, 5000); updateStats();} }
        gameLoop();
    </script>
</body>
</html>
